<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc"><title id="title">Aha Moment 후보 발굴</title><desc id="desc">유저 단위 데이터에서 초기 행동, 행동 조건, 검증할 후보로 이어지는 흐름.</desc><rect width="1200" height="500" fill="#ffffff"/><text x="64" y="72" fill="#0f172a" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',Arial" font-size="34" font-weight="700">유저 단위 행동에서 후보를 찾는다</text><g font-family="Arial" text-anchor="middle"><g fill="#f1f5f9" stroke="#3b82f6" stroke-width="2"><rect x="60" y="180" width="220" height="150" rx="18"/><rect x="350" y="180" width="220" height="150" rx="18"/><rect x="640" y="180" width="220" height="150" rx="18"/><rect x="930" y="180" width="220" height="150" rx="18"/></g><g fill="#0f172a" font-size="23" font-weight="700"><text x="170" y="225">1. 유저 데이터</text><text x="460" y="225">2. 초기 행동</text><text x="750" y="225">3. 조건</text><text x="1040" y="225">4. 후보</text></g><g fill="#475569" font-size="18"><text x="170" y="260">유저 ID</text><text x="170" y="288">타깃 0/1</text><text x="460" y="260">초대</text><text x="460" y="288">저장 · 공유</text><text x="750" y="260">윈도우</text><text x="750" y="288">횟수 임계</text><text x="1040" y="260">도달률 · Lift</text><text x="1040" y="288">F1 · 홀드아웃</text></g></g><path d="M280 255H350M570 255H640M860 255H930" stroke="#93c5fd" stroke-width="5"/><text x="600" y="420" text-anchor="middle" fill="#475569" font-family="Arial" font-size="20">후보 발굴은 연관을 찾고, 실험이 인과를 확인합니다.</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="510" viewBox="0 0 1200 510" role="img" aria-labelledby="title desc"><title id="title">Aha Moment 발굴에서 검증까지</title><desc id="desc">후보 발굴에서 온보딩 실험, 리텐션 검증, 운영 반영까지의 흐름.</desc><rect width="1200" height="510" fill="#ffffff"/><text x="64" y="72" fill="#0f172a" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',Arial" font-size="34" font-weight="700">후보 발굴에서 검증된 Aha Event까지</text><g font-family="Arial" text-anchor="middle"><g fill="#f1f5f9" stroke="#3b82f6" stroke-width="2"><rect x="50" y="200" width="210" height="115" rx="18"/><rect x="340" y="200" width="210" height="115" rx="18"/><rect x="630" y="200" width="210" height="115" rx="18"/><rect x="920" y="200" width="210" height="115" rx="18"/></g><g fill="#0f172a" font-size="21" font-weight="700"><text x="155" y="242">후보 찾기</text><text x="445" y="242">행동 유도</text><text x="735" y="242">리텐션 검증</text><text x="1025" y="242">운영 반영</text></g><g fill="#475569" font-size="17"><text x="155" y="276">행동 × 윈도우 × 횟수</text><text x="445" y="276">온보딩 또는 메시지</text><text x="735" y="276">A/B 또는 홀드아웃</text><text x="1025" y="276">지표 또는 광고 이벤트</text></g></g><path d="M260 257H340M550 257H630M840 257H920" stroke="#93c5fd" stroke-width="5"/><text x="735" y="374" text-anchor="middle" fill="#b45309" font-family="Arial" font-size="20">행동은 늘었는데 리텐션이 그대로라면, Aha Moment가 아니라 대리 지표로 봅니다.</text></svg>

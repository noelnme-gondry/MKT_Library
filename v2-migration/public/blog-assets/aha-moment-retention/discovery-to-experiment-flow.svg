<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="510" viewBox="0 0 1200 510" role="img" aria-labelledby="title desc"><title id="title">Aha Moment discovery to experiment</title><desc id="desc">Flow from candidate discovery through onboarding experiment and retention validation to operationalization.</desc><rect width="1200" height="510" fill="#101827"/><text x="64" y="72" fill="#f8fafc" font-family="Arial" font-size="34" font-weight="700">From candidate discovery to a verified Aha Event</text><g font-family="Arial" text-anchor="middle"><g fill="#1c2940" stroke="#60a5fa" stroke-width="2"><rect x="50" y="200" width="210" height="115" rx="18"/><rect x="340" y="200" width="210" height="115" rx="18"/><rect x="630" y="200" width="210" height="115" rx="18"/><rect x="920" y="200" width="210" height="115" rx="18"/></g><g fill="#f8fafc" font-size="21" font-weight="700"><text x="155" y="242">Find candidate</text><text x="445" y="242">Encourage action</text><text x="735" y="242">Test retention</text><text x="1025" y="242">Operationalize</text></g><g fill="#b9c7da" font-size="17"><text x="155" y="276">action × window × count</text><text x="445" y="276">onboarding or message</text><text x="735" y="276">A/B or holdout</text><text x="1025" y="276">metric or ad event</text></g></g><path d="M260 257H340M550 257H630M840 257H920" stroke="#93c5fd" stroke-width="5"/><text x="735" y="374" text-anchor="middle" fill="#fbbf24" font-family="Arial" font-size="20">Action rises but retention does not? Treat it as a proxy, not an Aha Moment.</text></svg>

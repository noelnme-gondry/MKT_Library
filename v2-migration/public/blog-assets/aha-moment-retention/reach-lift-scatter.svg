<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">도달률과 Lift로 후보 비교</title><desc id="desc">Illustrative scatter plot comparing candidate reach and retention Lift.</desc><rect width="1200" height="620" fill="#101827"/><text x="64" y="70" fill="#f8fafc" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',Arial" font-size="34" font-weight="700">도달률과 Lift는 같이 봐야 한다</text><text x="64" y="106" fill="#a8b5c8" font-family="Arial" font-size="20">예시 데이터 · Lift가 높다고 바로 쓸 수 있는 후보는 아니다</text><g stroke="#40516b" stroke-width="2"><line x1="150" y1="500" x2="1090" y2="500"/><line x1="150" y1="500" x2="150" y2="160"/><line x1="150" y1="330" x2="1090" y2="330"/><line x1="620" y1="160" x2="620" y2="500"/></g><g fill="#a8b5c8" font-family="Arial" font-size="18"><text x="1040" y="540">도달률</text><text x="80" y="180">Lift</text><text x="130" y="520">0%</text><text x="590" y="520">50%</text><text x="1030" y="520">100%</text><text x="110" y="340">2x</text><text x="110" y="175">4x</text></g><circle cx="412" cy="321" r="22" fill="#34d399"/><text x="412" y="295" text-anchor="middle" fill="#d1fae5" font-family="Arial" font-size="19">실행 가능</text><text x="412" y="354" text-anchor="middle" fill="#d1fae5" font-family="Arial" font-size="17">친구 3명 / D3</text><circle cx="225" cy="205" r="22" fill="#fbbf24"/><text x="225" y="172" text-anchor="middle" fill="#fde68a" font-family="Arial" font-size="18">희소·고Lift</text><text x="225" y="238" text-anchor="middle" fill="#fde68a" font-family="Arial" font-size="17">결제수단 등록</text><circle cx="1034" cy="391" r="22" fill="#f87171"/><text x="1034" y="365" text-anchor="middle" fill="#fecaca" font-family="Arial" font-size="18">너무 흔함</text><text x="1034" y="424" text-anchor="middle" fill="#fecaca" font-family="Arial" font-size="17">day-one open</text></svg>

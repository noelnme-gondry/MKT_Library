<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">Zero-data postback diagnosis</title><desc id="desc">Four diagnostic cards for zero installs, events, revenue, and cost.</desc><rect width="1200" height="630" fill="#F6F8FA"/><text x="70" y="90" fill="#102A43" font-family="Arial,sans-serif" font-size="40" font-weight="700">Zero data does not mean one cause</text><text x="70" y="132" fill="#486581" font-family="Arial,sans-serif" font-size="22">Start at the last verified point for each symptom</text><g font-family="Arial,sans-serif"><g><rect x="70" y="190" width="500" height="145" rx="18" fill="#E4F5EC"/><rect x="630" y="190" width="500" height="145" rx="18" fill="#EAF2FF"/><rect x="70" y="375" width="500" height="145" rx="18" fill="#FFF1D9"/><rect x="630" y="375" width="500" height="145" rx="18" fill="#FCE8EC"/></g><g fill="#102A43" font-size="28" font-weight="700"><text x="105" y="240">Zero installs</text><text x="665" y="240">Zero events</text><text x="105" y="425">Zero revenue</text><text x="665" y="425">Zero cost</text></g><g fill="#334E68" font-size="21"><text x="105" y="280">App ID · partner · SAN/S2S</text><text x="665" y="280">Event name · toggle · filter</text><text x="105" y="465">value · currency · deduplication</text><text x="665" y="465">API permission · account · sync</text></g></g></svg>

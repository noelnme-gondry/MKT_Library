<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Zero-data postback diagnosis</title><desc id="desc">Four diagnostic cards for zero installs, events, revenue, and cost data.</desc>
  <rect width="1200" height="630" fill="#F6F8FA"/><text x="70" y="90" fill="#102A43" font-family="Arial,sans-serif" font-size="40" font-weight="700">0으로 보이는 데이터, 같은 원인이 아닙니다</text><text x="70" y="132" fill="#486581" font-family="Arial,sans-serif" font-size="22">증상별 마지막 정상 지점부터 확인</text>
  <g font-family="Arial,sans-serif"><g><rect x="70" y="190" width="500" height="145" rx="18" fill="#E4F5EC"/><rect x="630" y="190" width="500" height="145" rx="18" fill="#EAF2FF"/><rect x="70" y="375" width="500" height="145" rx="18" fill="#FFF1D9"/><rect x="630" y="375" width="500" height="145" rx="18" fill="#FCE8EC"/></g><g fill="#102A43" font-size="28" font-weight="700"><text x="105" y="240">설치 0</text><text x="665" y="240">이벤트 0</text><text x="105" y="425">매출 0</text><text x="665" y="425">비용 0</text></g><g fill="#334E68" font-size="21"><text x="105" y="280">앱 ID · 파트너 · SAN/S2S</text><text x="665" y="280">이벤트명 · 토글 · 필터</text><text x="105" y="465">value · currency · 중복 제거</text><text x="665" y="465">API 권한 · 계정 · 동기화</text></g></g>
</svg>

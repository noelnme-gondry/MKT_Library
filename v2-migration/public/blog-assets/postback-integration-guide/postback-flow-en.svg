<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">Postback flow: app to network</title><desc id="desc">Five stages from an app event to network reporting.</desc><rect width="1200" height="630" fill="#091B2A"/><text x="72" y="90" fill="#FFF" font-family="Arial,sans-serif" font-size="40" font-weight="700">Postback: find the last verified point</text><text x="72" y="132" fill="#9CC8E8" font-family="Arial,sans-serif" font-size="22">Follow one test through app, MMP, and network</text><g font-family="Arial,sans-serif" text-anchor="middle"><g fill="#173B56"><rect x="72" y="260" width="180" height="140" rx="18"/><rect x="291" y="260" width="180" height="140" rx="18"/><rect x="510" y="260" width="180" height="140" rx="18"/><rect x="729" y="260" width="180" height="140" rx="18"/><rect x="948" y="260" width="180" height="140" rx="18"/></g><path d="M260 330h22l-12-12m12 12-12 12M479 330h22l-12-12m12 12-12 12M698 330h22l-12-12m12 12-12 12M917 330h22l-12-12m12 12-12 12" stroke="#75D5A1" stroke-width="5" fill="none"/><g fill="#FFF" font-size="23" font-weight="700"><text x="162" y="316">App event</text><text x="381" y="316">MMP collects</text><text x="600" y="316">Attribution</text><text x="819" y="316">Network send</text><text x="1038" y="316">Report · learn</text></g><g fill="#A9C5D8" font-size="17"><text x="162" y="350">install / purchase</text><text x="381" y="350">raw event</text><text x="600" y="350">rule applied</text><text x="819" y="350">postback</text><text x="1038" y="350">conversion</text></g></g><text x="72" y="530" fill="#FFF" font-family="Arial,sans-serif" font-size="26" font-weight="700">Diagnostic principle</text><text x="72" y="572" fill="#D6E8F5" font-family="Arial,sans-serif" font-size="24">Start after the last stage you can verify.</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Postback flow: app to MMP to ad network</title><desc id="desc">A five-step flow from app event through attribution and a network postback to reporting.</desc>
  <rect width="1200" height="630" fill="#091B2A"/><text x="72" y="90" fill="#FFF" font-family="Arial,sans-serif" font-size="40" font-weight="700">포스트백: 마지막 정상 지점을 찾는 흐름</text>
  <text x="72" y="132" fill="#9CC8E8" font-family="Arial,sans-serif" font-size="22">앱 · MMP · 매체가 같은 테스트를 어떻게 통과하는지 확인하세요</text>
  <g font-family="Arial,sans-serif" text-anchor="middle"><g fill="#173B56"><rect x="72" y="260" width="180" height="140" rx="18"/><rect x="291" y="260" width="180" height="140" rx="18"/><rect x="510" y="260" width="180" height="140" rx="18"/><rect x="729" y="260" width="180" height="140" rx="18"/><rect x="948" y="260" width="180" height="140" rx="18"/></g><g fill="#75D5A1"><path d="M260 330h22l-12-12m12 12-12 12M479 330h22l-12-12m12 12-12 12M698 330h22l-12-12m12 12-12 12M917 330h22l-12-12m12 12-12 12" stroke="#75D5A1" stroke-width="5" fill="none"/></g><g fill="#FFF" font-size="23" font-weight="700"><text x="162" y="316">앱 이벤트</text><text x="381" y="316">MMP 수집</text><text x="600" y="316">어트리뷰션</text><text x="819" y="316">매체 전송</text><text x="1038" y="316">보고·학습</text></g><g fill="#A9C5D8" font-size="17"><text x="162" y="350">install / purchase</text><text x="381" y="350">raw event</text><text x="600" y="350">rule applied</text><text x="819" y="350">postback</text><text x="1038" y="350">conversion</text></g></g>
  <text x="72" y="530" fill="#FFF" font-family="Arial,sans-serif" font-size="26" font-weight="700">진단 원칙</text><text x="72" y="572" fill="#D6E8F5" font-family="Arial,sans-serif" font-size="24">마지막으로 확인된 단계 다음부터 원인을 좁힙니다.</text>
</svg>

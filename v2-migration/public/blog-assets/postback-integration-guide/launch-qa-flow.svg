<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Postback launch QA flow</title><desc id="desc">A five-step quality-assurance sequence from integration setup to cost data verification.</desc>
  <rect width="1200" height="630" fill="#FFFDF8"/><text x="72" y="92" fill="#3D2C1E" font-family="Arial,sans-serif" font-size="40" font-weight="700">새 캠페인 포스트백 QA 5단계</text><text x="72" y="134" fill="#79624B" font-family="Arial,sans-serif" font-size="22">한 번의 테스트 설치를 앱부터 매체 보고까지 따라가세요</text>
  <g font-family="Arial,sans-serif"><path d="M142 278H1050" stroke="#D6A95E" stroke-width="7"/><g fill="#FFF" stroke="#D6A95E" stroke-width="7"><circle cx="142" cy="278" r="45"/><circle cx="369" cy="278" r="45"/><circle cx="596" cy="278" r="45"/><circle cx="823" cy="278" r="45"/><circle cx="1050" cy="278" r="45"/></g><g fill="#3D2C1E" font-size="28" font-weight="700" text-anchor="middle"><text x="142" y="288">1</text><text x="369" y="288">2</text><text x="596" y="288">3</text><text x="823" y="288">4</text><text x="1050" y="288">5</text></g><g fill="#3D2C1E" font-size="22" font-weight="700" text-anchor="middle"><text x="142" y="370">연동 확인</text><text x="369" y="370">테스트 설치</text><text x="596" y="370">이벤트 값</text><text x="823" y="370">매체 수신</text><text x="1050" y="370">비용 분리</text></g><g fill="#79624B" font-size="17" text-anchor="middle"><text x="142" y="404">앱 ID·계정</text><text x="369" y="404">MMP 기록</text><text x="596" y="404">매출·통화</text><text x="823" y="404">전환 집계</text><text x="1050" y="404">API·권한</text></g></g>

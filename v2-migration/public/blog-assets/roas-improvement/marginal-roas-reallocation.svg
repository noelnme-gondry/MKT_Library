<svg viewBox="0 0 660 380" xmlns="http://www.w3.org/2000/svg" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <rect x="0" y="0" width="660" height="380" fill="#ffffff"/>

  <!-- legend -->
  <rect x="70" y="20" width="14" height="14" rx="2" fill="#93C5FD"/>
  <text x="90" y="32" fill="#475569" font-size="12.5">평균 ROAS</text>
  <rect x="180" y="20" width="14" height="14" rx="2" fill="#2563EB"/>
  <text x="200" y="32" fill="#475569" font-size="12.5">한계 ROAS (다음 1원의 효율)</text>

  <!-- baseline -->
  <line x1="70" y1="300" x2="590" y2="300" stroke="#9CA3AF" stroke-width="1.5"/>

  <!-- A group -->
  <rect x="110" y="60" width="54" height="240" fill="#93C5FD"/>
  <text x="137" y="52" fill="#1D4ED8" font-size="14" font-weight="700" text-anchor="middle">480%</text>
  <rect x="172" y="220" width="54" height="80" fill="#2563EB"/>
  <text x="199" y="212" fill="#1D4ED8" font-size="14" font-weight="700" text-anchor="middle">160%</text>
  <text x="168" y="322" fill="#334155" font-size="14" font-weight="600" text-anchor="middle">A채널 (포화)</text>

  <!-- B group -->
  <rect x="404" y="140" width="54" height="160" fill="#93C5FD"/>
  <text x="431" y="132" fill="#1D4ED8" font-size="14" font-weight="700" text-anchor="middle">320%</text>
  <rect x="466" y="150" width="54" height="150" fill="#2563EB"/>
  <text x="493" y="142" fill="#1D4ED8" font-size="14" font-weight="700" text-anchor="middle">300%</text>
  <text x="462" y="322" fill="#334155" font-size="14" font-weight="600" text-anchor="middle">B채널 (여유)</text>

  <!-- reallocation arrow -->
  <path d="M 240 100 C 300 62, 360 62, 418 106" fill="none" stroke="#059669" stroke-width="2.2"/>
  <polygon points="410,98 423,109 408,111" fill="#059669"/>
  <text x="330" y="52" fill="#059669" font-size="13" font-weight="600" text-anchor="middle">예산 이동</text>

  <!-- caption -->
  <text x="330" y="352" fill="#6B7280" font-size="12.5" text-anchor="middle">평균은 A가 높지만, 추가 1원의 효율(한계 ROAS)은 B가 높아요. 그래서 A→B 재배분이 이득이에요.</text>
</svg>

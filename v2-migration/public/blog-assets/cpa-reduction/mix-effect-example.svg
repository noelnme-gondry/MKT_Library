<svg viewBox="0 0 680 340" xmlns="http://www.w3.org/2000/svg" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <rect x="0" y="0" width="680" height="340" fill="#ffffff"/>

  <!-- legend -->
  <rect x="150" y="26" width="14" height="14" rx="2" fill="#3B82F6"/>
  <text x="170" y="38" fill="#475569" font-size="12.5">A채널 · CPA 8,000원</text>
  <rect x="330" y="26" width="14" height="14" rx="2" fill="#EF4444"/>
  <text x="350" y="38" fill="#475569" font-size="12.5">B채널 · CPA 12,000원</text>

  <!-- Bar 1 지난달 -->
  <text x="132" y="132" fill="#334155" font-size="13.5" font-weight="600" text-anchor="end">지난달</text>
  <rect x="150" y="104" width="266" height="46" fill="#3B82F6"/>
  <rect x="416" y="104" width="114" height="46" fill="#EF4444"/>
  <text x="283" y="132" fill="#ffffff" font-size="13" font-weight="600" text-anchor="middle">A 70%</text>
  <text x="473" y="132" fill="#ffffff" font-size="13" font-weight="600" text-anchor="middle">B 30%</text>
  <text x="548" y="132" fill="#334155" font-size="14" font-weight="700" text-anchor="start">평균 9,200원</text>

  <!-- Bar 2 이번달 -->
  <text x="132" y="212" fill="#334155" font-size="13.5" font-weight="600" text-anchor="end">이번달</text>
  <rect x="150" y="184" width="190" height="46" fill="#3B82F6"/>
  <rect x="340" y="184" width="190" height="46" fill="#EF4444"/>
  <text x="245" y="212" fill="#ffffff" font-size="13" font-weight="600" text-anchor="middle">A 50%</text>
  <text x="435" y="212" fill="#ffffff" font-size="13" font-weight="600" text-anchor="middle">B 50%</text>
  <text x="548" y="212" fill="#DC2626" font-size="14" font-weight="700" text-anchor="start">평균 10,000원</text>

  <!-- caption -->
  <text x="340" y="286" fill="#6B7280" font-size="12.5" text-anchor="middle">채널별 CPA는 그대로예요. 비싼 B의 비중만 늘었는데 평균이 800원 올랐어요.</text>
  <text x="340" y="308" fill="#94A3B8" font-size="11.5" text-anchor="middle">* 비중은 전환 수 기준이에요.</text>
</svg>

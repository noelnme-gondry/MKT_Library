<svg viewBox="0 0 680 320" xmlns="http://www.w3.org/2000/svg" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <rect x="0" y="0" width="680" height="320" fill="#ffffff"/>

  <!-- 노출군 박스 -->
  <rect x="30" y="40" width="240" height="170" rx="12" fill="#EFF6FF" stroke="#BFDBFE"/>
  <text x="150" y="70" fill="#1E3A8A" font-size="16" font-weight="700" text-anchor="middle">노출군</text>
  <text x="150" y="90" fill="#64748B" font-size="12.5" text-anchor="middle">광고 봄</text>
  <text x="150" y="122" fill="#1D4ED8" font-size="14" font-weight="700" text-anchor="middle">전환율 5.0%</text>
  <rect x="120" y="128" width="60" height="67" fill="#2563EB"/>

  <!-- 통제군 박스 -->
  <rect x="410" y="40" width="240" height="170" rx="12" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="530" y="70" fill="#334155" font-size="16" font-weight="700" text-anchor="middle">통제군 (홀드아웃)</text>
  <text x="530" y="90" fill="#64748B" font-size="12.5" text-anchor="middle">광고 일부러 안 봄</text>
  <text x="530" y="122" fill="#475569" font-size="14" font-weight="700" text-anchor="middle">전환율 3.8%</text>
  <rect x="500" y="144" width="60" height="51" fill="#94A3B8"/>

  <!-- 마이너스 -->
  <text x="340" y="138" fill="#94A3B8" font-size="40" font-weight="400" text-anchor="middle">−</text>

  <!-- 결과 콜아웃 -->
  <rect x="30" y="232" width="620" height="52" rx="10" fill="#ECFDF5" stroke="#6EE7B7"/>
  <text x="52" y="256" fill="#065F46" font-size="14.5" font-weight="700">5.0% − 3.8% = 1.2%p</text>
  <text x="52" y="275" fill="#047857" font-size="13">이 1.2%p가 광고의 순증분 — 광고 덕분에 '진짜로' 더 생긴 전환이에요.</text>

  <!-- 주석 -->
  <text x="30" y="306" fill="#94A3B8" font-size="11.5">* 두 그룹은 광고 노출만 다르게, 나머지 조건은 같게 무작위로 나누는 게 핵심이에요.</text>
</svg>

<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <rect x="0" y="0" width="640" height="400" fill="#ffffff"/>

  <!-- 범례 -->
  <rect x="150" y="34" width="14" height="14" fill="#94A3B8"/>
  <text x="170" y="46" fill="#475569" font-size="13">평균 CPA (겉보기)</text>
  <rect x="300" y="34" width="14" height="14" fill="#2563EB"/>
  <text x="320" y="46" fill="#475569" font-size="13">한계 CPA (다음 1원)</text>

  <!-- 그리드 & Y축 라벨 -->
  <g stroke="#E5E7EB" stroke-width="1">
    <line x1="90" y1="330" x2="470" y2="330"/>
    <line x1="90" y1="250" x2="470" y2="250"/>
    <line x1="90" y1="171" x2="470" y2="171"/>
    <line x1="90" y1="91"  x2="470" y2="91"/>
  </g>
  <g fill="#9CA3AF" font-size="11" text-anchor="end">
    <text x="82" y="334">0</text>
    <text x="82" y="254">5,000</text>
    <text x="82" y="175">10,000</text>
    <text x="82" y="95">15,000</text>
  </g>
  <text x="60" y="70" fill="#9CA3AF" font-size="12" text-anchor="middle">CPA(원)</text>

  <!-- Y축 -->
  <line x1="90" y1="330" x2="90" y2="70" stroke="#9CA3AF" stroke-width="1.5"/>

  <!-- A채널 막대 -->
  <rect x="150" y="202.5" width="52" height="127.5" fill="#94A3B8"/>
  <rect x="206" y="91"    width="52" height="239"   fill="#2563EB"/>
  <text x="176" y="196" fill="#64748B" font-size="13" font-weight="600" text-anchor="middle">₩8,000</text>
  <text x="232" y="84"  fill="#1D4ED8" font-size="13" font-weight="700" text-anchor="middle">₩15,000</text>

  <!-- B채널 막대 -->
  <rect x="320" y="139" width="52" height="191" fill="#94A3B8"/>
  <rect x="376" y="123" width="52" height="207" fill="#2563EB"/>
  <text x="346" y="133" fill="#64748B" font-size="13" font-weight="600" text-anchor="middle">₩12,000</text>
  <text x="402" y="117" fill="#1D4ED8" font-size="13" font-weight="700" text-anchor="middle">₩13,000</text>

  <!-- 채널 라벨 -->
  <text x="204" y="352" fill="#374151" font-size="14" font-weight="600" text-anchor="middle">A채널</text>
  <text x="374" y="352" fill="#374151" font-size="14" font-weight="600" text-anchor="middle">B채널</text>

  <!-- 콜아웃 -->
  <rect x="484" y="96" width="148" height="112" rx="8" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
  <text x="498" y="120" fill="#1E3A8A" font-size="13" font-weight="700">이게 핵심이에요</text>
  <text x="498" y="142" fill="#1E40AF" font-size="12.5">평균은 A가 싸죠.</text>
  <text x="498" y="161" fill="#1E40AF" font-size="12.5">근데 '다음 1원'은</text>
  <text x="498" y="180" fill="#1E40AF" font-size="12.5">B가 더 쌉니다.</text>
  <text x="498" y="199" fill="#1D4ED8" font-size="12.5" font-weight="700">→ 추가 예산은 B로</text>
</svg>

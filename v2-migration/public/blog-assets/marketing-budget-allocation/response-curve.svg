<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <rect x="0" y="0" width="640" height="400" fill="#ffffff"/>

  <!-- 포화 구간 음영 -->
  <rect x="360" y="40" width="240" height="280" fill="#FEE2E2" opacity="0.7"/>

  <!-- 축 -->
  <line x1="80" y1="320" x2="600" y2="320" stroke="#9CA3AF" stroke-width="1.5"/>
  <line x1="80" y1="320" x2="80" y2="40" stroke="#9CA3AF" stroke-width="1.5"/>

  <!-- 축 라벨 -->
  <text x="600" y="345" fill="#6B7280" font-size="14" text-anchor="end">광고 지출 →</text>
  <text x="72" y="52" fill="#6B7280" font-size="14" text-anchor="end" transform="rotate(-90 72 52)">전환 수 ↑</text>

  <!-- 무릎(knee) 지점 점선 -->
  <line x1="360" y1="320" x2="360" y2="128" stroke="#DC2626" stroke-width="1.3" stroke-dasharray="5 4"/>

  <!-- 응답곡선 -->
  <path d="M 80 320 C 170 175, 265 130, 600 108" fill="none" stroke="#2563EB" stroke-width="3"/>

  <!-- 곡선 위 포인트 -->
  <circle cx="360" cy="128" r="4.5" fill="#DC2626"/>

  <!-- 초기 구간 주석 -->
  <text x="150" y="245" fill="#1E3A8A" font-size="14" font-weight="600">이 구간엔</text>
  <text x="150" y="265" fill="#1E3A8A" font-size="14" font-weight="600">1원당 전환이 쑥쑥</text>

  <!-- 무릎 주석 -->
  <text x="360" y="118" fill="#DC2626" font-size="13" font-weight="600" text-anchor="middle">여기부터 효율 뚝</text>

  <!-- 포화 구간 주석 -->
  <text x="480" y="200" fill="#991B1B" font-size="14" font-weight="600" text-anchor="middle">이 구간부턴</text>
  <text x="480" y="220" fill="#991B1B" font-size="14" font-weight="600" text-anchor="middle">부어도 찔끔</text>
  <text x="480" y="240" fill="#991B1B" font-size="14" font-weight="600" text-anchor="middle">(포화)</text>
</svg>

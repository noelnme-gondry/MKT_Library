<svg viewBox="0 0 700 400" xmlns="http://www.w3.org/2000/svg" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <rect x="0" y="0" width="700" height="400" fill="#ffffff"/>

  <!-- 축 -->
  <line x1="80" y1="310" x2="620" y2="310" stroke="#9CA3AF" stroke-width="1.5"/>
  <line x1="80" y1="70" x2="80" y2="310" stroke="#9CA3AF" stroke-width="1.5"/>
  <line x1="620" y1="70" x2="620" y2="310" stroke="#9CA3AF" stroke-width="1.5"/>

  <text x="72" y="62" fill="#2563EB" font-size="12" text-anchor="end" font-weight="600">CTR</text>
  <text x="628" y="62" fill="#EA580C" font-size="12" text-anchor="start" font-weight="600">빈도</text>

  <!-- x축 라벨 -->
  <text x="125" y="332" fill="#64748B" font-size="12" text-anchor="middle">1주</text>
  <text x="240" y="332" fill="#64748B" font-size="12" text-anchor="middle">2주</text>
  <text x="355" y="332" fill="#64748B" font-size="12" text-anchor="middle">3주</text>
  <text x="470" y="332" fill="#64748B" font-size="12" text-anchor="middle">4주</text>
  <text x="585" y="332" fill="#64748B" font-size="12" text-anchor="middle">5주</text>

  <!-- 교차 구간 음영 -->
  <rect x="355" y="70" width="265" height="240" fill="#FEF3C7" opacity="0.35"/>
  <line x1="355" y1="70" x2="355" y2="310" stroke="#D97706" stroke-width="1.6" stroke-dasharray="6 5"/>
  <text x="490" y="92" fill="#B45309" font-size="13" font-weight="700" text-anchor="middle">피로 구간</text>

  <!-- 빈도 (주황, 우상향) -->
  <polyline points="125,268 240,242 355,206 470,166 585,128" fill="none" stroke="#EA580C" stroke-width="2.8"/>
  <g fill="#EA580C">
    <circle cx="125" cy="268" r="4.5"/><circle cx="240" cy="242" r="4.5"/><circle cx="355" cy="206" r="4.5"/><circle cx="470" cy="166" r="4.5"/><circle cx="585" cy="128" r="4.5"/>
  </g>

  <!-- CTR (파랑, 우하향) -->
  <polyline points="125,128 240,136 355,172 470,220 585,262" fill="none" stroke="#2563EB" stroke-width="2.8"/>
  <g fill="#2563EB">
    <circle cx="125" cy="128" r="4.5"/><circle cx="240" cy="136" r="4.5"/><circle cx="355" cy="172" r="4.5"/><circle cx="470" cy="220" r="4.5"/><circle cx="585" cy="262" r="4.5"/>
  </g>

  <!-- 범례 -->
  <line x1="160" y1="358" x2="192" y2="358" stroke="#2563EB" stroke-width="2.8"/>
  <text x="200" y="363" fill="#475569" font-size="12.5">CTR (내려감)</text>
  <line x1="330" y1="358" x2="362" y2="358" stroke="#EA580C" stroke-width="2.8"/>
  <text x="370" y="363" fill="#475569" font-size="12.5">빈도 (올라감)</text>

  <!-- 캡션 -->
  <text x="350" y="390" fill="#6B7280" font-size="12.5" text-anchor="middle">같은 사람에게 자꾸 보여주는데(빈도↑) 반응은 식어요(CTR↓). 이 '가위 모양'이 피로도 신호예요.</text>
</svg>

<svg viewBox="0 0 700 420" xmlns="http://www.w3.org/2000/svg" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <rect x="0" y="0" width="700" height="420" fill="#ffffff"/>

  <!-- 시작 -->
  <rect x="248" y="24" width="204" height="46" rx="10" fill="#F1F5F9" stroke="#CBD5E1"/>
  <text x="350" y="53" fill="#334155" font-size="14" font-weight="700" text-anchor="middle">CTR이 떨어졌다</text>

  <line x1="350" y1="70" x2="350" y2="96" stroke="#94A3B8" stroke-width="2"/>
  <polygon points="345,90 350,102 355,90" fill="#94A3B8"/>

  <!-- 분기 질문 -->
  <rect x="196" y="104" width="308" height="46" rx="10" fill="#EFF6FF" stroke="#BFDBFE"/>
  <text x="350" y="133" fill="#1D4ED8" font-size="14" font-weight="700" text-anchor="middle">빈도도 같이 올라갔나?</text>

  <!-- 좌우 분기선 -->
  <line x1="350" y1="150" x2="350" y2="170" stroke="#94A3B8" stroke-width="2"/>
  <line x1="170" y1="170" x2="530" y2="170" stroke="#94A3B8" stroke-width="2"/>
  <line x1="170" y1="170" x2="170" y2="196" stroke="#94A3B8" stroke-width="2"/>
  <polygon points="165,190 170,202 175,190" fill="#94A3B8"/>
  <line x1="530" y1="170" x2="530" y2="196" stroke="#94A3B8" stroke-width="2"/>
  <polygon points="525,190 530,202 535,190" fill="#94A3B8"/>

  <text x="250" y="164" fill="#059669" font-size="13" font-weight="700" text-anchor="middle">예</text>
  <text x="452" y="164" fill="#DC2626" font-size="13" font-weight="700" text-anchor="middle">아니오</text>

  <!-- 왼쪽: 피로도 -->
  <rect x="52" y="204" width="236" height="92" rx="10" fill="#ECFDF5" stroke="#A7F3D0"/>
  <text x="170" y="234" fill="#047857" font-size="14.5" font-weight="700" text-anchor="middle">소재 피로도 가능성 높음</text>
  <text x="170" y="260" fill="#475569" font-size="12.5" text-anchor="middle">같은 사람에게 반복 노출</text>
  <text x="170" y="280" fill="#475569" font-size="12.5" text-anchor="middle">→ 소재 교체 / 타겟 확장</text>

  <!-- 오른쪽: 다른 원인 -->
  <rect x="412" y="204" width="236" height="92" rx="10" fill="#FEF2F2" stroke="#FECACA"/>
  <text x="530" y="234" fill="#B91C1C" font-size="14.5" font-weight="700" text-anchor="middle">피로가 아닐 수 있음</text>
  <text x="530" y="260" fill="#475569" font-size="12.5" text-anchor="middle">경쟁 심화 · 시즌 · 타겟 변경</text>
  <text x="530" y="280" fill="#475569" font-size="12.5" text-anchor="middle">→ 소재 갈아도 안 풀려요</text>

  <!-- 경고 박스 -->
  <rect x="90" y="322" width="520" height="60" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="350" y="346" fill="#475569" font-size="12.5" text-anchor="middle">빈도와 CTR이 같이 움직였다는 건 '연관'까지예요.</text>
  <text x="350" y="368" fill="#475569" font-size="12.5" text-anchor="middle">피로가 원인이라고 확정하려면, 소재만 바꿔서 비교해보는 수밖에 없어요.</text>
</svg>

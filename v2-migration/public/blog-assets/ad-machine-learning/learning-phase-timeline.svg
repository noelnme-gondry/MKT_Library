<svg viewBox="0 0 720 420" xmlns="http://www.w3.org/2000/svg" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <rect x="0" y="0" width="720" height="420" fill="#ffffff"/>

  <text x="360" y="30" fill="#334155" font-size="14.5" font-weight="700" text-anchor="middle">학습 중의 성과는 '진짜 실력'이 아니에요</text>

  <!-- 축 -->
  <line x1="70" y1="300" x2="660" y2="300" stroke="#9CA3AF" stroke-width="1.5"/>
  <line x1="70" y1="60" x2="70" y2="300" stroke="#9CA3AF" stroke-width="1.5"/>
  <text x="62" y="54" fill="#64748B" font-size="12" text-anchor="end">CPA</text>
  <text x="660" y="324" fill="#64748B" font-size="12" text-anchor="end">시간 →</text>

  <!-- 학습 구간 음영 -->
  <rect x="70" y="60" width="230" height="240" fill="#FEF3C7" opacity="0.45"/>
  <text x="185" y="84" fill="#B45309" font-size="13.5" font-weight="700" text-anchor="middle">학습 중</text>
  <text x="185" y="104" fill="#B45309" font-size="11.5" text-anchor="middle">CPA가 널뛰어요</text>

  <!-- 안정 구간 -->
  <rect x="300" y="60" width="360" height="240" fill="#ECFDF5" opacity="0.5"/>
  <text x="480" y="84" fill="#047857" font-size="13.5" font-weight="700" text-anchor="middle">학습 완료</text>
  <text x="480" y="104" fill="#047857" font-size="11.5" text-anchor="middle">여기부터가 판단할 수 있는 숫자</text>

  <!-- 경계선 -->
  <line x1="300" y1="60" x2="300" y2="300" stroke="#D97706" stroke-width="1.8" stroke-dasharray="6 5"/>
  <text x="300" y="322" fill="#B45309" font-size="12" font-weight="700" text-anchor="middle">전환 50건 도달</text>

  <!-- CPA 곡선: 널뛰다가 안정화 -->
  <polyline points="90,160 118,238 146,150 174,246 202,168 230,222 258,186 286,204 300,196 340,192 380,188 430,186 480,184 540,183 600,182 645,182"
            fill="none" stroke="#2563EB" stroke-width="2.6"/>

  <!-- 안정 구간 평균선 -->
  <line x1="300" y1="186" x2="655" y2="186" stroke="#059669" stroke-width="1.6" stroke-dasharray="5 4"/>

  <!-- 함정 표시 -->
  <circle cx="118" cy="238" r="7" fill="none" stroke="#DC2626" stroke-width="2"/>
  <text x="118" y="268" fill="#DC2626" font-size="11.5" font-weight="700" text-anchor="middle">"오 좋다!"</text>
  <circle cx="174" cy="246" r="7" fill="none" stroke="#DC2626" stroke-width="2"/>
  <text x="188" y="276" fill="#DC2626" font-size="11.5" font-weight="700" text-anchor="middle">"오 좋다!"</text>
  <circle cx="146" cy="150" r="7" fill="none" stroke="#DC2626" stroke-width="2"/>
  <text x="146" y="136" fill="#DC2626" font-size="11.5" font-weight="700" text-anchor="middle">"망했다!"</text>

  <!-- 캡션 -->
  <text x="360" y="360" fill="#6B7280" font-size="12.5" text-anchor="middle">학습 중엔 알고리즘이 이 사람 저 사람에게 시험 삼아 노출해요. 그래서 CPA가 튀어요.</text>
  <text x="360" y="382" fill="#6B7280" font-size="12.5" text-anchor="middle">그 널뛰는 숫자를 보고 끄거나 고치면, 학습이 리셋되면서 영원히 학습이 안 끝나요.</text>
  <text x="360" y="406" fill="#94A3B8" font-size="11.5" text-anchor="middle">* 메타 기준 '7일 내 전환 50건'. 매체·정책마다 다르고 바뀔 수 있어요.</text>
</svg>

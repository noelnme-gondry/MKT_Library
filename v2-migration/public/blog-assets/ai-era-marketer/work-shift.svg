<svg viewBox="0 0 720 440" xmlns="http://www.w3.org/2000/svg" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <rect x="0" y="0" width="720" height="440" fill="#ffffff"/>

  <!-- 헤더 -->
  <rect x="40" y="30" width="300" height="46" rx="10" fill="#F1F5F9" stroke="#CBD5E1"/>
  <text x="190" y="59" fill="#64748B" font-size="14.5" font-weight="700" text-anchor="middle">기계가 가져간 일</text>
  <rect x="380" y="30" width="300" height="46" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.8"/>
  <text x="530" y="59" fill="#1D4ED8" font-size="14.5" font-weight="700" text-anchor="middle">사람에게 남은 일</text>

  <!-- 왼쪽 목록 -->
  <g fill="#94A3B8">
    <text x="64" y="112" font-size="13.5">입찰가 수동 조정</text>
    <line x1="62" y1="107" x2="196" y2="107" stroke="#CBD5E1" stroke-width="1.4"/>
    <text x="64" y="150" font-size="13.5">타겟 상세 설정</text>
    <line x1="62" y1="145" x2="182" y2="145" stroke="#CBD5E1" stroke-width="1.4"/>
    <text x="64" y="188" font-size="13.5">지면·시간대 배분</text>
    <line x1="62" y1="183" x2="196" y2="183" stroke="#CBD5E1" stroke-width="1.4"/>
    <text x="64" y="226" font-size="13.5">소재 조합 테스트</text>
    <line x1="62" y1="221" x2="196" y2="221" stroke="#CBD5E1" stroke-width="1.4"/>
    <text x="64" y="264" font-size="13.5">예산 일일 미세조정</text>
    <line x1="62" y1="259" x2="210" y2="259" stroke="#CBD5E1" stroke-width="1.4"/>
  </g>

  <!-- 오른쪽 목록 -->
  <g>
    <circle cx="400" cy="107" r="4" fill="#2563EB"/>
    <text x="416" y="112" fill="#334155" font-size="13.5" font-weight="600">무엇을 최적화할지 정하기</text>
    <text x="416" y="130" fill="#94A3B8" font-size="11.5">기계는 목표를 못 정해요</text>

    <circle cx="400" cy="163" r="4" fill="#2563EB"/>
    <text x="416" y="168" fill="#334155" font-size="13.5" font-weight="600">그 숫자를 믿을지 판단하기</text>
    <text x="416" y="186" fill="#94A3B8" font-size="11.5">증분인가, 어차피 될 전환인가</text>

    <circle cx="400" cy="219" r="4" fill="#2563EB"/>
    <text x="416" y="224" fill="#334155" font-size="13.5" font-weight="600">예산을 어디에 걸지 결정</text>
    <text x="416" y="242" fill="#94A3B8" font-size="11.5">채널 간 배분은 여전히 사람 몫</text>

    <circle cx="400" cy="275" r="4" fill="#2563EB"/>
    <text x="416" y="280" fill="#334155" font-size="13.5" font-weight="600">실험 설계하고 검증하기</text>
    <text x="416" y="298" fill="#94A3B8" font-size="11.5">기계는 자기 성과를 못 검증해요</text>
  </g>

  <!-- 구분선 -->
  <line x1="360" y1="92" x2="360" y2="312" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- 하단 요약 -->
  <rect x="80" y="342" width="560" height="66" rx="12" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="360" y="370" fill="#334155" font-size="14" font-weight="700" text-anchor="middle">무게중심이 '조작'에서 '판단'으로 옮겨갔어요</text>
  <text x="360" y="394" fill="#64748B" font-size="12.5" text-anchor="middle">기계는 답을 최적화해요. 문제를 정하고, 답이 맞는지 확인하는 건 여전히 사람이에요.</text>
</svg>

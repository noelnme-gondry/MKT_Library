<svg viewBox="0 0 700 400" xmlns="http://www.w3.org/2000/svg" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <rect x="0" y="0" width="700" height="400" fill="#ffffff"/>

  <!-- 헤더 -->
  <text x="130" y="42" fill="#475569" font-size="13" font-weight="700" text-anchor="middle">증상</text>
  <text x="430" y="42" fill="#475569" font-size="13" font-weight="700" text-anchor="middle">의심할 곳</text>
  <line x1="40" y1="54" x2="660" y2="54" stroke="#CBD5E1" stroke-width="1.4"/>

  <!-- 행1 CPM 상승 -->
  <rect x="40" y="66" width="620" height="62" rx="8" fill="#F8FAFC"/>
  <text x="130" y="94" fill="#DC2626" font-size="14" font-weight="700" text-anchor="middle">CPM ↑</text>
  <text x="130" y="115" fill="#94A3B8" font-size="11.5" text-anchor="middle">노출 단가가 올랐다</text>
  <text x="260" y="94" fill="#334155" font-size="13">경쟁 심화 · 타겟이 너무 좁음 · 빈도 급등</text>
  <text x="260" y="115" fill="#64748B" font-size="12">→ 타겟 폭과 예산 대비 오디언스 크기를 보세요</text>

  <!-- 행2 CTR 하락 -->
  <rect x="40" y="136" width="620" height="62" rx="8" fill="#F1F5F9"/>
  <text x="130" y="164" fill="#DC2626" font-size="14" font-weight="700" text-anchor="middle">CTR ↓</text>
  <text x="130" y="185" fill="#94A3B8" font-size="11.5" text-anchor="middle">클릭이 안 된다</text>
  <text x="260" y="164" fill="#334155" font-size="13">소재 피로 · 후크 약화 · 타겟 부적합</text>
  <text x="260" y="185" fill="#64748B" font-size="12">→ 빈도가 같이 올랐는지부터 확인</text>

  <!-- 행3 전환율 하락 -->
  <rect x="40" y="206" width="620" height="62" rx="8" fill="#F8FAFC"/>
  <text x="130" y="234" fill="#DC2626" font-size="14" font-weight="700" text-anchor="middle">전환율 ↓</text>
  <text x="130" y="255" fill="#94A3B8" font-size="11.5" text-anchor="middle">들어와서 안 산다</text>
  <text x="260" y="234" fill="#334155" font-size="13">랜딩·결제 이슈 · 가격 변경 · 품절 · 트래킹 깨짐</text>
  <text x="260" y="255" fill="#64748B" font-size="12">→ 광고 밖을 보세요. 소재 갈아도 안 풀려요</text>

  <!-- 행4 전부 정상 -->
  <rect x="40" y="276" width="620" height="62" rx="8" fill="#F1F5F9"/>
  <text x="130" y="304" fill="#64748B" font-size="14" font-weight="700" text-anchor="middle">다 정상</text>
  <text x="130" y="325" fill="#94A3B8" font-size="11.5" text-anchor="middle">그런데 CPA만 나쁨</text>
  <text x="260" y="304" fill="#334155" font-size="13">배분(믹스) 변화 · 포화 · 시즌 · 외부 요인</text>
  <text x="260" y="325" fill="#64748B" font-size="12">→ 채널 안이 아니라 채널 '사이'를 보세요</text>

  <!-- 캡션 -->
  <text x="350" y="372" fill="#6B7280" font-size="12.5" text-anchor="middle">같은 'CPA 악화'라도 어느 지표가 흔들렸냐에 따라 처방이 완전히 달라져요.</text>
</svg>

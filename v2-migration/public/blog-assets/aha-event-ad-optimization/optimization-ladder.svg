<svg viewBox="0 0 720 350" xmlns="http://www.w3.org/2000/svg" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <rect width="720" height="350" fill="#fff"/>
  <text x="360" y="32" fill="#334155" font-size="15" font-weight="700" text-anchor="middle">Aha Event는 설치와 장기 성과 사이에서 작동하는 중간 신호입니다.</text>
  <g stroke="#94A3B8" stroke-width="2" fill="#94A3B8"><line x1="169" y1="138" x2="203" y2="138"/><polygon points="203,133 212,138 203,143"/><line x1="328" y1="138" x2="362" y2="138"/><polygon points="362,133 371,138 362,143"/><line x1="487" y1="138" x2="521" y2="138"/><polygon points="521,133 530,138 521,143"/></g>
  <g><rect x="38" y="105" width="131" height="66" rx="9" fill="#F1F5F9" stroke="#CBD5E1"/><rect x="212" y="105" width="116" height="66" rx="9" fill="#F1F5F9" stroke="#CBD5E1"/><rect x="371" y="99" width="116" height="78" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/><rect x="530" y="105" width="152" height="66" rx="9" fill="#F1F5F9" stroke="#CBD5E1"/></g>
  <g text-anchor="middle"><text x="104" y="133" fill="#334155" font-size="14" font-weight="700">설치</text><text x="104" y="153" fill="#64748B" font-size="11.5">빠르고 많음</text><text x="270" y="133" fill="#334155" font-size="14" font-weight="700">가입</text><text x="270" y="153" fill="#64748B" font-size="11.5">아직 얕은 신호</text><text x="429" y="132" fill="#1D4ED8" font-size="15" font-weight="700">Aha Event</text><text x="429" y="155" fill="#2563EB" font-size="11.5">가치 경험의 첫 행동</text><text x="606" y="133" fill="#334155" font-size="14" font-weight="700">D7 리텐션·매출</text><text x="606" y="153" fill="#64748B" font-size="11.5">늦지만 사업에 가까움</text></g>
  <path d="M104 210V244H429V210" fill="none" stroke="#60A5FA" stroke-width="1.5"/><text x="267" y="269" fill="#2563EB" font-size="12.5" font-weight="700" text-anchor="middle">광고와 온보딩이 함께 개선할 수 있는 구간</text>
  <path d="M429 292V314H606V292" fill="none" stroke="#CBD5E1" stroke-width="1.5"/><text x="518" y="337" fill="#64748B" font-size="12" text-anchor="middle">결과로 검증</text>
</svg>

<svg viewBox="0 0 700 380" xmlns="http://www.w3.org/2000/svg" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <rect x="0" y="0" width="700" height="380" fill="#ffffff"/>

  <text x="350" y="34" fill="#334155" font-size="14.5" font-weight="700" text-anchor="middle">같은 타겟도 예산이 커지면 답이 바뀌어요</text>

  <!-- 케이스 1: 작은 예산 -->
  <rect x="50" y="60" width="280" height="230" rx="12" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="190" y="90" fill="#334155" font-size="14" font-weight="700" text-anchor="middle">일 예산 20만원</text>

  <!-- 좁은 타겟 원 (충분) -->
  <circle cx="190" cy="170" r="58" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.8"/>
  <circle cx="190" cy="170" r="26" fill="#2563EB" opacity="0.75"/>
  <text x="190" y="176" fill="#ffffff" font-size="11.5" font-weight="700" text-anchor="middle">노출</text>
  <text x="190" y="248" fill="#1D4ED8" font-size="13" font-weight="700" text-anchor="middle">좁은 타겟도 OK</text>
  <text x="190" y="270" fill="#64748B" font-size="12" text-anchor="middle">예산이 작아 빈도가 안 튀어요</text>

  <!-- 케이스 2: 큰 예산 -->
  <rect x="370" y="60" width="280" height="230" rx="12" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="510" y="90" fill="#334155" font-size="14" font-weight="700" text-anchor="middle">일 예산 200만원</text>

  <!-- 좁은 타겟에 과다 노출 (넘침) -->
  <circle cx="510" cy="170" r="58" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.8"/>
  <circle cx="510" cy="170" r="54" fill="#DC2626" opacity="0.72"/>
  <text x="510" y="167" fill="#ffffff" font-size="11.5" font-weight="700" text-anchor="middle">노출 과다</text>
  <text x="510" y="184" fill="#ffffff" font-size="11" text-anchor="middle">빈도 급등</text>
  <text x="510" y="248" fill="#B91C1C" font-size="13" font-weight="700" text-anchor="middle">같은 타겟이면 터져요</text>
  <text x="510" y="270" fill="#64748B" font-size="12" text-anchor="middle">넓히지 않으면 피로도가 와요</text>

  <!-- 캡션 -->
  <text x="350" y="326" fill="#6B7280" font-size="12.5" text-anchor="middle">타겟 크기는 예산에 비례해야 해요. 예산만 올리고 타겟을 그대로 두면</text>
  <text x="350" y="348" fill="#6B7280" font-size="12.5" text-anchor="middle">같은 사람에게 더 자주 보여주게 되고, 빈도가 뛰면서 효율이 깨져요.</text>
</svg>

<svg viewBox="0 0 700 400" xmlns="http://www.w3.org/2000/svg" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <rect x="0" y="0" width="700" height="400" fill="#ffffff"/>

  <!-- 좌우 헤더 -->
  <rect x="50" y="26" width="270" height="44" rx="10" fill="#EFF6FF" stroke="#BFDBFE"/>
  <text x="185" y="54" fill="#1D4ED8" font-size="15" font-weight="700" text-anchor="middle">좁은 타겟 (상세)</text>
  <rect x="380" y="26" width="270" height="44" rx="10" fill="#ECFDF5" stroke="#A7F3D0"/>
  <text x="515" y="54" fill="#047857" font-size="15" font-weight="700" text-anchor="middle">넓은 타겟 (브로드)</text>

  <!-- 행 1: 도달 규모 -->
  <text x="350" y="102" fill="#64748B" font-size="12.5" font-weight="600" text-anchor="middle">도달 규모</text>
  <rect x="230" y="112" width="80" height="26" rx="5" fill="#93C5FD"/>
  <text x="222" y="130" fill="#475569" font-size="12" text-anchor="end">작음</text>
  <rect x="390" y="112" width="200" height="26" rx="5" fill="#6EE7B7"/>
  <text x="598" y="130" fill="#475569" font-size="12" text-anchor="start">큼</text>

  <!-- 행 2: CPM -->
  <text x="350" y="176" fill="#64748B" font-size="12.5" font-weight="600" text-anchor="middle">CPM (노출 단가)</text>
  <rect x="150" y="186" width="160" height="26" rx="5" fill="#93C5FD"/>
  <text x="142" y="204" fill="#DC2626" font-size="12" font-weight="600" text-anchor="end">비쌈</text>
  <rect x="390" y="186" width="90" height="26" rx="5" fill="#6EE7B7"/>
  <text x="488" y="204" fill="#059669" font-size="12" font-weight="600" text-anchor="start">쌈</text>

  <!-- 행 3: 전환율 -->
  <text x="350" y="250" fill="#64748B" font-size="12.5" font-weight="600" text-anchor="middle">전환율(CVR)</text>
  <rect x="140" y="260" width="170" height="26" rx="5" fill="#93C5FD"/>
  <text x="132" y="278" fill="#059669" font-size="12" font-weight="600" text-anchor="end">높음</text>
  <rect x="390" y="260" width="100" height="26" rx="5" fill="#6EE7B7"/>
  <text x="498" y="278" fill="#DC2626" font-size="12" font-weight="600" text-anchor="start">낮음</text>

  <!-- 행 4: 오디언스 고갈 속도 -->
  <text x="350" y="324" fill="#64748B" font-size="12.5" font-weight="600" text-anchor="middle">오디언스 고갈 속도</text>
  <rect x="150" y="334" width="160" height="26" rx="5" fill="#93C5FD"/>
  <text x="142" y="352" fill="#DC2626" font-size="12" font-weight="600" text-anchor="end">빠름</text>
  <rect x="390" y="334" width="80" height="26" rx="5" fill="#6EE7B7"/>
  <text x="478" y="352" fill="#059669" font-size="12" font-weight="600" text-anchor="start">느림</text>

  <!-- 중앙선 -->
  <line x1="350" y1="86" x2="350" y2="370" stroke="#E2E8F0" stroke-width="1.4"/>

  <!-- 캡션 -->
  <text x="350" y="390" fill="#6B7280" font-size="12.5" text-anchor="middle">어느 쪽도 정답이 아니에요. CPA는 이 네 가지가 맞물려서 결정돼요.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 390" role="img" aria-labelledby="title"><title id="title">주간 보고서의 네 단계</title><rect width="720" height="390" rx="20" fill="#F6F8FC"/><g font-family="Arial, sans-serif"><text x="32" y="43" font-size="26" fill="#19243C" text-anchor="start">숫자를 다음 결정으로 잇는 네 칸</text><rect x="32" y="70" width="312" height="126" rx="12" fill="#FFFFFF" stroke="#D5DDEA"/><text x="50" y="104" font-size="20" fill="#4056C7" text-anchor="start">01</text><text x="97" y="104" font-size="24" fill="#19243C" text-anchor="start">관측</text><text x="50" y="156" font-size="21" fill="#19243C" text-anchor="start">무엇이 달라졌나</text><rect x="376" y="70" width="312" height="126" rx="12" fill="#FFFFFF" stroke="#D5DDEA"/><text x="394" y="104" font-size="20" fill="#4056C7" text-anchor="start">02</text><text x="441" y="104" font-size="24" fill="#19243C" text-anchor="start">가설</text><text x="394" y="156" font-size="21" fill="#19243C" text-anchor="start">무엇을 확인할까</text><rect x="32" y="218" width="312" height="126" rx="12" fill="#FFFFFF" stroke="#D5DDEA"/><text x="50" y="252" font-size="20" fill="#4056C7" text-anchor="start">03</text><text x="97" y="252" font-size="24" fill="#19243C" text-anchor="start">결정</text><text x="50" y="304" font-size="21" fill="#19243C" text-anchor="start">지금 어떻게 할까</text><rect x="376" y="218" width="312" height="126" rx="12" fill="#FFFFFF" stroke="#D5DDEA"/><text x="394" y="252" font-size="20" fill="#4056C7" text-anchor="start">04</text><text x="441" y="252" font-size="24" fill="#19243C" text-anchor="start">재검토</text><text x="394" y="304" font-size="21" fill="#19243C" text-anchor="start">언제 무엇을 다시 볼까</text></g></svg>

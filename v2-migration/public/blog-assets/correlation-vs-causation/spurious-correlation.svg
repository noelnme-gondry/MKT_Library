<svg viewBox="0 0 680 340" xmlns="http://www.w3.org/2000/svg" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <rect x="0" y="0" width="680" height="340" fill="#ffffff"/>

  <!-- 범례 -->
  <rect x="150" y="26" width="14" height="14" fill="#2563EB"/>
  <text x="170" y="38" fill="#475569" font-size="12.5">아이스크림 판매</text>
  <rect x="330" y="26" width="14" height="14" fill="#F59E0B"/>
  <text x="350" y="38" fill="#475569" font-size="12.5">익사 사고</text>

  <!-- 축 -->
  <line x1="60" y1="270" x2="630" y2="270" stroke="#9CA3AF" stroke-width="1.5"/>

  <!-- 아이스크림 라인 (여름 정점) -->
  <polyline points="80,240 130,225 180,190 230,140 280,95 330,72 380,80 430,110 480,155 530,200 580,230 620,245"
            fill="none" stroke="#2563EB" stroke-width="2.8"/>

  <!-- 익사 라인 (같은 모양, 살짝 아래) -->
  <polyline points="80,252 130,240 180,208 230,162 280,120 330,100 380,106 430,132 480,172 530,214 580,242 620,255"
            fill="none" stroke="#F59E0B" stroke-width="2.8" stroke-dasharray="6 4"/>

  <!-- 여름 표시 -->
  <text x="330" y="292" fill="#94A3B8" font-size="12" text-anchor="middle">여름</text>
  <text x="90" y="292" fill="#94A3B8" font-size="12" text-anchor="middle">겨울</text>
  <text x="610" y="292" fill="#94A3B8" font-size="12" text-anchor="middle">겨울</text>

  <!-- 캡션 -->
  <text x="345" y="322" fill="#6B7280" font-size="13" text-anchor="middle">둘이 똑같이 움직여요. 그렇다고 아이스크림이 익사를 부르는 건 아니죠.</text>
</svg>

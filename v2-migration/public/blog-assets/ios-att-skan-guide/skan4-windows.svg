<svg viewBox="0 0 740 400" xmlns="http://www.w3.org/2000/svg" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <rect x="0" y="0" width="740" height="400" fill="#ffffff"/>

  <text x="34" y="34" fill="#0F172A" font-size="14" font-weight="700">SKAN 4의 전환 측정 창 3개</text>
  <text x="34" y="54" fill="#64748B" font-size="12">설치 시점(D0)부터 창이 열리고, 창이 닫힌 뒤 무작위 지연을 거쳐 포스트백이 옵니다.</text>

  <!-- 타임라인 축 -->
  <line x1="60" y1="120" x2="690" y2="120" stroke="#CBD5E1" stroke-width="1.5"/>
  <g fill="#94A3B8" font-size="11" text-anchor="middle">
    <text x="60" y="142">설치</text>
    <text x="240" y="142">2일</text>
    <text x="430" y="142">7일</text>
    <text x="660" y="142">35일</text>
  </g>
  <g stroke="#CBD5E1" stroke-width="1">
    <line x1="60" y1="114" x2="60" y2="126"/>
    <line x1="240" y1="114" x2="240" y2="126"/>
    <line x1="430" y1="114" x2="430" y2="126"/>
    <line x1="660" y1="114" x2="660" y2="126"/>
  </g>

  <!-- 창 블록 -->
  <rect x="60" y="82" width="180" height="28" rx="6" fill="#DBEAFE" stroke="#93C5FD"/>
  <text x="150" y="101" fill="#1D4ED8" font-size="12" font-weight="700" text-anchor="middle">창 1 · 0–2일</text>

  <rect x="240" y="82" width="190" height="28" rx="6" fill="#E0E7FF" stroke="#A5B4FC"/>
  <text x="335" y="101" fill="#4338CA" font-size="12" font-weight="700" text-anchor="middle">창 2 · 3–7일</text>

  <rect x="430" y="82" width="230" height="28" rx="6" fill="#EDE9FE" stroke="#C4B5FD"/>
  <text x="545" y="101" fill="#6D28D9" font-size="12" font-weight="700" text-anchor="middle">창 3 · 8–35일</text>

  <!-- 창별 반환값 -->
  <rect x="60" y="168" width="180" height="72" rx="8" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="150" y="192" fill="#334155" font-size="12" font-weight="700" text-anchor="middle">fine 또는 coarse</text>
  <text x="150" y="212" fill="#64748B" font-size="11.5" text-anchor="middle">fine = 0–63 (6비트)</text>
  <text x="150" y="230" fill="#64748B" font-size="11.5" text-anchor="middle">가장 정밀한 창</text>

  <rect x="240" y="168" width="190" height="72" rx="8" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="335" y="192" fill="#334155" font-size="12" font-weight="700" text-anchor="middle">coarse만</text>
  <text x="335" y="212" fill="#64748B" font-size="11.5" text-anchor="middle">low / medium / high</text>
  <text x="335" y="230" fill="#64748B" font-size="11.5" text-anchor="middle">3단계뿐</text>

  <rect x="430" y="168" width="230" height="72" rx="8" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="545" y="192" fill="#334155" font-size="12" font-weight="700" text-anchor="middle">coarse만</text>
  <text x="545" y="212" fill="#64748B" font-size="11.5" text-anchor="middle">장기 가치 확인용</text>
  <text x="545" y="230" fill="#64748B" font-size="11.5" text-anchor="middle">가장 늦게 도착</text>

  <!-- 연결선 -->
  <g stroke="#CBD5E1" stroke-width="1.2" stroke-dasharray="3 3">
    <line x1="150" y1="110" x2="150" y2="168"/>
    <line x1="335" y1="110" x2="335" y2="168"/>
    <line x1="545" y1="110" x2="545" y2="168"/>
  </g>

  <!-- 개인정보 임계 -->
  <rect x="34" y="266" width="672" height="90" rx="8" fill="#FEF3C7" stroke="#FCD34D"/>
  <text x="56" y="292" fill="#92400E" font-size="12.5" font-weight="700">crowd anonymity(개인정보 임계)가 받을 수 있는 정보량을 결정합니다</text>
  <text x="56" y="315" fill="#92400E" font-size="12">캠페인의 설치 볼륨이 작으면 티어가 낮아져 fine 값도, 세분화된 소스 ID도 안 옵니다.</text>
  <text x="56" y="336" fill="#92400E" font-size="12">캠페인을 잘게 쪼갤수록 각 조각의 티어가 내려가 데이터가 더 거칠어지는 역설이 생겨요.</text>

  <text x="370" y="380" fill="#9CA3AF" font-size="11.5" text-anchor="middle">세부 규칙은 버전마다 바뀝니다 — 판단 전 Apple 공식 문서를 확인하세요.</text>
</svg>

<svg viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <rect x="0" y="0" width="640" height="360" fill="#ffffff"/>

  <text x="320" y="32" fill="#334155" font-size="16" font-weight="700" text-anchor="middle">같은 사람의 같은 방문인데, 세는 방식이 달라요</text>

  <!-- 사용자 행동 타임라인 -->
  <line x1="70" y1="86" x2="570" y2="86" stroke="#94A3B8" stroke-width="2"/>
  <circle cx="110" cy="86" r="6" fill="#3B82F6"/>
  <text x="110" y="66" fill="#334155" font-size="12.5" font-weight="600" text-anchor="middle">23:50</text>
  <text x="110" y="112" fill="#64748B" font-size="12" text-anchor="middle">광고 클릭 유입</text>

  <circle cx="320" cy="86" r="6" fill="#3B82F6"/>
  <text x="320" y="66" fill="#334155" font-size="12.5" font-weight="600" text-anchor="middle">00:00</text>
  <text x="320" y="112" fill="#64748B" font-size="12" text-anchor="middle">자정 넘김</text>

  <circle cx="510" cy="86" r="6" fill="#3B82F6"/>
  <text x="510" y="66" fill="#334155" font-size="12.5" font-weight="600" text-anchor="middle">00:10</text>
  <text x="510" y="112" fill="#64748B" font-size="12" text-anchor="middle">검색으로 재진입</text>

  <!-- UA row -->
  <text x="70" y="172" fill="#334155" font-size="14" font-weight="700">UA</text>
  <rect x="110" y="152" width="185" height="34" rx="6" fill="#E2E8F0"/>
  <text x="202" y="174" fill="#475569" font-size="12.5" text-anchor="middle">세션 1</text>
  <rect x="305" y="152" width="175" height="34" rx="6" fill="#E2E8F0"/>
  <text x="392" y="174" fill="#475569" font-size="12.5" text-anchor="middle">세션 2 (자정 리셋)</text>
  <rect x="490" y="152" width="110" height="34" rx="6" fill="#E2E8F0"/>
  <text x="545" y="174" fill="#475569" font-size="12.5" text-anchor="middle">세션 3 (소스 변경)</text>
  <text x="600" y="212" fill="#DC2626" font-size="14" font-weight="700" text-anchor="end">= 3세션</text>

  <!-- GA4 row -->
  <text x="70" y="272" fill="#334155" font-size="14" font-weight="700">GA4</text>
  <rect x="110" y="252" width="490" height="34" rx="6" fill="#BFDBFE"/>
  <text x="355" y="274" fill="#1D4ED8" font-size="12.5" font-weight="600" text-anchor="middle">세션 1 — 30분 넘게 안 쉬었으니 계속 같은 세션</text>
  <text x="600" y="312" fill="#1D4ED8" font-size="14" font-weight="700" text-anchor="end">= 1세션</text>

  <text x="320" y="348" fill="#6B7280" font-size="12.5" text-anchor="middle">GA4 세션이 UA보다 적게 나오는 건 유실이 아니라 정의 차이예요.</text>
</svg>

<svg viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <rect x="0" y="0" width="640" height="360" fill="#ffffff"/>

  <text x="320" y="34" fill="#334155" font-size="16" font-weight="700" text-anchor="middle">'일요일 전환 수'를 요일별로 다시 조회하면</text>

  <!-- baseline -->
  <line x1="80" y1="290" x2="600" y2="290" stroke="#9CA3AF" stroke-width="1.5"/>

  <!-- 월요일 15건 -->
  <rect x="112" y="185" width="66" height="105" fill="#FCA5A5"/>
  <text x="145" y="175" fill="#DC2626" font-size="15" font-weight="700" text-anchor="middle">15건</text>
  <text x="145" y="312" fill="#334155" font-size="13" font-weight="600" text-anchor="middle">월요일 조회</text>

  <!-- 화요일 19건 -->
  <rect x="242" y="157" width="66" height="133" fill="#93C5FD"/>
  <text x="275" y="147" fill="#2563EB" font-size="15" font-weight="700" text-anchor="middle">19건</text>
  <text x="275" y="312" fill="#334155" font-size="13" font-weight="600" text-anchor="middle">화요일 조회</text>

  <!-- 수요일 21건 -->
  <rect x="372" y="143" width="66" height="147" fill="#60A5FA"/>
  <text x="405" y="133" fill="#2563EB" font-size="15" font-weight="700" text-anchor="middle">21건</text>
  <text x="405" y="312" fill="#334155" font-size="13" font-weight="600" text-anchor="middle">수요일 조회</text>

  <!-- 목요일 22건 확정 -->
  <rect x="502" y="136" width="66" height="154" fill="#3B82F6"/>
  <text x="535" y="126" fill="#1D4ED8" font-size="15" font-weight="700" text-anchor="middle">22건</text>
  <text x="535" y="312" fill="#334155" font-size="13" font-weight="600" text-anchor="middle">목요일 조회</text>
  <text x="535" y="330" fill="#64748B" font-size="12" text-anchor="middle">(사실상 확정)</text>

  <text x="320" y="352" fill="#6B7280" font-size="12.5" text-anchor="middle">월요일 아침에 '어제 성과'로 보고하면, 며칠 뒤엔 다른 숫자가 돼 있어요.</text>
</svg>

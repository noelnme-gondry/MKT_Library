<svg viewBox="0 0 700 400" xmlns="http://www.w3.org/2000/svg" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <rect x="0" y="0" width="700" height="400" fill="#ffffff"/>

  <!-- 축 -->
  <line x1="80" y1="310" x2="630" y2="310" stroke="#9CA3AF" stroke-width="1.5"/>
  <line x1="80" y1="50" x2="80" y2="310" stroke="#9CA3AF" stroke-width="1.5"/>
  <text x="70" y="44" fill="#64748B" font-size="12.5" text-anchor="end">전환 수</text>
  <text x="630" y="334" fill="#64748B" font-size="12.5" text-anchor="end">광고비 →</text>

  <!-- 기대선 (선형, 점선) -->
  <line x1="80" y1="310" x2="600" y2="66" stroke="#94A3B8" stroke-width="2.2" stroke-dasharray="7 5"/>
  <text x="576" y="56" fill="#64748B" font-size="12.5" text-anchor="middle">기대: 2배 쓰면 2배</text>

  <!-- 실제 응답곡선 (포화) -->
  <path d="M 80,310 C 200,222 280,178 380,158 C 470,142 540,136 600,132" fill="none" stroke="#2563EB" stroke-width="3"/>
  <text x="596" y="156" fill="#1D4ED8" font-size="12.5" font-weight="600" text-anchor="middle">실제</text>

  <!-- 괴리 영역 표시 -->
  <line x1="600" y1="66" x2="600" y2="132" stroke="#DC2626" stroke-width="2"/>
  <line x1="594" y1="66" x2="606" y2="66" stroke="#DC2626" stroke-width="2"/>
  <line x1="594" y1="132" x2="606" y2="132" stroke="#DC2626" stroke-width="2"/>
  <text x="646" y="103" fill="#DC2626" font-size="12.5" font-weight="700" text-anchor="middle">괴리</text>

  <!-- 현재 지점 -->
  <circle cx="200" cy="222" r="6" fill="#059669"/>
  <line x1="200" y1="222" x2="200" y2="310" stroke="#059669" stroke-width="1.4" stroke-dasharray="4 4"/>
  <text x="200" y="332" fill="#059669" font-size="12" font-weight="600" text-anchor="middle">지금</text>
  <text x="200" y="206" fill="#059669" font-size="12" font-weight="600" text-anchor="middle">여유 구간</text>

  <!-- 포화 지점 -->
  <circle cx="430" cy="150" r="6" fill="#DC2626"/>
  <line x1="430" y1="150" x2="430" y2="310" stroke="#DC2626" stroke-width="1.4" stroke-dasharray="4 4"/>
  <text x="430" y="332" fill="#DC2626" font-size="12" font-weight="600" text-anchor="middle">여기부터 포화</text>

  <!-- 캡션 -->
  <text x="350" y="372" fill="#6B7280" font-size="12.5" text-anchor="middle">예산은 선형으로 늘려도 전환은 안 그래요. 곡선이 눕는 지점을 넘기면</text>
  <text x="350" y="392" fill="#6B7280" font-size="12.5" text-anchor="middle">돈은 두 배 쓰는데 전환은 1.2배만 늘어요. 그게 CPA 상승으로 나타나고요.</text>
</svg>

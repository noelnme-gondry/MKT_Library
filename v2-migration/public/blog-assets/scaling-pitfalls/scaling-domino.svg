<svg viewBox="0 0 700 320" xmlns="http://www.w3.org/2000/svg" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <rect x="0" y="0" width="700" height="320" fill="#ffffff"/>

  <text x="350" y="34" fill="#334155" font-size="14.5" font-weight="700" text-anchor="middle">타겟을 그대로 두고 예산만 올리면, 이렇게 연쇄로 무너져요</text>

  <!-- 1 -->
  <rect x="30" y="74" width="112" height="76" rx="10" fill="#ECFDF5" stroke="#A7F3D0"/>
  <text x="86" y="106" fill="#047857" font-size="13.5" font-weight="700" text-anchor="middle">예산 ↑</text>
  <text x="86" y="128" fill="#64748B" font-size="11.5" text-anchor="middle">2배 증액</text>

  <polygon points="150,112 168,104 168,120" fill="#94A3B8"/>

  <!-- 2 -->
  <rect x="176" y="74" width="112" height="76" rx="10" fill="#FEF3C7" stroke="#FDE68A"/>
  <text x="232" y="106" fill="#B45309" font-size="13.5" font-weight="700" text-anchor="middle">빈도 ↑</text>
  <text x="232" y="128" fill="#64748B" font-size="11.5" text-anchor="middle">같은 사람에 반복</text>

  <polygon points="296,112 314,104 314,120" fill="#94A3B8"/>

  <!-- 3 -->
  <rect x="322" y="74" width="112" height="76" rx="10" fill="#FEE2E2" stroke="#FECACA"/>
  <text x="378" y="106" fill="#B91C1C" font-size="13.5" font-weight="700" text-anchor="middle">CTR ↓</text>
  <text x="378" y="128" fill="#64748B" font-size="11.5" text-anchor="middle">소재 피로</text>

  <polygon points="442,112 460,104 460,120" fill="#94A3B8"/>

  <!-- 4 -->
  <rect x="468" y="74" width="112" height="76" rx="10" fill="#FEE2E2" stroke="#FECACA"/>
  <text x="524" y="106" fill="#B91C1C" font-size="13.5" font-weight="700" text-anchor="middle">CPM ↑</text>
  <text x="524" y="128" fill="#64748B" font-size="11.5" text-anchor="middle">반응 낮으니 단가↑</text>

  <polygon points="588,112 606,104 606,120" fill="#94A3B8"/>

  <!-- 5 -->
  <rect x="612" y="74" width="58" height="76" rx="10" fill="#DC2626"/>
  <text x="641" y="106" fill="#ffffff" font-size="13.5" font-weight="700" text-anchor="middle">CPA</text>
  <text x="641" y="126" fill="#ffffff" font-size="15" font-weight="700" text-anchor="middle">↑↑</text>

  <!-- 진입점 화살표 -->
  <path d="M 232 190 C 232 220, 378 220, 378 194" fill="none" stroke="#94A3B8" stroke-width="1.6" stroke-dasharray="5 4"/>
  <text x="305" y="238" fill="#64748B" font-size="12" text-anchor="middle">여기를 끊어야 해요</text>

  <!-- 처방 박스 -->
  <rect x="70" y="256" width="560" height="46" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="350" y="284" fill="#475569" font-size="12.5" text-anchor="middle">처방: 예산을 올릴 때 타겟도 같이 넓히거나, 소재를 여러 개 준비해두거나.</text>
</svg>

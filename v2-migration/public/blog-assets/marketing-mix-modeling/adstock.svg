<svg viewBox="0 0 660 340" xmlns="http://www.w3.org/2000/svg" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <rect x="0" y="0" width="660" height="340" fill="#ffffff"/>

  <!-- Y축 라벨 -->
  <text x="40" y="150" fill="#9CA3AF" font-size="12" text-anchor="middle" transform="rotate(-90 40 150)">광고 효과</text>

  <!-- X축 -->
  <line x1="70" y1="280" x2="600" y2="280" stroke="#9CA3AF" stroke-width="1.5"/>

  <!-- 효과 막대 (day 0..6, 감쇠) -->
  <g fill="#2563EB">
    <rect x="90"  y="80"  width="40" height="200"/>
    <rect x="160" y="160" width="40" height="120"/>
    <rect x="230" y="208" width="40" height="72"/>
    <rect x="300" y="236" width="40" height="44"/>
    <rect x="370" y="254" width="40" height="26"/>
    <rect x="440" y="264" width="40" height="16"/>
    <rect x="510" y="270" width="40" height="10"/>
  </g>

  <!-- X축 라벨 -->
  <g fill="#94A3B8" font-size="12" text-anchor="middle">
    <text x="110" y="298">0일</text>
    <text x="180" y="298">1일</text>
    <text x="250" y="298">2일</text>
    <text x="320" y="298">3일</text>
    <text x="390" y="298">4일</text>
    <text x="460" y="298">5일</text>
    <text x="530" y="298">6일</text>
  </g>

  <!-- day0 주석 -->
  <text x="110" y="66" fill="#1D4ED8" font-size="12.5" font-weight="700" text-anchor="middle">여기서 광고 한 번</text>

  <!-- 캡션 -->
  <text x="330" y="326" fill="#6B7280" font-size="13" text-anchor="middle">광고를 한 번 해도 효과는 며칠 이어져요 — 이게 adstock(잔존효과)이에요.</text>
</svg>

<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <rect x="0" y="0" width="640" height="400" fill="#ffffff"/>

  <!-- 상단 라벨 -->
  <text x="240" y="46" fill="#334155" font-size="14" font-weight="600" text-anchor="middle">한 달 매출 = 100%</text>

  <!-- 스택 막대 (아래→위: 베이스라인, 검색, SNS, 디스플레이) -->
  <rect x="170" y="186"   width="140" height="154"  fill="#E2E8F0" stroke="#CBD5E1"/>
  <rect x="170" y="135.6" width="140" height="50.4" fill="#2563EB"/>
  <rect x="170" y="93.6"  width="140" height="42"   fill="#60A5FA"/>
  <rect x="170" y="60"    width="140" height="33.6" fill="#BFDBFE"/>

  <!-- 세그먼트 % -->
  <text x="240" y="270" fill="#475569" font-size="15" font-weight="700" text-anchor="middle">55%</text>
  <text x="240" y="166" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">18%</text>
  <text x="240" y="119" fill="#ffffff" font-size="12.5" font-weight="700" text-anchor="middle">15%</text>
  <text x="240" y="82"  fill="#1E3A8A" font-size="12" font-weight="700" text-anchor="middle">12%</text>

  <!-- 범례 -->
  <rect x="360" y="108" width="16" height="16" fill="#BFDBFE"/>
  <text x="384" y="121" fill="#475569" font-size="13">디스플레이광고</text>
  <rect x="360" y="143" width="16" height="16" fill="#60A5FA"/>
  <text x="384" y="156" fill="#475569" font-size="13">SNS광고</text>
  <rect x="360" y="178" width="16" height="16" fill="#2563EB"/>
  <text x="384" y="191" fill="#475569" font-size="13">검색광고</text>
  <rect x="360" y="213" width="16" height="16" fill="#E2E8F0" stroke="#CBD5E1"/>
  <text x="384" y="226" fill="#475569" font-size="13">베이스라인</text>
  <text x="384" y="248" fill="#94A3B8" font-size="11.5">광고 없어도 나올 매출</text>
  <text x="384" y="264" fill="#94A3B8" font-size="11.5">(브랜드·오가닉·재구매)</text>

  <!-- 캡션 -->
  <text x="320" y="380" fill="#6B7280" font-size="13" text-anchor="middle">MMM은 매출을 '베이스라인 + 채널별 기여'로 쪼개요.</text>
</svg>

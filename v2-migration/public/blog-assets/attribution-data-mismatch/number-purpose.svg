<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <rect x="0" y="0" width="640" height="400" fill="#ffffff"/>

  <text x="320" y="34" fill="#334155" font-size="16" font-weight="700" text-anchor="middle">질문이 다르면, 보는 숫자도 달라야 해요</text>

  <!-- headers -->
  <text x="180" y="72" fill="#64748B" font-size="13" font-weight="700" text-anchor="middle">이 질문에는</text>
  <text x="490" y="72" fill="#64748B" font-size="13" font-weight="700" text-anchor="middle">이 숫자를</text>

  <!-- row 1 -->
  <rect x="40" y="88" width="280" height="52" rx="8" fill="#F1F5F9"/>
  <text x="180" y="112" fill="#334155" font-size="13" font-weight="600" text-anchor="middle">이 소재가 저 소재보다 나은가?</text>
  <text x="180" y="130" fill="#64748B" font-size="11.5" text-anchor="middle">같은 매체 안의 상대 비교</text>
  <line x1="330" y1="114" x2="370" y2="114" stroke="#94A3B8" stroke-width="2"/>
  <rect x="380" y="88" width="220" height="52" rx="8" fill="#DBEAFE"/>
  <text x="490" y="119" fill="#1D4ED8" font-size="13" font-weight="700" text-anchor="middle">매체 대시보드</text>

  <!-- row 2 -->
  <rect x="40" y="156" width="280" height="52" rx="8" fill="#F1F5F9"/>
  <text x="180" y="180" fill="#334155" font-size="13" font-weight="600" text-anchor="middle">채널 A와 B, 어디가 더 나은가?</text>
  <text x="180" y="198" fill="#64748B" font-size="11.5" text-anchor="middle">채널을 가로지르는 비교</text>
  <line x1="330" y1="182" x2="370" y2="182" stroke="#94A3B8" stroke-width="2"/>
  <rect x="380" y="156" width="220" height="52" rx="8" fill="#DBEAFE"/>
  <text x="490" y="180" fill="#1D4ED8" font-size="13" font-weight="700" text-anchor="middle">MMP 또는 GA4</text>
  <text x="490" y="198" fill="#2563EB" font-size="11.5" text-anchor="middle">단, 둘 중 '한 벌'만 기준으로</text>

  <!-- row 3 -->
  <rect x="40" y="224" width="280" height="52" rx="8" fill="#F1F5F9"/>
  <text x="180" y="248" fill="#334155" font-size="13" font-weight="600" text-anchor="middle">이번 달 장사, 잘한 건가?</text>
  <text x="180" y="266" fill="#64748B" font-size="11.5" text-anchor="middle">사업 성과의 최종 확인</text>
  <line x1="330" y1="250" x2="370" y2="250" stroke="#94A3B8" stroke-width="2"/>
  <rect x="380" y="224" width="220" height="52" rx="8" fill="#334155"/>
  <text x="490" y="255" fill="#F8FAFC" font-size="13" font-weight="700" text-anchor="middle">자체 결제·주문 DB</text>

  <!-- row 4 -->
  <rect x="40" y="292" width="280" height="52" rx="8" fill="#FEF2F2"/>
  <text x="180" y="316" fill="#B91C1C" font-size="13" font-weight="600" text-anchor="middle">이 채널 끄면 매출이 얼마나 빠지나?</text>
  <text x="180" y="334" fill="#B91C1C" font-size="11.5" text-anchor="middle">'진짜 기여'의 확정</text>
  <line x1="330" y1="318" x2="370" y2="318" stroke="#94A3B8" stroke-width="2"/>
  <rect x="380" y="292" width="220" height="52" rx="8" fill="#FEE2E2"/>
  <text x="490" y="316" fill="#B91C1C" font-size="13" font-weight="700" text-anchor="middle">어느 대시보드도 못 줘요</text>
  <text x="490" y="334" fill="#B91C1C" font-size="11.5" text-anchor="middle">증분 실험으로만 확인 가능</text>

  <text x="320" y="382" fill="#6B7280" font-size="12.5" text-anchor="middle">숫자 싸움의 대부분은, 다른 질문에 답하는 숫자를 한 테이블에 올려서 생겨요.</text>
</svg>

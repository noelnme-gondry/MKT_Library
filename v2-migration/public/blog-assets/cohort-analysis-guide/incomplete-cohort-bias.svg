<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">덜 익은 코호트가 만드는 착시</title>
  <desc id="desc">Illustrative bars compare D7 retention from mature cohorts with a misleading average that treats incomplete cohorts as zero.</desc>
  <rect width="1200" height="620" fill="#ffffff"/>
  <text x="64" y="76" fill="#0f172a" font-family="Arial, sans-serif" font-size="34" font-weight="700">덜 익은 코호트를 섞으면 D7이 절반으로 보인다</text>
  <text x="64" y="114" fill="#475569" font-family="Arial, sans-serif" font-size="20">예시 데이터 · D7 관찰 기간이 다 찬 코호트만 사용</text>
  <g stroke="#cbd5e1" stroke-width="2"><line x1="130" y1="500" x2="1090" y2="500"/><line x1="130" y1="390" x2="1090" y2="390"/><line x1="130" y1="280" x2="1090" y2="280"/><line x1="130" y1="170" x2="1090" y2="170"/></g>
  <g fill="#475569" font-family="Arial, sans-serif" font-size="18"><text x="76" y="506">0%</text><text x="64" y="396">10%</text><text x="64" y="286">20%</text><text x="64" y="176">30%</text></g>
  <rect x="300" y="307" width="210" height="193" rx="12" fill="#3b82f6"/><rect x="690" y="407" width="210" height="93" rx="12" fill="#fb7185"/>
  <g fill="#0f172a" font-family="Arial, sans-serif" font-size="28" font-weight="700"><text x="352" y="290">17.5%</text><text x="746" y="390">8.5%</text></g>
  <g fill="#334155" font-family="Arial, sans-serif" font-size="22" text-anchor="middle"><text x="405" y="540">성숙 코호트만</text><text x="795" y="540">덜 익은 코호트를 0으로 처리</text></g>
  <text x="405" y="574" fill="#1d4ed8" font-family="Arial, sans-serif" font-size="18" text-anchor="middle">올바른 비교</text><text x="795" y="574" fill="#be123c" font-family="Arial, sans-serif" font-size="18" text-anchor="middle">리포트 오류</text>
</svg>

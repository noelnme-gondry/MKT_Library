<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">D1·D7·D30 성숙 코호트 타임라인</title>
  <desc id="desc">Illustrative timeline showing latest eligible cohorts when data ends on July 30.</desc>
  <rect width="1200" height="520" fill="#101827"/>
  <text x="64" y="72" fill="#f8fafc" font-family="Arial, sans-serif" font-size="34" font-weight="700">성숙한 코호트만 비교한다</text>
  <text x="64" y="110" fill="#a8b5c8" font-family="Arial, sans-serif" font-size="20">예시 데이터 · 데이터 최대 날짜 7월 30일</text>
  <line x1="230" y1="188" x2="1070" y2="188" stroke="#50607a" stroke-width="3"/>
  <g fill="#a8b5c8" font-family="Arial, sans-serif" font-size="18"><text x="210" y="164">6월 30일</text><text x="430" y="164">7월 10일</text><text x="650" y="164">7월 23일</text><text x="860" y="164">7월 29일</text><text x="1030" y="164">7월 30일</text></g>
  <g fill="#93c5fd"><circle cx="230" cy="188" r="8"/><circle cx="450" cy="188" r="8"/><circle cx="670" cy="188" r="8"/></g><g fill="#fbbf24"><circle cx="880" cy="188" r="8"/><circle cx="1050" cy="188" r="8"/></g>
  <g font-family="Arial, sans-serif"><text x="64" y="270" fill="#f8fafc" font-size="26" font-weight="700">D30</text><rect x="230" y="238" width="820" height="42" rx="21" fill="#23334d"/><rect x="230" y="238" width="8" height="42" rx="4" fill="#60a5fa"/><text x="260" y="266" fill="#dbeafe" font-size="19">6월 30일 코호트까지 포함</text><text x="64" y="354" fill="#f8fafc" font-size="26" font-weight="700">D7</text><rect x="230" y="322" width="820" height="42" rx="21" fill="#23334d"/><rect x="230" y="322" width="440" height="42" rx="21" fill="#60a5fa"/><text x="260" y="350" fill="#dbeafe" font-size="19">7월 23일 코호트까지 포함</text><text x="64" y="438" fill="#f8fafc" font-size="26" font-weight="700">D1</text><rect x="230" y="406" width="820" height="42" rx="21" fill="#23334d"/><rect x="230" y="406" width="650" height="42" rx="21" fill="#60a5fa"/><text x="260" y="434" fill="#dbeafe" font-size="19">7월 29일 코호트까지 포함</text></g>
  <text x="905" y="488" fill="#fbbf24" font-family="Arial, sans-serif" font-size="18">주황 = 아직 덜 익음</text>
</svg>

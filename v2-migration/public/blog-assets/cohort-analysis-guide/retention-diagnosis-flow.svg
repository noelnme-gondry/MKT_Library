<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Retention diagnosis flow</title>
  <desc id="desc">Flow chart for checking D1 and D7 changes, channel or OS differences, and early behavior after a retention change.</desc>
  <rect width="1200" height="700" fill="#101827"/>
  <text x="64" y="72" fill="#f8fafc" font-family="Arial, sans-serif" font-size="34" font-weight="700">What to check after a retention change</text>
  <g font-family="Arial, sans-serif"><rect x="425" y="112" width="350" height="80" rx="16" fill="#1e3a5f" stroke="#60a5fa" stroke-width="2"/><text x="600" y="160" text-anchor="middle" fill="#eff6ff" font-size="24" font-weight="700">Compare mature cohorts only</text><path d="M600 192V244M250 244H950M250 244V290M600 244V290M950 244V290" fill="none" stroke="#7f8ea6" stroke-width="3"/>
  <rect x="100" y="290" width="300" height="104" rx="16" fill="#1c2940"/><text x="250" y="332" text-anchor="middle" fill="#f8fafc" font-size="23" font-weight="700">D1 falls</text><text x="250" y="364" text-anchor="middle" fill="#b9c7da" font-size="18">Check promise, onboarding,</text><text x="250" y="386" text-anchor="middle" fill="#b9c7da" font-size="18">and technical friction</text>
  <rect x="450" y="290" width="300" height="104" rx="16" fill="#1c2940"/><text x="600" y="332" text-anchor="middle" fill="#f8fafc" font-size="23" font-weight="700">D1 holds, D7 falls</text><text x="600" y="364" text-anchor="middle" fill="#b9c7da" font-size="18">Check repeat value, reminders,</text><text x="600" y="386" text-anchor="middle" fill="#b9c7da" font-size="18">and return path</text>
  <rect x="800" y="290" width="300" height="104" rx="16" fill="#1c2940"/><text x="950" y="332" text-anchor="middle" fill="#f8fafc" font-size="23" font-weight="700">One group falls</text><text x="950" y="364" text-anchor="middle" fill="#b9c7da" font-size="18">Split by channel, OS,</text><text x="950" y="386" text-anchor="middle" fill="#b9c7da" font-size="18">country, and app version</text>
  <path d="M250 394V455M600 394V455M950 394V455" fill="none" stroke="#7f8ea6" stroke-width="3"/>
  <rect x="100" y="455" width="300" height="120" rx="16" fill="#183a36" stroke="#34d399" stroke-width="2"/><text x="250" y="500" text-anchor="middle" fill="#ecfdf5" font-size="22" font-weight="700">Funnel diagnosis</text><text x="250" y="532" text-anchor="middle" fill="#b7e8d5" font-size="18">Creative · landing · signup ·</text><text x="250" y="554" text-anchor="middle" fill="#b7e8d5" font-size="18">first meaningful action</text>
  <rect x="450" y="455" width="300" height="120" rx="16" fill="#183a36" stroke="#34d399" stroke-width="2"/><text x="600" y="500" text-anchor="middle" fill="#ecfdf5" font-size="22" font-weight="700">Product diagnosis</text><text x="600" y="532" text-anchor="middle" fill="#b7e8d5" font-size="18">Content · reminders ·</text><text x="600" y="554" text-anchor="middle" fill="#b7e8d5" font-size="18">repeat-use path</text>
  <rect x="800" y="455" width="300" height="120" rx="16" fill="#183a36" stroke="#34d399" stroke-width="2"/><text x="950" y="500" text-anchor="middle" fill="#ecfdf5" font-size="22" font-weight="700">Data &amp; mix diagnosis</text><text x="950" y="532" text-anchor="middle" fill="#b7e8d5" font-size="18">Campaign mix · release ·</text><text x="950" y="554" text-anchor="middle" fill="#b7e8d5" font-size="18">SDK and event QA</text>
  <text x="600" y="654" text-anchor="middle" fill="#a8b5c8" font-size="18">Observation is not causation: test material decisions with A/B or holdout designs.</text></g>
</svg>

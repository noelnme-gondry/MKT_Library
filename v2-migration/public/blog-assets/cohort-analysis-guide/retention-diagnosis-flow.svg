<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">리텐션 진단 순서</title>
  <desc id="desc">Flow chart for checking D1 and D7 changes, channel or OS differences, and early behavior after a retention change.</desc>
  <rect width="1200" height="700" fill="#101827"/>
  <text x="64" y="72" fill="#f8fafc" font-family="Arial, sans-serif" font-size="34" font-weight="700">리텐션이 변했을 때 볼 것</text>
  <g font-family="Arial, sans-serif"><rect x="425" y="112" width="350" height="80" rx="16" fill="#1e3a5f" stroke="#60a5fa" stroke-width="2"/><text x="600" y="160" text-anchor="middle" fill="#eff6ff" font-size="24" font-weight="700">성숙 코호트만 비교</text><path d="M600 192V244M250 244H950M250 244V290M600 244V290M950 244V290" fill="none" stroke="#7f8ea6" stroke-width="3"/>
  <rect x="100" y="290" width="300" height="104" rx="16" fill="#1c2940"/><text x="250" y="332" text-anchor="middle" fill="#f8fafc" font-size="23" font-weight="700">D1이 떨어짐</text><text x="250" y="364" text-anchor="middle" fill="#b9c7da" font-size="18">약속·온보딩과</text><text x="250" y="386" text-anchor="middle" fill="#b9c7da" font-size="18">기술적 마찰을 확인</text>
  <rect x="450" y="290" width="300" height="104" rx="16" fill="#1c2940"/><text x="600" y="332" text-anchor="middle" fill="#f8fafc" font-size="23" font-weight="700">D1은 유지, D7이 떨어짐</text><text x="600" y="364" text-anchor="middle" fill="#b9c7da" font-size="18">재방문 가치·리마인더와</text><text x="600" y="386" text-anchor="middle" fill="#b9c7da" font-size="18">복귀 동선을 확인</text>
  <rect x="800" y="290" width="300" height="104" rx="16" fill="#1c2940"/><text x="950" y="332" text-anchor="middle" fill="#f8fafc" font-size="23" font-weight="700">특정 그룹만 떨어짐</text><text x="950" y="364" text-anchor="middle" fill="#b9c7da" font-size="18">채널·OS·국가·</text><text x="950" y="386" text-anchor="middle" fill="#b9c7da" font-size="18">앱 버전으로 쪼개기</text>
  <path d="M250 394V455M600 394V455M950 394V455" fill="none" stroke="#7f8ea6" stroke-width="3"/>
  <rect x="100" y="455" width="300" height="120" rx="16" fill="#183a36" stroke="#34d399" stroke-width="2"/><text x="250" y="500" text-anchor="middle" fill="#ecfdf5" font-size="22" font-weight="700">퍼널 진단</text><text x="250" y="532" text-anchor="middle" fill="#b7e8d5" font-size="18">소재 · 랜딩 · 가입 ·</text><text x="250" y="554" text-anchor="middle" fill="#b7e8d5" font-size="18">첫 핵심 행동</text>
  <rect x="450" y="455" width="300" height="120" rx="16" fill="#183a36" stroke="#34d399" stroke-width="2"/><text x="600" y="500" text-anchor="middle" fill="#ecfdf5" font-size="22" font-weight="700">제품 진단</text><text x="600" y="532" text-anchor="middle" fill="#b7e8d5" font-size="18">콘텐츠 · 리마인더 ·</text><text x="600" y="554" text-anchor="middle" fill="#b7e8d5" font-size="18">repeat-use path</text>
  <rect x="800" y="455" width="300" height="120" rx="16" fill="#183a36" stroke="#34d399" stroke-width="2"/><text x="950" y="500" text-anchor="middle" fill="#ecfdf5" font-size="22" font-weight="700">Data &amp; mix diagnosis</text><text x="950" y="532" text-anchor="middle" fill="#b7e8d5" font-size="18">캠페인 믹스 · 릴리스 ·</text><text x="950" y="554" text-anchor="middle" fill="#b7e8d5" font-size="18">SDK·이벤트 QA</text>
  <text x="600" y="654" text-anchor="middle" fill="#a8b5c8" font-size="18">Observation is not causation: test material decisions with A/B or holdout designs.</text></g>
</svg>

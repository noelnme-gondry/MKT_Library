<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="t"><title id="t">Good and bad event naming</title><rect width="1200" height="560" fill="#101827"/><text x="60" y="70" fill="#f8fafc" font-family="Arial" font-size="34" font-weight="700">Name the action. Parameterize the context.</text><g font-family="Arial"><rect x="70" y="130" width="500" height="340" rx="18" fill="#3b1c2a" stroke="#fb7185" stroke-width="2"/><rect x="630" y="130" width="500" height="340" rx="18" fill="#183a36" stroke="#34d399" stroke-width="2"/><g font-size="27" font-weight="700"><text x="110" y="185" fill="#fecaca">Mixed definitions</text><text x="670" y="185" fill="#d1fae5">Stable definitions</text></g><g fill="#d8e2f0" font-size="22"><text x="110" y="245">paywall_purchase_v2</text><text x="110" y="292">addToCart</text><text x="110" y="339">payment_click = revenue</text><text x="670" y="245">purchase_completed</text><text x="670" y="292">cart_item_added</text><text x="670" y="339">value, currency, transaction_id</text></g><g fill="#a8b5c8" font-size="18"><text x="110" y="405">Screen, version, and action mixed</text><text x="670" y="405">Action fixed; context is structured</text></g></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="510" viewBox="0 0 1200 510" role="img" aria-labelledby="t"><title id="t">좋은 이벤트명과 나쁜 이벤트명</title><rect width="1200" height="510" fill="#ffffff"/><text x="60" y="70" fill="#0f172a" font-family="Arial,sans-serif" font-size="34" font-weight="700">행동은 이름으로, 맥락은 파라미터로</text><g font-family="Arial,sans-serif"><rect x="70" y="130" width="500" height="340" rx="18" fill="#fff1f2" stroke="#f43f5e" stroke-width="2"/><rect x="630" y="130" width="500" height="340" rx="18" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/><g font-size="27" font-weight="700"><text x="110" y="185" fill="#b91c1c">정의가 섞인 이름</text><text x="670" y="185" fill="#047857">안정적인 정의</text></g><g fill="#334155" font-size="22"><text x="110" y="245">paywall_purchase_v2</text><text x="110" y="292">addToCart</text><text x="110" y="339">payment_click = revenue</text><text x="670" y="245">purchase_completed</text><text x="670" y="292">cart_item_added</text><text x="670" y="339">value, currency, transaction_id</text></g><g fill="#475569" font-size="18"><text x="110" y="405">화면·버전·행동이 한 이름에 혼합</text><text x="670" y="405">행동은 고정, 맥락은 구조화</text></g></g></svg>

  <text x="150" y="86" fill="#334155" font-size="13" font-weight="700" text-anchor="end">전체 변화</text>
  <rect x="192" y="64" width="228" height="32" rx="4" fill="#64748b"/>
  <text x="428" y="85" fill="#0f172a" font-size="13" font-weight="700">−3.8%p</text>
  <text x="150" y="132" fill="#334155" font-size="13" font-weight="400" text-anchor="end">물량 이동</text>
  <rect x="156" y="110" width="264" height="32" rx="4" fill="#dc2626"/>

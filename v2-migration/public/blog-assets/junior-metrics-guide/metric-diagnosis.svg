<svg viewBox="0 0 760 400" xmlns="http://www.w3.org/2000/svg" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <rect x="0" y="0" width="760" height="400" fill="#ffffff"/>

  <!-- 열 헤더 -->
  <text x="160" y="40" fill="#475569" font-size="13" font-weight="600" text-anchor="middle">CTR</text>
  <text x="270" y="40" fill="#475569" font-size="13" font-weight="600" text-anchor="middle">전환율</text>
  <text x="380" y="40" fill="#475569" font-size="13" font-weight="600" text-anchor="middle">CPA</text>
  <text x="490" y="40" fill="#475569" font-size="13" font-weight="600" text-anchor="middle">ROAS</text>

  <!-- 케이스 A -->
  <text x="110" y="93" fill="#334155" font-size="13.5" font-weight="700" text-anchor="end">케이스 A</text>
  <circle cx="160" cy="88" r="18" fill="#D1FAE5" stroke="#059669" stroke-width="1.6"/>
  <text x="160" y="93" fill="#047857" font-size="12" font-weight="700" text-anchor="middle">정상</text>
  <circle cx="270" cy="88" r="18" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="270" y="93" fill="#B91C1C" font-size="12" font-weight="700" text-anchor="middle">낮음</text>
  <circle cx="380" cy="88" r="18" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="380" y="93" fill="#B91C1C" font-size="12" font-weight="700" text-anchor="middle">높음</text>
  <circle cx="490" cy="88" r="18" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="490" y="93" fill="#B91C1C" font-size="12" font-weight="700" text-anchor="middle">낮음</text>
  <text x="380" y="124" fill="#334155" font-size="13" text-anchor="middle">&#8594; 클릭은 잘 되는데 안 사요. <tspan font-weight="700">랜딩·상품</tspan>을 보세요.</text>

  <!-- 구분선 -->
  <line x1="60" y1="150" x2="700" y2="150" stroke="#E2E8F0" stroke-width="1.2"/>

  <!-- 케이스 B -->
  <text x="110" y="203" fill="#334155" font-size="13.5" font-weight="700" text-anchor="end">케이스 B</text>
  <circle cx="160" cy="198" r="18" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="160" y="203" fill="#B91C1C" font-size="12" font-weight="700" text-anchor="middle">낮음</text>
  <circle cx="270" cy="198" r="18" fill="#D1FAE5" stroke="#059669" stroke-width="1.6"/>
  <text x="270" y="203" fill="#047857" font-size="12" font-weight="700" text-anchor="middle">정상</text>
  <circle cx="380" cy="198" r="18" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="380" y="203" fill="#B91C1C" font-size="12" font-weight="700" text-anchor="middle">높음</text>
  <circle cx="490" cy="198" r="18" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.6"/>
  <text x="490" y="203" fill="#64748B" font-size="12" font-weight="700" text-anchor="middle">보류</text>
  <text x="380" y="234" fill="#334155" font-size="13" text-anchor="middle">&#8594; 눈길을 못 끌어요. <tspan font-weight="700">소재</tspan>부터 보세요.</text>

  <!-- 보류 설명 -->
  <rect x="60" y="266" width="640" height="56" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="380" y="288" fill="#64748B" font-size="12.5" text-anchor="middle">'보류'는 데이터가 얕아서 아직 판단하지 않는다는 뜻이에요. 표본이 적으면</text>
  <text x="380" y="308" fill="#64748B" font-size="12.5" text-anchor="middle">억지로 색을 칠하는 것보다 '아직 모름'이 더 정확한 답이에요.</text>

  <!-- 캡션 -->
  <text x="380" y="356" fill="#6B7280" font-size="12.5" text-anchor="middle">같은 'CPA 높음'이라도, 어느 칸이 빨간불이냐에 따라 손댈 곳이 달라져요.</text>
</svg>

<svg viewBox="0 0 760 300" xmlns="http://www.w3.org/2000/svg" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <rect width="760" height="300" fill="#fff"/>
  <text x="380" y="34" fill="#0f172a" font-size="17" font-weight="700" text-anchor="middle">Both campaigns improved, yet total conversion fell</text>
  <text x="410" y="62" fill="#475569" font-size="12" text-anchor="middle">Bar width = share of installs</text>
  <text x="154" y="114" fill="#334155" font-size="14" font-weight="700" text-anchor="end">Week 1</text>
  <rect x="170" y="84" width="384" height="48" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <rect x="554" y="84" width="96" height="48" rx="6" fill="#fee2e2" stroke="#dc2626"/>
  <text x="362.0" y="104" fill="#1e3a8a" font-size="13" text-anchor="middle">A Brand 80%</text>
  <text x="362.0" y="122" fill="#1e3a8a" font-size="13" font-weight="700" text-anchor="middle">CVR 10.0%</text>
  <text x="602.0" y="104" fill="#7f1d1d" font-size="12" text-anchor="middle">B 20%</text>
  <text x="602.0" y="122" fill="#7f1d1d" font-size="12" font-weight="700" text-anchor="middle">CVR 2.0%</text>
  <text x="666" y="106" fill="#475569" font-size="12">Total</text>
  <text x="666" y="124" fill="#0f172a" font-size="15" font-weight="700">8.4%</text>
  <text x="154" y="190" fill="#334155" font-size="14" font-weight="700" text-anchor="end">Week 2</text>
  <rect x="170" y="160" width="120" height="48" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <rect x="290" y="160" width="360" height="48" rx="6" fill="#fee2e2" stroke="#dc2626"/>
  <text x="230.0" y="180" fill="#1e3a8a" font-size="12" text-anchor="middle">A 25%</text>
  <text x="230.0" y="198" fill="#1e3a8a" font-size="12" font-weight="700" text-anchor="middle">CVR 11.0% ↑</text>
  <text x="470.0" y="180" fill="#7f1d1d" font-size="13" text-anchor="middle">B Prospecting 75%</text>
  <text x="470.0" y="198" fill="#7f1d1d" font-size="13" font-weight="700" text-anchor="middle">CVR 2.5% ↑</text>
  <text x="666" y="182" fill="#475569" font-size="12">Total</text>
  <text x="666" y="200" fill="#b91c1c" font-size="15" font-weight="700">4.6%</text>
  <text x="380" y="252" fill="#334155" font-size="13" text-anchor="middle">Both rates rose, but 75% of installs moved to the lower-converting campaign B</text>
  <text x="380" y="276" fill="#475569" font-size="13" text-anchor="middle">Total = campaign rates weighted by their share of installs</text>
</svg>

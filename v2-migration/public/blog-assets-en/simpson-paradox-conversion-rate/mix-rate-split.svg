<svg viewBox="0 0 760 300" xmlns="http://www.w3.org/2000/svg" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <rect width="760" height="300" fill="#fff"/>
  <text x="380" y="34" fill="#0f172a" font-size="17" font-weight="700" text-anchor="middle">Splitting the −3.8 pp drop into three parts</text>
  <line x1="420" y1="56" x2="420" y2="246" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="420" y="264" fill="#475569" font-size="12" text-anchor="middle">0</text>
  <text x="150" y="86" fill="#334155" font-size="13" font-weight="700" text-anchor="end">Total change</text>
  <rect x="192" y="64" width="228" height="32" rx="4" fill="#64748b"/>
  <text x="428" y="85" fill="#0f172a" font-size="13" font-weight="700">−3.8 pp</text>
  <text x="150" y="132" fill="#334155" font-size="13" font-weight="400" text-anchor="end">Volume shift</text>
  <rect x="156" y="110" width="264" height="32" rx="4" fill="#dc2626"/>
  <text x="428" y="131" fill="#0f172a" font-size="13" font-weight="700">−4.4 pp</text>
  <text x="150" y="178" fill="#334155" font-size="13" font-weight="400" text-anchor="end">Within campaigns</text>
  <rect x="420" y="156" width="54" height="32" rx="4" fill="#059669"/>
  <text x="482" y="177" fill="#0f172a" font-size="13" font-weight="700">+0.9 pp</text>
  <text x="150" y="224" fill="#334155" font-size="13" font-weight="400" text-anchor="end">Overlap</text>
  <rect x="402" y="202" width="18" height="32" rx="4" fill="#94a3b8"/>
  <text x="428" y="223" fill="#0f172a" font-size="13" font-weight="700">−0.3 pp</text>
  <text x="380" y="288" fill="#475569" font-size="13" text-anchor="middle">−4.4 + 0.9 − 0.3 = −3.8 pp · the whole drop came from the volume shift</text>
</svg>

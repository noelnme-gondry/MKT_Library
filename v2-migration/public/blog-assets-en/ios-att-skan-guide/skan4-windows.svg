<svg viewBox="0 0 740 400" xmlns="http://www.w3.org/2000/svg" font-family="'Inter','Helvetica Neue',Arial,sans-serif">
  <rect x="0" y="0" width="740" height="400" fill="#ffffff"/>

  <text x="34" y="34" fill="#0F172A" font-size="14" font-weight="700">The three SKAN 4 conversion windows</text>
  <text x="34" y="54" fill="#64748B" font-size="12">Windows open at install (D0); each postback arrives after the window closes, plus a randomised delay.</text>

  <!-- timeline axis -->
  <line x1="60" y1="120" x2="690" y2="120" stroke="#CBD5E1" stroke-width="1.5"/>
  <g fill="#94A3B8" font-size="11" text-anchor="middle">
    <text x="60" y="142">Install</text>
    <text x="240" y="142">Day 2</text>
    <text x="430" y="142">Day 7</text>
    <text x="660" y="142">Day 35</text>
  </g>
  <g stroke="#CBD5E1" stroke-width="1">
    <line x1="60" y1="114" x2="60" y2="126"/>
    <line x1="240" y1="114" x2="240" y2="126"/>
    <line x1="430" y1="114" x2="430" y2="126"/>
    <line x1="660" y1="114" x2="660" y2="126"/>
  </g>

  <!-- window blocks -->
  <rect x="60" y="82" width="180" height="28" rx="6" fill="#DBEAFE" stroke="#93C5FD"/>
  <text x="150" y="101" fill="#1D4ED8" font-size="12" font-weight="700" text-anchor="middle">Window 1 &#183; days 0&#8211;2</text>

  <rect x="240" y="82" width="190" height="28" rx="6" fill="#E0E7FF" stroke="#A5B4FC"/>
  <text x="335" y="101" fill="#4338CA" font-size="12" font-weight="700" text-anchor="middle">Window 2 &#183; days 3&#8211;7</text>

  <rect x="430" y="82" width="230" height="28" rx="6" fill="#EDE9FE" stroke="#C4B5FD"/>
  <text x="545" y="101" fill="#6D28D9" font-size="12" font-weight="700" text-anchor="middle">Window 3 &#183; days 8&#8211;35</text>

  <!-- what each returns -->
  <rect x="60" y="168" width="180" height="72" rx="8" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="150" y="192" fill="#334155" font-size="12" font-weight="700" text-anchor="middle">Fine or coarse</text>
  <text x="150" y="212" fill="#64748B" font-size="11.5" text-anchor="middle">Fine = 0&#8211;63 (6 bits)</text>
  <text x="150" y="230" fill="#64748B" font-size="11.5" text-anchor="middle">The most precise window</text>

  <rect x="240" y="168" width="190" height="72" rx="8" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="335" y="192" fill="#334155" font-size="12" font-weight="700" text-anchor="middle">Coarse only</text>
  <text x="335" y="212" fill="#64748B" font-size="11.5" text-anchor="middle">low / medium / high</text>
  <text x="335" y="230" fill="#64748B" font-size="11.5" text-anchor="middle">Three levels, no more</text>

  <rect x="430" y="168" width="230" height="72" rx="8" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="545" y="192" fill="#334155" font-size="12" font-weight="700" text-anchor="middle">Coarse only</text>
  <text x="545" y="212" fill="#64748B" font-size="11.5" text-anchor="middle">For long-run value</text>
  <text x="545" y="230" fill="#64748B" font-size="11.5" text-anchor="middle">Arrives last</text>

  <!-- connectors -->
  <g stroke="#CBD5E1" stroke-width="1.2" stroke-dasharray="3 3">
    <line x1="150" y1="110" x2="150" y2="168"/>
    <line x1="335" y1="110" x2="335" y2="168"/>
    <line x1="545" y1="110" x2="545" y2="168"/>
  </g>

  <!-- privacy threshold -->
  <rect x="34" y="266" width="672" height="90" rx="8" fill="#FEF3C7" stroke="#FCD34D"/>
  <text x="56" y="292" fill="#92400E" font-size="12.5" font-weight="700">Crowd anonymity (the privacy threshold) decides how much detail you receive</text>
  <text x="56" y="315" fill="#92400E" font-size="12">Low install volume drops the tier, and with it the fine value and the granular source identifier.</text>
  <text x="56" y="336" fill="#92400E" font-size="12">Splitting campaigns finer lowers each slice's tier — more structure buys you coarser data.</text>

  <text x="370" y="380" fill="#9CA3AF" font-size="11.5" text-anchor="middle">Rules change between versions — confirm against Apple's documentation before acting.</text>
</svg>

<svg viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" font-family="'Inter','Helvetica Neue',Arial,sans-serif">
  <rect x="0" y="0" width="640" height="360" fill="#ffffff"/>

  <text x="320" y="34" fill="#334155" font-size="16" font-weight="700" text-anchor="middle">Re-querying "Sunday's conversions" on different days</text>

  <!-- baseline -->
  <line x1="80" y1="290" x2="600" y2="290" stroke="#9CA3AF" stroke-width="1.5"/>

  <!-- Monday 15 -->
  <rect x="112" y="185" width="66" height="105" fill="#FCA5A5"/>
  <text x="145" y="175" fill="#DC2626" font-size="15" font-weight="700" text-anchor="middle">15</text>
  <text x="145" y="312" fill="#334155" font-size="13" font-weight="600" text-anchor="middle">Checked Monday</text>

  <!-- Tuesday 19 -->
  <rect x="242" y="157" width="66" height="133" fill="#93C5FD"/>
  <text x="275" y="147" fill="#2563EB" font-size="15" font-weight="700" text-anchor="middle">19</text>
  <text x="275" y="312" fill="#334155" font-size="13" font-weight="600" text-anchor="middle">Checked Tuesday</text>

  <!-- Wednesday 21 -->
  <rect x="372" y="143" width="66" height="147" fill="#60A5FA"/>
  <text x="405" y="133" fill="#2563EB" font-size="15" font-weight="700" text-anchor="middle">21</text>
  <text x="405" y="312" fill="#334155" font-size="13" font-weight="600" text-anchor="middle">Checked Wednesday</text>

  <!-- Thursday 22 final -->
  <rect x="502" y="136" width="66" height="154" fill="#3B82F6"/>
  <text x="535" y="126" fill="#1D4ED8" font-size="15" font-weight="700" text-anchor="middle">22</text>
  <text x="535" y="312" fill="#334155" font-size="13" font-weight="600" text-anchor="middle">Checked Thursday</text>
  <text x="535" y="330" fill="#64748B" font-size="12" text-anchor="middle">(effectively final)</text>

  <text x="320" y="352" fill="#6B7280" font-size="12.5" text-anchor="middle">Report "yesterday's number" Monday morning, and it'll be a different number days later.</text>
</svg>

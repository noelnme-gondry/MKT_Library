<svg viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" font-family="'Inter','Helvetica Neue',Arial,sans-serif">
  <rect x="0" y="0" width="640" height="360" fill="#ffffff"/>

  <text x="320" y="32" fill="#334155" font-size="16" font-weight="700" text-anchor="middle">Same person, same visit — counted differently</text>

  <!-- user behavior timeline -->
  <line x1="70" y1="86" x2="570" y2="86" stroke="#94A3B8" stroke-width="2"/>
  <circle cx="110" cy="86" r="6" fill="#3B82F6"/>
  <text x="110" y="66" fill="#334155" font-size="12.5" font-weight="600" text-anchor="middle">11:50 PM</text>
  <text x="110" y="112" fill="#64748B" font-size="12" text-anchor="middle">Clicks ad, arrives</text>

  <circle cx="320" cy="86" r="6" fill="#3B82F6"/>
  <text x="320" y="66" fill="#334155" font-size="12.5" font-weight="600" text-anchor="middle">12:00 AM</text>
  <text x="320" y="112" fill="#64748B" font-size="12" text-anchor="middle">Midnight passes</text>

  <circle cx="510" cy="86" r="6" fill="#3B82F6"/>
  <text x="510" y="66" fill="#334155" font-size="12.5" font-weight="600" text-anchor="middle">12:10 AM</text>
  <text x="510" y="112" fill="#64748B" font-size="12" text-anchor="middle">Returns via search</text>

  <!-- UA row -->
  <text x="70" y="172" fill="#334155" font-size="14" font-weight="700">UA</text>
  <rect x="110" y="152" width="185" height="34" rx="6" fill="#E2E8F0"/>
  <text x="202" y="174" fill="#475569" font-size="12.5" text-anchor="middle">Session 1</text>
  <rect x="305" y="152" width="175" height="34" rx="6" fill="#E2E8F0"/>
  <text x="392" y="174" fill="#475569" font-size="12.5" text-anchor="middle">Session 2 (midnight reset)</text>
  <rect x="490" y="152" width="110" height="34" rx="6" fill="#E2E8F0"/>
  <text x="545" y="174" fill="#475569" font-size="12.5" text-anchor="middle">Session 3 (source change)</text>
  <text x="600" y="212" fill="#DC2626" font-size="14" font-weight="700" text-anchor="end">= 3 sessions</text>

  <!-- GA4 row -->
  <text x="70" y="272" fill="#334155" font-size="14" font-weight="700">GA4</text>
  <rect x="110" y="252" width="490" height="34" rx="6" fill="#BFDBFE"/>
  <text x="355" y="274" fill="#1D4ED8" font-size="12.5" font-weight="600" text-anchor="middle">Session 1 — no gap over 30 min, so still one session</text>
  <text x="600" y="312" fill="#1D4ED8" font-size="14" font-weight="700" text-anchor="end">= 1 session</text>

  <text x="320" y="348" fill="#6B7280" font-size="12.5" text-anchor="middle">GA4 showing fewer sessions than UA isn't data loss — it's a different definition.</text>
</svg>

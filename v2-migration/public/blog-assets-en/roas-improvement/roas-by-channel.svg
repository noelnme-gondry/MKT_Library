<svg viewBox="0 0 660 360" xmlns="http://www.w3.org/2000/svg" font-family="'Inter','Helvetica Neue',Arial,sans-serif">
  <rect x="0" y="0" width="660" height="360" fill="#ffffff"/>

  <!-- baseline -->
  <line x1="80" y1="300" x2="600" y2="300" stroke="#9CA3AF" stroke-width="1.5"/>

  <!-- average line 300% -->
  <line x1="80" y1="170" x2="600" y2="170" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="598" y="163" fill="#64748B" font-size="12.5" text-anchor="end">Overall avg 300%</text>

  <!-- Channel A 480% -->
  <rect x="118" y="92" width="64" height="208" fill="#3B82F6"/>
  <text x="150" y="82" fill="#1D4ED8" font-size="15" font-weight="700" text-anchor="middle">480%</text>
  <text x="150" y="320" fill="#334155" font-size="13.5" font-weight="600" text-anchor="middle">Channel A</text>

  <!-- Channel B 320% -->
  <rect x="248" y="161" width="64" height="139" fill="#3B82F6"/>
  <text x="280" y="151" fill="#1D4ED8" font-size="15" font-weight="700" text-anchor="middle">320%</text>
  <text x="280" y="320" fill="#334155" font-size="13.5" font-weight="600" text-anchor="middle">Channel B</text>

  <!-- Channel C 150% (problem) -->
  <rect x="378" y="235" width="64" height="65" fill="#EF4444"/>
  <text x="410" y="225" fill="#DC2626" font-size="15" font-weight="700" text-anchor="middle">150%</text>
  <text x="410" y="320" fill="#334155" font-size="13.5" font-weight="600" text-anchor="middle">Channel C</text>

  <!-- Channel D 250% -->
  <rect x="508" y="192" width="64" height="108" fill="#3B82F6"/>
  <text x="540" y="182" fill="#1D4ED8" font-size="15" font-weight="700" text-anchor="middle">250%</text>
  <text x="540" y="320" fill="#334155" font-size="13.5" font-weight="600" text-anchor="middle">Channel D</text>

  <!-- caption -->
  <text x="320" y="340" fill="#6B7280" font-size="12.5" text-anchor="middle">A 300% average hides this much spread. The fix is Channel C, not "the account."</text>
</svg>

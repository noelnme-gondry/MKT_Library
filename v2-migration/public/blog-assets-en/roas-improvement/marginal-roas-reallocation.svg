<svg viewBox="0 0 700 400" xmlns="http://www.w3.org/2000/svg" font-family="'Inter','Helvetica Neue',Arial,sans-serif">
  <rect x="0" y="0" width="700" height="400" fill="#ffffff"/>

  <!-- legend -->
  <rect x="90" y="20" width="14" height="14" rx="2" fill="#93C5FD"/>
  <text x="110" y="32" fill="#475569" font-size="12.5">Average ROAS</text>
  <rect x="230" y="20" width="14" height="14" rx="2" fill="#2563EB"/>
  <text x="250" y="32" fill="#475569" font-size="12.5">Marginal ROAS (next won's efficiency)</text>

  <!-- baseline -->
  <line x1="90" y1="300" x2="610" y2="300" stroke="#9CA3AF" stroke-width="1.5"/>

  <!-- A group -->
  <rect x="130" y="60" width="54" height="240" fill="#93C5FD"/>
  <text x="157" y="52" fill="#1D4ED8" font-size="14" font-weight="700" text-anchor="middle">480%</text>
  <rect x="192" y="220" width="54" height="80" fill="#2563EB"/>
  <text x="219" y="212" fill="#1D4ED8" font-size="14" font-weight="700" text-anchor="middle">160%</text>
  <text x="188" y="322" fill="#334155" font-size="14" font-weight="600" text-anchor="middle">Channel A (saturated)</text>

  <!-- B group -->
  <rect x="424" y="140" width="54" height="160" fill="#93C5FD"/>
  <text x="451" y="132" fill="#1D4ED8" font-size="14" font-weight="700" text-anchor="middle">320%</text>
  <rect x="486" y="150" width="54" height="150" fill="#2563EB"/>
  <text x="513" y="142" fill="#1D4ED8" font-size="14" font-weight="700" text-anchor="middle">300%</text>
  <text x="482" y="322" fill="#334155" font-size="14" font-weight="600" text-anchor="middle">Channel B (has room)</text>

  <!-- reallocation arrow -->
  <path d="M 260 100 C 320 62, 380 62, 438 106" fill="none" stroke="#059669" stroke-width="2.2"/>
  <polygon points="430,98 443,109 428,111" fill="#059669"/>
  <text x="350" y="52" fill="#059669" font-size="13" font-weight="600" text-anchor="middle">Shift budget</text>

  <!-- caption -->
  <text x="350" y="358" fill="#6B7280" font-size="12.5" text-anchor="middle">A's average is higher, but the efficiency of the next won (marginal ROAS)</text>
  <text x="350" y="378" fill="#6B7280" font-size="12.5" text-anchor="middle">is better in B, so shifting budget from A to B pays off.</text>
</svg>

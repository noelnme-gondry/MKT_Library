<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 390" role="img" aria-labelledby="title"><title id="title">Boundaries between data preparation and browser analysis</title><rect width="720" height="390" rx="20" fill="#F6F8FC"/><g font-family="Arial, sans-serif"><text x="32" y="43" font-size="26" fill="#19243C" text-anchor="start">Scheduled refresh is separate from analysis</text><rect x="32" y="70" width="312" height="126" rx="12" fill="#FFFFFF" stroke="#D5DDEA"/><text x="50" y="107" font-size="24" fill="#19243C" text-anchor="start">BigQuery</text><text x="50" y="157" font-size="20" fill="#526078" text-anchor="start">Prepare aggregates</text><rect x="376" y="70" width="312" height="126" rx="12" fill="#FFFFFF" stroke="#D5DDEA"/><text x="394" y="107" font-size="24" fill="#19243C" text-anchor="start">Google Sheets</text><text x="394" y="157" font-size="20" fill="#526078" text-anchor="start">Review and refresh</text><rect x="32" y="218" width="312" height="126" rx="12" fill="#FFFFFF" stroke="#D5DDEA"/><text x="50" y="255" font-size="24" fill="#19243C" text-anchor="start">CSV file</text><text x="50" y="305" font-size="20" fill="#526078" text-anchor="start">Check freshness and totals</text><rect x="376" y="218" width="312" height="126" rx="12" fill="#FFFFFF" stroke="#D5DDEA"/><text x="394" y="255" font-size="24" fill="#19243C" text-anchor="start">Browser analysis</text><text x="394" y="305" font-size="20" fill="#526078" text-anchor="start">User uploads and runs</text></g></svg>

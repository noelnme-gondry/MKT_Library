<svg viewBox="0 0 760 400" xmlns="http://www.w3.org/2000/svg" font-family="'Inter','Helvetica Neue',Arial,sans-serif">
  <rect x="0" y="0" width="760" height="400" fill="#ffffff"/>

  <!-- column headers -->
  <text x="160" y="40" fill="#475569" font-size="13" font-weight="600" text-anchor="middle">CTR</text>
  <text x="270" y="40" fill="#475569" font-size="13" font-weight="600" text-anchor="middle">CVR</text>
  <text x="380" y="40" fill="#475569" font-size="13" font-weight="600" text-anchor="middle">CPA</text>
  <text x="490" y="40" fill="#475569" font-size="13" font-weight="600" text-anchor="middle">ROAS</text>

  <!-- Case A -->
  <text x="110" y="93" fill="#334155" font-size="13.5" font-weight="700" text-anchor="end">Case A</text>
  <circle cx="160" cy="88" r="18" fill="#D1FAE5" stroke="#059669" stroke-width="1.6"/>
  <text x="160" y="92" fill="#047857" font-size="11" font-weight="700" text-anchor="middle">OK</text>
  <circle cx="270" cy="88" r="18" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="270" y="92" fill="#B91C1C" font-size="11" font-weight="700" text-anchor="middle">Low</text>
  <circle cx="380" cy="88" r="18" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="380" y="92" fill="#B91C1C" font-size="11" font-weight="700" text-anchor="middle">High</text>
  <circle cx="490" cy="88" r="18" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="490" y="92" fill="#B91C1C" font-size="11" font-weight="700" text-anchor="middle">Low</text>
  <text x="380" y="124" fill="#334155" font-size="13" text-anchor="middle">&#8594; Clicks are working, but people aren't buying. Check the <tspan font-weight="700">landing page or product</tspan>.</text>

  <!-- divider -->
  <line x1="60" y1="150" x2="700" y2="150" stroke="#E2E8F0" stroke-width="1.2"/>

  <!-- Case B -->
  <text x="110" y="203" fill="#334155" font-size="13.5" font-weight="700" text-anchor="end">Case B</text>
  <circle cx="160" cy="198" r="18" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="160" y="202" fill="#B91C1C" font-size="11" font-weight="700" text-anchor="middle">Low</text>
  <circle cx="270" cy="198" r="18" fill="#D1FAE5" stroke="#059669" stroke-width="1.6"/>
  <text x="270" y="202" fill="#047857" font-size="11" font-weight="700" text-anchor="middle">OK</text>
  <circle cx="380" cy="198" r="18" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="380" y="202" fill="#B91C1C" font-size="11" font-weight="700" text-anchor="middle">High</text>
  <circle cx="490" cy="198" r="18" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.6"/>
  <text x="490" y="201" fill="#64748B" font-size="10" font-weight="700" text-anchor="middle">Hold</text>
  <text x="380" y="234" fill="#334155" font-size="13" text-anchor="middle">&#8594; Nobody's clicking, but buyers convert fine. The <tspan font-weight="700">creative</tspan> is the fix.</text>

  <!-- "hold" explanation -->
  <rect x="60" y="266" width="640" height="56" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="380" y="288" fill="#64748B" font-size="12.5" text-anchor="middle">"Hold" means the sample is too thin to call yet. When volume is low,</text>
  <text x="380" y="308" fill="#64748B" font-size="12.5" text-anchor="middle">"not sure yet" is a more honest answer than forcing a verdict.</text>

  <!-- caption -->
  <text x="380" y="356" fill="#6B7280" font-size="12.5" text-anchor="middle">Same "high CPA," different fix &#8212; it depends on which metric is flashing red.</text>
</svg>

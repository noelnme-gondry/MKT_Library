<svg viewBox="0 0 820 440" xmlns="http://www.w3.org/2000/svg" font-family="'Inter','Helvetica Neue',Arial,sans-serif">
  <rect x="0" y="0" width="820" height="440" fill="#ffffff"/>

  <!-- Headers -->
  <rect x="40" y="30" width="320" height="46" rx="10" fill="#F1F5F9" stroke="#CBD5E1"/>
  <text x="200" y="59" fill="#64748B" font-size="14.5" font-weight="700" text-anchor="middle">What machines took over</text>
  <rect x="400" y="30" width="380" height="46" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.8"/>
  <text x="590" y="59" fill="#1D4ED8" font-size="14.5" font-weight="700" text-anchor="middle">What's still yours</text>

  <!-- Left list -->
  <g fill="#94A3B8">
    <text x="64" y="112" font-size="13.5">Manually adjusting bids</text>
    <line x1="62" y1="107" x2="250" y2="107" stroke="#CBD5E1" stroke-width="1.4"/>
    <text x="64" y="150" font-size="13.5">Fine-tuning audience targeting</text>
    <line x1="62" y1="145" x2="278" y2="145" stroke="#CBD5E1" stroke-width="1.4"/>
    <text x="64" y="188" font-size="13.5">Allocating placements &amp; dayparts</text>
    <line x1="62" y1="183" x2="292" y2="183" stroke="#CBD5E1" stroke-width="1.4"/>
    <text x="64" y="226" font-size="13.5">Testing creative combinations</text>
    <line x1="62" y1="221" x2="280" y2="221" stroke="#CBD5E1" stroke-width="1.4"/>
    <text x="64" y="264" font-size="13.5">Daily budget micro-adjustments</text>
    <line x1="62" y1="259" x2="286" y2="259" stroke="#CBD5E1" stroke-width="1.4"/>
  </g>

  <!-- Right list -->
  <g>
    <circle cx="420" cy="107" r="4" fill="#2563EB"/>
    <text x="436" y="112" fill="#334155" font-size="13.5" font-weight="600">Deciding what to optimize for</text>
    <text x="436" y="130" fill="#94A3B8" font-size="11.5">Machines can't set the goal</text>

    <circle cx="420" cy="163" r="4" fill="#2563EB"/>
    <text x="436" y="168" fill="#334155" font-size="13.5" font-weight="600">Judging whether to trust the number</text>
    <text x="436" y="186" fill="#94A3B8" font-size="11.5">Incremental, or would've happened anyway?</text>

    <circle cx="420" cy="219" r="4" fill="#2563EB"/>
    <text x="436" y="224" fill="#334155" font-size="13.5" font-weight="600">Deciding where to place the bet</text>
    <text x="436" y="242" fill="#94A3B8" font-size="11.5">Cross-channel allocation is still yours</text>

    <circle cx="420" cy="275" r="4" fill="#2563EB"/>
    <text x="436" y="280" fill="#334155" font-size="13.5" font-weight="600">Designing and running experiments</text>
    <text x="436" y="298" fill="#94A3B8" font-size="11.5">Machines can't verify their own results</text>
  </g>

  <!-- Divider -->
  <line x1="380" y1="92" x2="380" y2="312" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- Bottom summary -->
  <rect x="70" y="336" width="680" height="92" rx="12" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="410" y="362" fill="#334155" font-size="14" font-weight="700" text-anchor="middle">The center of gravity shifted from operating to judging</text>
  <text x="410" y="384" fill="#64748B" font-size="12.5" text-anchor="middle">Machines optimize the answer. Framing the question and checking</text>
  <text x="410" y="406" fill="#64748B" font-size="12.5" text-anchor="middle">whether the answer is right — that's still on you.</text>
</svg>

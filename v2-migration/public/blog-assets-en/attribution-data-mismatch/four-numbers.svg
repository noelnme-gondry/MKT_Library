<svg viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" font-family="'Inter','Helvetica Neue',Arial,sans-serif">
  <rect x="0" y="0" width="640" height="360" fill="#ffffff"/>

  <text x="320" y="32" fill="#334155" font-size="16" font-weight="700" text-anchor="middle">Same week's "conversions" — depends where you look</text>

  <line x1="80" y1="290" x2="600" y2="290" stroke="#9CA3AF" stroke-width="1.5"/>

  <!-- Ad platform dashboard 120 -->
  <rect x="110" y="98" width="70" height="192" fill="#3B82F6"/>
  <text x="145" y="88" fill="#1D4ED8" font-size="15" font-weight="700" text-anchor="middle">120</text>
  <text x="145" y="312" fill="#334155" font-size="13" font-weight="600" text-anchor="middle">Ad platform</text>
  <text x="145" y="330" fill="#64748B" font-size="11.5" text-anchor="middle">Includes view-through, own rules</text>

  <!-- Order DB 100 -->
  <rect x="240" y="130" width="70" height="160" fill="#334155"/>
  <text x="275" y="120" fill="#334155" font-size="15" font-weight="700" text-anchor="middle">100</text>
  <text x="275" y="312" fill="#334155" font-size="13" font-weight="600" text-anchor="middle">Order DB</text>
  <text x="275" y="330" fill="#64748B" font-size="11.5" text-anchor="middle">Conversions that actually happened</text>

  <!-- MMP 85 -->
  <rect x="370" y="154" width="70" height="136" fill="#60A5FA"/>
  <text x="405" y="144" fill="#2563EB" font-size="15" font-weight="700" text-anchor="middle">85</text>
  <text x="405" y="312" fill="#334155" font-size="13" font-weight="600" text-anchor="middle">MMP</text>
  <text x="405" y="330" fill="#64748B" font-size="11.5" text-anchor="middle">Cross-network last-touch</text>

  <!-- GA4 70 -->
  <rect x="500" y="178" width="70" height="112" fill="#93C5FD"/>
  <text x="535" y="168" fill="#2563EB" font-size="15" font-weight="700" text-anchor="middle">70</text>
  <text x="535" y="312" fill="#334155" font-size="13" font-weight="600" text-anchor="middle">GA4</text>
  <text x="535" y="330" fill="#64748B" font-size="11.5" text-anchor="middle">Click-based, different window</text>

  <text x="320" y="352" fill="#6B7280" font-size="12.5" text-anchor="middle">All four are correct by their own rules. The rules just differ.</text>
</svg>

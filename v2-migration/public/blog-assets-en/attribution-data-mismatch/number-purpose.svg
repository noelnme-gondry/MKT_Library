<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" font-family="'Inter','Helvetica Neue',Arial,sans-serif">
  <rect x="0" y="0" width="640" height="400" fill="#ffffff"/>

  <text x="320" y="34" fill="#334155" font-size="16" font-weight="700" text-anchor="middle">Different question, different number to trust</text>

  <!-- headers -->
  <text x="180" y="72" fill="#64748B" font-size="13" font-weight="700" text-anchor="middle">For this question</text>
  <text x="490" y="72" fill="#64748B" font-size="13" font-weight="700" text-anchor="middle">Trust this number</text>

  <!-- row 1 -->
  <rect x="40" y="88" width="280" height="52" rx="8" fill="#F1F5F9"/>
  <text x="180" y="112" fill="#334155" font-size="13" font-weight="600" text-anchor="middle">Is this creative better than that one?</text>
  <text x="180" y="130" fill="#64748B" font-size="11.5" text-anchor="middle">Relative comparison within one platform</text>
  <line x1="330" y1="114" x2="370" y2="114" stroke="#94A3B8" stroke-width="2"/>
  <rect x="380" y="88" width="220" height="52" rx="8" fill="#DBEAFE"/>
  <text x="490" y="119" fill="#1D4ED8" font-size="13" font-weight="700" text-anchor="middle">Ad platform dashboard</text>

  <!-- row 2 -->
  <rect x="40" y="156" width="280" height="52" rx="8" fill="#F1F5F9"/>
  <text x="180" y="180" fill="#334155" font-size="13" font-weight="600" text-anchor="middle">Which is better, channel A or B?</text>
  <text x="180" y="198" fill="#64748B" font-size="11.5" text-anchor="middle">Cross-channel comparison</text>
  <line x1="330" y1="182" x2="370" y2="182" stroke="#94A3B8" stroke-width="2"/>
  <rect x="380" y="156" width="220" height="52" rx="8" fill="#DBEAFE"/>
  <text x="490" y="180" fill="#1D4ED8" font-size="13" font-weight="700" text-anchor="middle">MMP or GA4</text>
  <text x="490" y="198" fill="#2563EB" font-size="11.5" text-anchor="middle">Just pick one and stay consistent</text>

  <!-- row 3 -->
  <rect x="40" y="224" width="280" height="52" rx="8" fill="#F1F5F9"/>
  <text x="180" y="248" fill="#334155" font-size="13" font-weight="600" text-anchor="middle">Did the business do well this month?</text>
  <text x="180" y="266" fill="#64748B" font-size="11.5" text-anchor="middle">Final check on business performance</text>
  <line x1="330" y1="250" x2="370" y2="250" stroke="#94A3B8" stroke-width="2"/>
  <rect x="380" y="224" width="220" height="52" rx="8" fill="#334155"/>
  <text x="490" y="255" fill="#F8FAFC" font-size="13" font-weight="700" text-anchor="middle">Your own order/payment DB</text>

  <!-- row 4 -->
  <rect x="40" y="292" width="280" height="52" rx="8" fill="#FEF2F2"/>
  <text x="180" y="316" fill="#B91C1C" font-size="13" font-weight="600" text-anchor="middle">How much revenue drops if we turn this channel off?</text>
  <text x="180" y="334" fill="#B91C1C" font-size="11.5" text-anchor="middle">Confirming true incremental contribution</text>
  <line x1="330" y1="318" x2="370" y2="318" stroke="#94A3B8" stroke-width="2"/>
  <rect x="380" y="292" width="220" height="52" rx="8" fill="#FEE2E2"/>
  <text x="490" y="316" fill="#B91C1C" font-size="13" font-weight="700" text-anchor="middle">No dashboard can tell you</text>
  <text x="490" y="334" fill="#B91C1C" font-size="11.5" text-anchor="middle">Only an incrementality test can</text>

  <text x="320" y="382" fill="#6B7280" font-size="12.5" text-anchor="middle">Most number fights come from putting answers to different questions in one table.</text>
</svg>

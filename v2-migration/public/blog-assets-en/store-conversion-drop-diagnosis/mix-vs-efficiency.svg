<svg viewBox="0 0 760 330" xmlns="http://www.w3.org/2000/svg" font-family="'Inter','Helvetica Neue',Arial,sans-serif">
  <rect width="760" height="330" fill="#fff"/>
  <text x="380" y="34" fill="#0f172a" font-size="17" font-weight="700" text-anchor="middle">Per-source rates hold while the blended rate falls</text>

  <text x="190" y="70" fill="#334155" font-size="14" font-weight="700" text-anchor="middle">Earlier</text>
  <text x="570" y="70" fill="#334155" font-size="14" font-weight="700" text-anchor="middle">Later</text>

  <rect x="70" y="88" width="150" height="62" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text x="145" y="112" fill="#1e3a8a" font-size="13" text-anchor="middle">Search 4,300</text>
  <text x="145" y="134" fill="#1e3a8a" font-size="13" font-weight="700" text-anchor="middle">rate 45%</text>

  <rect x="70" y="160" width="150" height="62" rx="6" fill="#fee2e2" stroke="#dc2626"/>
  <text x="145" y="184" fill="#7f1d1d" font-size="13" text-anchor="middle">Browse 2,400</text>
  <text x="145" y="206" fill="#7f1d1d" font-size="13" font-weight="700" text-anchor="middle">rate 9%</text>

  <rect x="450" y="88" width="150" height="48" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text x="525" y="106" fill="#1e3a8a" font-size="13" text-anchor="middle">Search 2,600</text>
  <text x="525" y="126" fill="#1e3a8a" font-size="13" font-weight="700" text-anchor="middle">rate 45%</text>

  <rect x="450" y="146" width="150" height="76" rx="6" fill="#fee2e2" stroke="#dc2626"/>
  <text x="525" y="176" fill="#7f1d1d" font-size="13" text-anchor="middle">Browse 5,200</text>
  <text x="525" y="198" fill="#7f1d1d" font-size="13" font-weight="700" text-anchor="middle">rate 9%</text>

  <line x1="240" y1="155" x2="430" y2="155" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="430,155 420,150 420,160" fill="#94a3b8"/>
  <text x="335" y="146" fill="#475569" font-size="12" text-anchor="middle">only the share flips</text>

  <rect x="70" y="248" width="150" height="40" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="145" y="273" fill="#0f172a" font-size="14" font-weight="700" text-anchor="middle">blended 32.1%</text>

  <rect x="450" y="248" width="150" height="40" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="525" y="273" fill="#b91c1c" font-size="14" font-weight="700" text-anchor="middle">blended 21.0%</text>

  <text x="380" y="315" fill="#475569" font-size="13" text-anchor="middle">Neither source got worse, yet the total fell 11pp</text>
</svg>

<svg viewBox="0 0 760 330" xmlns="http://www.w3.org/2000/svg" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <rect width="760" height="330" fill="#fff"/>
  <text x="380" y="34" fill="#0f172a" font-size="17" font-weight="700" text-anchor="middle">From the first 3 seconds to the click</text>
  <rect x="120" y="60" width="420" height="40" rx="6" fill="#e2e8f0" stroke="#2563eb"/>
  <text x="330" y="85" fill="#0f172a" font-size="13" font-weight="700" text-anchor="middle">Impressions 10,000</text>
  <rect x="225" y="116" width="210" height="40" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text x="330" y="141" fill="#0f172a" font-size="13" font-weight="700" text-anchor="middle">3-second views 2,500</text>
  <rect x="273" y="172" width="115" height="40" rx="6" fill="#bfdbfe" stroke="#2563eb"/>
  <text x="330" y="197" fill="#0f172a" font-size="13" font-weight="700" text-anchor="middle">Half views 750</text>
  <rect x="270" y="228" width="120" height="40" rx="6" fill="#93c5fd" stroke="#2563eb"/>
  <text x="330" y="253" fill="#0f172a" font-size="13" font-weight="700" text-anchor="middle">Clicks 120</text>
  <text x="580" y="108" fill="#1e3a8a" font-size="12" font-weight="700">Hook Rate</text>
  <text x="580" y="124" fill="#475569" font-size="12">2,500 ÷ 10,000 = 25%</text>
  <text x="580" y="164" fill="#1e3a8a" font-size="12" font-weight="700">Hold Rate</text>
  <text x="580" y="180" fill="#475569" font-size="12">750 ÷ 2,500 = 30%</text>
  <text x="580" y="220" fill="#1e3a8a" font-size="12" font-weight="700">CTR</text>
  <text x="580" y="236" fill="#475569" font-size="12">120 ÷ 10,000 = 1.2%</text>
  <text x="380" y="314" fill="#475569" font-size="13" text-anchor="middle">Example numbers. Bar widths are compressed for readability</text>
</svg>

<svg viewBox="0 0 760 400" xmlns="http://www.w3.org/2000/svg" font-family="'Inter','Helvetica Neue',Arial,sans-serif">
  <rect x="0" y="0" width="760" height="400" fill="#ffffff"/>

  <!-- Axes -->
  <line x1="110" y1="310" x2="660" y2="310" stroke="#9CA3AF" stroke-width="1.5"/>
  <line x1="110" y1="50" x2="110" y2="310" stroke="#9CA3AF" stroke-width="1.5"/>
  <text x="100" y="44" fill="#64748B" font-size="12.5" text-anchor="end">Conversions</text>
  <text x="660" y="334" fill="#64748B" font-size="12.5" text-anchor="end">Ad spend →</text>

  <!-- Expected (linear) line -->
  <line x1="110" y1="310" x2="630" y2="66" stroke="#94A3B8" stroke-width="2.2" stroke-dasharray="7 5"/>
  <text x="606" y="46" fill="#64748B" font-size="11.5" text-anchor="middle">Expected: 2x spend</text>
  <text x="606" y="60" fill="#64748B" font-size="11.5" text-anchor="middle">= 2x conversions</text>

  <!-- Actual response curve (saturation) -->
  <path d="M 110,310 C 230,222 310,178 410,158 C 500,142 570,136 630,132" fill="none" stroke="#2563EB" stroke-width="3"/>
  <text x="626" y="156" fill="#1D4ED8" font-size="12.5" font-weight="600" text-anchor="middle">Actual</text>

  <!-- Gap indicator -->
  <line x1="630" y1="66" x2="630" y2="132" stroke="#DC2626" stroke-width="2"/>
  <line x1="624" y1="66" x2="636" y2="66" stroke="#DC2626" stroke-width="2"/>
  <line x1="624" y1="132" x2="636" y2="132" stroke="#DC2626" stroke-width="2"/>
  <text x="676" y="103" fill="#DC2626" font-size="12.5" font-weight="700" text-anchor="middle">Gap</text>

  <!-- Current point -->
  <circle cx="230" cy="222" r="6" fill="#059669"/>
  <line x1="230" y1="222" x2="230" y2="310" stroke="#059669" stroke-width="1.4" stroke-dasharray="4 4"/>
  <text x="230" y="332" fill="#059669" font-size="12" font-weight="600" text-anchor="middle">Now</text>
  <text x="230" y="206" fill="#059669" font-size="12" font-weight="600" text-anchor="middle">Room to grow</text>

  <!-- Saturation point -->
  <circle cx="460" cy="150" r="6" fill="#DC2626"/>
  <line x1="460" y1="150" x2="460" y2="310" stroke="#DC2626" stroke-width="1.4" stroke-dasharray="4 4"/>
  <text x="460" y="332" fill="#DC2626" font-size="12" font-weight="600" text-anchor="middle">Saturation starts here</text>

  <!-- Caption -->
  <text x="380" y="372" fill="#6B7280" font-size="12.5" text-anchor="middle">Budget scales linearly, but conversions don't. Cross the point where the curve</text>
  <text x="380" y="392" fill="#6B7280" font-size="12.5" text-anchor="middle">flattens and 2x spend gets only ~1.2x conversions. That shows up as rising CPA.</text>
</svg>

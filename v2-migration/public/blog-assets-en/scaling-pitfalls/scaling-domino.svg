<svg viewBox="0 0 900 320" xmlns="http://www.w3.org/2000/svg" font-family="'Inter','Helvetica Neue',Arial,sans-serif">
  <rect x="0" y="0" width="900" height="320" fill="#ffffff"/>

  <text x="450" y="34" fill="#334155" font-size="14.5" font-weight="700" text-anchor="middle">Raise budget without widening the audience, and this domino follows</text>

  <!-- 1: Budget -->
  <rect x="20" y="74" width="150" height="76" rx="10" fill="#ECFDF5" stroke="#A7F3D0"/>
  <text x="95" y="106" fill="#047857" font-size="13.5" font-weight="700" text-anchor="middle">Budget ↑</text>
  <text x="95" y="128" fill="#64748B" font-size="11.5" text-anchor="middle">2x increase</text>

  <polygon points="172,112 192,104 192,120" fill="#94A3B8"/>

  <!-- 2: Frequency -->
  <rect x="194" y="74" width="150" height="76" rx="10" fill="#FEF3C7" stroke="#FDE68A"/>
  <text x="269" y="106" fill="#B45309" font-size="13.5" font-weight="700" text-anchor="middle">Frequency ↑</text>
  <text x="269" y="128" fill="#64748B" font-size="11.5" text-anchor="middle">Same people, again</text>

  <polygon points="346,112 366,104 366,120" fill="#94A3B8"/>

  <!-- 3: CTR -->
  <rect x="368" y="74" width="150" height="76" rx="10" fill="#FEE2E2" stroke="#FECACA"/>
  <text x="443" y="106" fill="#B91C1C" font-size="13.5" font-weight="700" text-anchor="middle">CTR ↓</text>
  <text x="443" y="128" fill="#64748B" font-size="11.5" text-anchor="middle">Creative fatigue</text>

  <polygon points="520,112 540,104 540,120" fill="#94A3B8"/>

  <!-- 4: CPM -->
  <rect x="542" y="74" width="150" height="76" rx="10" fill="#FEE2E2" stroke="#FECACA"/>
  <text x="617" y="106" fill="#B91C1C" font-size="13.5" font-weight="700" text-anchor="middle">CPM ↑</text>
  <text x="617" y="128" fill="#64748B" font-size="11.5" text-anchor="middle">Response ↓, cost ↑</text>

  <polygon points="694,112 714,104 714,120" fill="#94A3B8"/>

  <!-- 5: CPA -->
  <rect x="716" y="74" width="140" height="76" rx="10" fill="#DC2626"/>
  <text x="786" y="106" fill="#ffffff" font-size="13.5" font-weight="700" text-anchor="middle">CPA</text>
  <text x="786" y="126" fill="#ffffff" font-size="15" font-weight="700" text-anchor="middle">↑↑</text>

  <!-- Entry-point curved arrow -->
  <path d="M 269 190 C 269 220, 443 220, 443 194" fill="none" stroke="#94A3B8" stroke-width="1.6" stroke-dasharray="5 4"/>
  <text x="356" y="238" fill="#64748B" font-size="12" text-anchor="middle">Break the chain here</text>

  <!-- Fix box -->
  <rect x="20" y="256" width="836" height="46" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="438" y="284" fill="#475569" font-size="12.5" text-anchor="middle">Fix: when you raise budget, widen targeting or prep multiple creatives at the same time.</text>
</svg>

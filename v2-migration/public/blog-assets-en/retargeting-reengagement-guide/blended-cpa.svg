<svg viewBox="0 0 760 320" xmlns="http://www.w3.org/2000/svg" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <rect width="760" height="320" fill="#fff"/>
  <text x="380" y="34" fill="#0f172a" font-size="17" font-weight="700" text-anchor="middle">A blended $18 CPA describes neither campaign</text>
  <rect x="200" y="80" width="120" height="180" rx="4" fill="#2563eb"/>
  <text x="260" y="70" fill="#0f172a" font-size="14" font-weight="700" text-anchor="middle">$30</text>
  <text x="260" y="282" fill="#334155" font-size="13" text-anchor="middle">Acquisition (100 conversions)</text>
  <rect x="430" y="224" width="120" height="36" rx="4" fill="#93c5fd"/>
  <text x="490" y="214" fill="#0f172a" font-size="14" font-weight="700" text-anchor="middle">$6</text>
  <text x="490" y="282" fill="#334155" font-size="13" text-anchor="middle">Retargeting (100 conversions)</text>
  <line x1="150" y1="152" x2="620" y2="152" stroke="#dc2626" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="630" y="156" fill="#b91c1c" font-size="13" font-weight="700" text-anchor="start">$18</text>
  <text x="630" y="172" fill="#475569" font-size="11" text-anchor="start">Blended CPA</text>
  <line x1="150" y1="260" x2="620" y2="260" stroke="#94a3b8" stroke-width="2"/>
  <text x="380" y="306" fill="#475569" font-size="13" text-anchor="middle">Example numbers. More retargeting lowers the blend and hides the cost of acquisition</text>
</svg>

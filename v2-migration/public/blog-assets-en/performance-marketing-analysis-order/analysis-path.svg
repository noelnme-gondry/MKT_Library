<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Choose the first marketing analysis from the data</title>
  <desc id="desc">A four-step path from question and data grain to the first analysis and next decision</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#ffffff"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#050a12" flood-opacity=".35"/></filter></defs>
  <rect width="1200" height="630" fill="url(#bg)"/><path d="M0 96H1200M0 192H1200M0 288H1200M0 384H1200M0 480H1200M0 576H1200M120 0V630M240 0V630M360 0V630M480 0V630M600 0V630M720 0V630M840 0V630M960 0V630M1080 0V630" stroke="#3b82f6" stroke-opacity=".055"/>
  <text x="72" y="78" fill="#1d4ed8" font-family="monospace" font-size="18" font-weight="700" letter-spacing="3">FIRST ANALYSIS ROUTER</text><text x="72" y="132" fill="#0f172a" font-family="Arial, sans-serif" font-size="38" font-weight="700">Start with the question and the data</text><text x="72" y="171" fill="#475569" font-family="Arial, sans-serif" font-size="19">Choose the smallest question your current data can answer.</text>
  <g font-family="Arial, sans-serif"><g transform="translate(72 234)"><rect width="232" height="226" rx="16" fill="#f8fafc" stroke="#cbd5e1"/><circle cx="36" cy="38" r="18" fill="#316ee8"/><text x="36" y="44" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">1</text><text x="26" y="88" fill="#1d4ed8" font-size="14" font-weight="700">QUESTION</text><text x="26" y="124" fill="#0f172a" font-size="22" font-weight="700">What will change?</text><text x="26" y="161" fill="#475569" font-size="16">Monitor · explain</text><text x="26" y="189" fill="#475569" font-size="16">Scale · prove lift</text></g><g transform="translate(340 234)"><rect width="232" height="226" rx="16" fill="#f8fafc" stroke="#cbd5e1"/><circle cx="36" cy="38" r="18" fill="#316ee8"/><text x="36" y="44" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">2</text><text x="26" y="88" fill="#1d4ed8" font-size="14" font-weight="700">DATA</text><text x="26" y="124" fill="#0f172a" font-size="22" font-weight="700">What is one row?</text><text x="26" y="161" fill="#475569" font-size="16">Day × channel · periods</text><text x="26" y="189" fill="#475569" font-size="16">Control · week × channel</text></g><g transform="translate(608 234)"><rect width="232" height="226" rx="16" fill="#f8fafc" stroke="#cbd5e1"/><circle cx="36" cy="38" r="18" fill="#11866e"/><text x="36" y="44" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">3</text><text x="26" y="88" fill="#0f766e" font-size="14" font-weight="700">FIRST ANALYSIS</text><text x="26" y="124" fill="#0f172a" font-size="22" font-weight="700">Eligible methods</text><text x="26" y="161" fill="#475569" font-size="16">Dashboard · variance</text><text x="26" y="189" fill="#475569" font-size="16">Saturation · lift · VIF</text></g><g transform="translate(876 234)"><rect width="252" height="226" rx="16" fill="#fffbeb" stroke="#f59e0b"/><circle cx="36" cy="38" r="18" fill="#a76400"/><text x="36" y="44" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">4</text><text x="26" y="88" fill="#b45309" font-size="14" font-weight="700">NEXT DECISION</text><text x="26" y="124" fill="#0f172a" font-size="22" font-weight="700">Change one thing</text><text x="26" y="161" fill="#475569" font-size="16">Narrow · reallocate</text><text x="26" y="189" fill="#475569" font-size="16">Design · measure again</text></g></g>
  <g fill="none" stroke="#3b82f6" stroke-width="2"><path d="M306 347h30"/><path d="M574 347h30"/><path d="M842 347h30"/></g><g fill="#3b82f6"><path d="m335 347-9-6v12z"/><path d="m603 347-9-6v12z"/><path d="m871 347-9-6v12z"/></g><rect x="72" y="510" width="1056" height="60" rx="12" fill="#f8fafc" stroke="#cbd5e1"/><text x="98" y="547" fill="#0f172a" font-family="Arial, sans-serif" font-size="18" font-weight="700">Have a CSV?</text><text x="222" y="547" fill="#1d4ed8" font-family="Arial, sans-serif" font-size="18">Map columns → check eligibility → recommend the first question</text>
</svg>

<svg viewBox="0 0 800 430" xmlns="http://www.w3.org/2000/svg" font-family="'Inter','Helvetica Neue',Arial,sans-serif">
  <rect x="0" y="0" width="800" height="430" fill="#ffffff"/>

  <!-- start -->
  <rect x="298" y="24" width="204" height="46" rx="10" fill="#F1F5F9" stroke="#CBD5E1"/>
  <text x="400" y="53" fill="#334155" font-size="14" font-weight="700" text-anchor="middle">CTR Dropped</text>

  <line x1="400" y1="70" x2="400" y2="96" stroke="#94A3B8" stroke-width="2"/>
  <polygon points="395,90 400,102 405,90" fill="#94A3B8"/>

  <!-- decision question -->
  <rect x="236" y="104" width="328" height="46" rx="10" fill="#EFF6FF" stroke="#BFDBFE"/>
  <text x="400" y="133" fill="#1D4ED8" font-size="14" font-weight="700" text-anchor="middle">Did frequency also go up?</text>

  <!-- branch lines -->
  <line x1="400" y1="150" x2="400" y2="170" stroke="#94A3B8" stroke-width="2"/>
  <line x1="220" y1="170" x2="580" y2="170" stroke="#94A3B8" stroke-width="2"/>
  <line x1="220" y1="170" x2="220" y2="196" stroke="#94A3B8" stroke-width="2"/>
  <polygon points="215,190 220,202 225,190" fill="#94A3B8"/>
  <line x1="580" y1="170" x2="580" y2="196" stroke="#94A3B8" stroke-width="2"/>
  <polygon points="575,190 580,202 585,190" fill="#94A3B8"/>

  <text x="310" y="164" fill="#059669" font-size="13" font-weight="700" text-anchor="middle">Yes</text>
  <text x="490" y="164" fill="#DC2626" font-size="13" font-weight="700" text-anchor="middle">No</text>

  <!-- left: likely fatigue -->
  <rect x="80" y="204" width="280" height="100" rx="10" fill="#ECFDF5" stroke="#A7F3D0"/>
  <text x="220" y="234" fill="#047857" font-size="14.5" font-weight="700" text-anchor="middle">Likely Creative Fatigue</text>
  <text x="220" y="258" fill="#475569" font-size="12" text-anchor="middle">Same people, repeat exposure</text>
  <text x="220" y="278" fill="#475569" font-size="12" text-anchor="middle">&#8594; refresh creative / widen audience</text>

  <!-- right: other cause -->
  <rect x="440" y="204" width="280" height="100" rx="10" fill="#FEF2F2" stroke="#FECACA"/>
  <text x="580" y="234" fill="#B91C1C" font-size="14.5" font-weight="700" text-anchor="middle">Might Not Be Fatigue</text>
  <text x="580" y="258" fill="#475569" font-size="12" text-anchor="middle">Competition &#183; season &#183; targeting</text>
  <text x="580" y="278" fill="#475569" font-size="12" text-anchor="middle">&#8594; new creative won't help</text>

  <!-- warning box -->
  <rect x="60" y="316" width="680" height="100" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="400" y="340" fill="#475569" font-size="12.5" text-anchor="middle">Frequency and CTR moving together only shows correlation.</text>
  <text x="400" y="360" fill="#475569" font-size="12.5" text-anchor="middle">To confirm fatigue caused it, you can only compare by</text>
  <text x="400" y="380" fill="#475569" font-size="12.5" text-anchor="middle">changing just the creative &#8212; nothing else.</text>
</svg>

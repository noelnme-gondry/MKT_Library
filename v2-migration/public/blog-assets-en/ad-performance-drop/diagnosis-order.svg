<svg viewBox="0 0 700 460" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect x="0" y="0" width="700" height="460" fill="#ffffff"/>

  <text x="350" y="28" fill="#334155" font-size="14.5" font-weight="700" text-anchor="middle">Work top down. Skip a step and you fix the wrong thing.</text>

  <!-- STEP 0 -->
  <rect x="90" y="48" width="520" height="66" rx="10" fill="#F1F5F9" stroke="#CBD5E1"/>
  <circle cx="126" cy="81" r="17" fill="#64748B"/>
  <text x="126" y="87" fill="#ffffff" font-size="14" font-weight="700" text-anchor="middle">0</text>
  <text x="158" y="76" fill="#334155" font-size="14" font-weight="700">Are the numbers real?</text>
  <text x="158" y="99" fill="#64748B" font-size="12.5">Suspect broken tracking, thin samples, and reporting lag first.</text>

  <line x1="350" y1="114" x2="350" y2="130" stroke="#94A3B8" stroke-width="2"/>
  <polygon points="345,126 350,138 355,126" fill="#94A3B8"/>

  <!-- STEP 1 -->
  <rect x="90" y="140" width="520" height="66" rx="10" fill="#EFF6FF" stroke="#BFDBFE"/>
  <circle cx="126" cy="173" r="17" fill="#2563EB"/>
  <text x="126" y="179" fill="#ffffff" font-size="14" font-weight="700" text-anchor="middle">1</text>
  <text x="158" y="168" fill="#1D4ED8" font-size="14" font-weight="700">Did everything drop, or only part of it?</text>
  <text x="158" y="191" fill="#64748B" font-size="12.5">Split by channel and campaign — one broken cell narrows the search fast.</text>

  <line x1="350" y1="206" x2="350" y2="222" stroke="#94A3B8" stroke-width="2"/>
  <polygon points="345,218 350,230 355,218" fill="#94A3B8"/>

  <!-- STEP 2 -->
  <rect x="90" y="232" width="520" height="66" rx="10" fill="#EFF6FF" stroke="#BFDBFE"/>
  <circle cx="126" cy="265" r="17" fill="#2563EB"/>
  <text x="126" y="271" fill="#ffffff" font-size="14" font-weight="700" text-anchor="middle">2</text>
  <text x="158" y="260" fill="#1D4ED8" font-size="14" font-weight="700">Did the mix shift, or did efficiency worsen?</text>
  <text x="158" y="283" fill="#64748B" font-size="12.5">Per-channel CPA can hold while a shift in share still worsens the blend (mix effect).</text>

  <line x1="350" y1="298" x2="350" y2="314" stroke="#94A3B8" stroke-width="2"/>
  <polygon points="345,310 350,322 355,310" fill="#94A3B8"/>

  <!-- STEP 3 -->
  <rect x="90" y="324" width="520" height="82" rx="10" fill="#EFF6FF" stroke="#BFDBFE"/>
  <circle cx="126" cy="365" r="17" fill="#2563EB"/>
  <text x="126" y="371" fill="#ffffff" font-size="14" font-weight="700" text-anchor="middle">3</text>
  <text x="158" y="352" fill="#1D4ED8" font-size="14" font-weight="700">If efficiency worsened, where in the funnel?</text>
  <text x="158" y="375" fill="#64748B" font-size="12.5">CTR down → creative or fatigue / CVR down → landing or product</text>
  <text x="158" y="395" fill="#64748B" font-size="12.5">CPM up → competition, frequency, targeting / all normal → external factors</text>

  <!-- 캡션 -->
  <text x="350" y="438" fill="#6B7280" font-size="12.5" text-anchor="middle">The job is not naming a culprit — it is narrowing the range.</text>
</svg>

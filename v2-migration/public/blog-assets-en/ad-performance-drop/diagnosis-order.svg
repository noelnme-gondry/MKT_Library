<svg viewBox="0 0 700 560" xmlns="http://www.w3.org/2000/svg" font-family="'Inter','Helvetica Neue',Arial,sans-serif">
  <rect x="0" y="0" width="700" height="560" fill="#ffffff"/>

  <text x="350" y="26" fill="#334155" font-size="14.5" font-weight="700" text-anchor="middle">Top to bottom, in order. Skip a step and you'll fix the wrong thing.</text>

  <!-- STEP 0 -->
  <rect x="40" y="44" width="620" height="82" rx="10" fill="#F1F5F9" stroke="#CBD5E1"/>
  <circle cx="76" cy="85" r="17" fill="#64748B"/>
  <text x="76" y="91" fill="#ffffff" font-size="14" font-weight="700" text-anchor="middle">0</text>
  <text x="108" y="71" fill="#334155" font-size="14" font-weight="700">Is the number even real?</text>
  <text x="108" y="91" fill="#64748B" font-size="12.5">Suspect broken tracking, thin samples, or reporting</text>
  <text x="108" y="109" fill="#64748B" font-size="12.5">lag first — this trips people up more than anything.</text>

  <line x1="350" y1="126" x2="350" y2="142" stroke="#94A3B8" stroke-width="2"/>
  <polygon points="345,138 350,150 355,138" fill="#94A3B8"/>

  <!-- STEP 1 -->
  <rect x="40" y="152" width="620" height="82" rx="10" fill="#EFF6FF" stroke="#BFDBFE"/>
  <circle cx="76" cy="193" r="17" fill="#2563EB"/>
  <text x="76" y="199" fill="#ffffff" font-size="14" font-weight="700" text-anchor="middle">1</text>
  <text x="108" y="179" fill="#1D4ED8" font-size="14" font-weight="700">Did everything drop, or just one part?</text>
  <text x="108" y="199" fill="#64748B" font-size="12.5">Split by channel and campaign. If only one broke,</text>
  <text x="108" y="217" fill="#64748B" font-size="12.5">the scope narrows fast.</text>

  <line x1="350" y1="234" x2="350" y2="250" stroke="#94A3B8" stroke-width="2"/>
  <polygon points="345,246 350,258 355,246" fill="#94A3B8"/>

  <!-- STEP 2 -->
  <rect x="40" y="260" width="620" height="82" rx="10" fill="#EFF6FF" stroke="#BFDBFE"/>
  <circle cx="76" cy="301" r="17" fill="#2563EB"/>
  <text x="76" y="307" fill="#ffffff" font-size="14" font-weight="700" text-anchor="middle">2</text>
  <text x="108" y="287" fill="#1D4ED8" font-size="14" font-weight="700">Did allocation shift, or did efficiency worsen?</text>
  <text x="108" y="307" fill="#64748B" font-size="12.5">Per-channel CPA can stay flat and the average still</text>
  <text x="108" y="325" fill="#64748B" font-size="12.5">rises if budget shifts to a pricier channel (mix effect).</text>

  <line x1="350" y1="342" x2="350" y2="358" stroke="#94A3B8" stroke-width="2"/>
  <polygon points="345,354 350,366 355,354" fill="#94A3B8"/>

  <!-- STEP 3 -->
  <rect x="40" y="368" width="620" height="124" rx="10" fill="#EFF6FF" stroke="#BFDBFE"/>
  <circle cx="76" cy="409" r="17" fill="#2563EB"/>
  <text x="76" y="415" fill="#ffffff" font-size="14" font-weight="700" text-anchor="middle">3</text>
  <text x="108" y="395" fill="#1D4ED8" font-size="14" font-weight="700">If efficiency really worsened, where in the funnel?</text>
  <text x="108" y="415" fill="#64748B" font-size="12.5">CTR down → creative &amp; fatigue</text>
  <text x="108" y="433" fill="#64748B" font-size="12.5">Conv. rate down → landing page &amp; product</text>
  <text x="108" y="451" fill="#64748B" font-size="12.5">CPM up → competition, frequency, targeting</text>
  <text x="108" y="469" fill="#64748B" font-size="12.5">All normal → allocation, saturation, external factors</text>

  <!-- Caption -->
  <text x="350" y="532" fill="#6B7280" font-size="12.5" text-anchor="middle">It's not about catching a culprit — it's about narrowing the scope.</text>
</svg>

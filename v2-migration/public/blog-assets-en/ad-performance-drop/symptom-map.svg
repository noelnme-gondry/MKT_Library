<svg viewBox="0 0 700 400" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect x="0" y="0" width="700" height="400" fill="#ffffff"/>

  <!-- 헤더 -->
  <text x="130" y="42" fill="#475569" font-size="13" font-weight="700" text-anchor="middle">Symptom</text>
  <text x="430" y="42" fill="#475569" font-size="13" font-weight="700" text-anchor="middle">Where to look</text>
  <line x1="40" y1="54" x2="660" y2="54" stroke="#CBD5E1" stroke-width="1.4"/>

  <!-- 행1 CPM 상승 -->
  <rect x="40" y="66" width="620" height="62" rx="8" fill="#F8FAFC"/>
  <text x="130" y="94" fill="#DC2626" font-size="14" font-weight="700" text-anchor="middle">CPM ↑</text>
  <text x="130" y="115" fill="#94A3B8" font-size="11.5" text-anchor="middle">Impression price rose</text>
  <text x="260" y="94" fill="#334155" font-size="13">More competition · audience too narrow · frequency spike</text>
  <text x="260" y="115" fill="#64748B" font-size="12">→ Check audience breadth against budget</text>

  <!-- 행2 CTR 하락 -->
  <rect x="40" y="136" width="620" height="62" rx="8" fill="#F1F5F9"/>
  <text x="130" y="164" fill="#DC2626" font-size="14" font-weight="700" text-anchor="middle">CTR ↓</text>
  <text x="130" y="185" fill="#94A3B8" font-size="11.5" text-anchor="middle">Nobody clicks</text>
  <text x="260" y="164" fill="#334155" font-size="13">Creative fatigue · weak hook · audience mismatch</text>
  <text x="260" y="185" fill="#64748B" font-size="12">→ First check whether frequency rose too</text>

  <!-- 행3 전환율 하락 -->
  <rect x="40" y="206" width="620" height="62" rx="8" fill="#F8FAFC"/>
  <text x="130" y="234" fill="#DC2626" font-size="14" font-weight="700" text-anchor="middle">CVR ↓</text>
  <text x="130" y="255" fill="#94A3B8" font-size="11.5" text-anchor="middle">They arrive but do not buy</text>
  <text x="260" y="234" fill="#334155" font-size="13">Landing or checkout issue · price change · out of stock · broken tracking</text>
  <text x="260" y="255" fill="#64748B" font-size="12">→ Look outside the ad. New creative will not fix it</text>

  <!-- 행4 전부 정상 -->
  <rect x="40" y="276" width="620" height="62" rx="8" fill="#F1F5F9"/>
  <text x="130" y="304" fill="#64748B" font-size="14" font-weight="700" text-anchor="middle">All normal</text>
  <text x="130" y="325" fill="#94A3B8" font-size="11.5" text-anchor="middle">but CPA alone is bad</text>
  <text x="260" y="304" fill="#334155" font-size="13">Mix shift · saturation · season · external factors</text>
  <text x="260" y="325" fill="#64748B" font-size="12">→ Look between channels, not inside one</text>

  <!-- 캡션 -->
  <text x="350" y="372" fill="#6B7280" font-size="12.5" text-anchor="middle">Same "CPA got worse" — the fix depends entirely on which metric moved.</text>
</svg>

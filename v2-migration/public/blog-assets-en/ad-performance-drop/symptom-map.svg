<svg viewBox="0 0 760 400" xmlns="http://www.w3.org/2000/svg" font-family="'Inter','Helvetica Neue',Arial,sans-serif">
  <rect x="0" y="0" width="760" height="400" fill="#ffffff"/>

  <!-- Header -->
  <text x="130" y="42" fill="#475569" font-size="13" font-weight="700" text-anchor="middle">Symptom</text>
  <text x="490" y="42" fill="#475569" font-size="13" font-weight="700" text-anchor="middle">What to Suspect</text>
  <line x1="40" y1="54" x2="720" y2="54" stroke="#CBD5E1" stroke-width="1.4"/>

  <!-- Row 1: CPM up -->
  <rect x="40" y="66" width="680" height="62" rx="8" fill="#F8FAFC"/>
  <text x="130" y="94" fill="#DC2626" font-size="14" font-weight="700" text-anchor="middle">CPM ↑</text>
  <text x="130" y="115" fill="#94A3B8" font-size="11.5" text-anchor="middle">Cost per impression rose</text>
  <text x="260" y="94" fill="#334155" font-size="13">Heavier competition · targeting too narrow · frequency spike</text>
  <text x="260" y="115" fill="#64748B" font-size="12">→ Check audience size relative to your budget</text>

  <!-- Row 2: CTR down -->
  <rect x="40" y="136" width="680" height="62" rx="8" fill="#F1F5F9"/>
  <text x="130" y="164" fill="#DC2626" font-size="14" font-weight="700" text-anchor="middle">CTR ↓</text>
  <text x="130" y="185" fill="#94A3B8" font-size="11.5" text-anchor="middle">Clicks aren't happening</text>
  <text x="260" y="164" fill="#334155" font-size="13">Creative fatigue · weaker hook · targeting mismatch</text>
  <text x="260" y="185" fill="#64748B" font-size="12">→ Check whether frequency rose alongside it</text>

  <!-- Row 3: Conversion rate down -->
  <rect x="40" y="206" width="680" height="62" rx="8" fill="#F8FAFC"/>
  <text x="130" y="234" fill="#DC2626" font-size="14" font-weight="700" text-anchor="middle">CVR ↓</text>
  <text x="130" y="255" fill="#94A3B8" font-size="11.5" text-anchor="middle">People arrive but don't buy</text>
  <text x="260" y="234" fill="#334155" font-size="13">Landing/checkout issue · price change · stockout · tracking broke</text>
  <text x="260" y="255" fill="#64748B" font-size="12">→ Look outside the ad. Changing creative won't fix this</text>

  <!-- Row 4: everything normal -->
  <rect x="40" y="276" width="680" height="62" rx="8" fill="#F1F5F9"/>
  <text x="130" y="304" fill="#64748B" font-size="14" font-weight="700" text-anchor="middle">All normal</text>
  <text x="130" y="325" fill="#94A3B8" font-size="11.5" text-anchor="middle">But CPA is still bad</text>
  <text x="260" y="304" fill="#334155" font-size="13">Allocation (mix) shift · saturation · seasonality · external factors</text>
  <text x="260" y="325" fill="#64748B" font-size="12">→ Look between channels, not inside one</text>

  <!-- Caption -->
  <text x="380" y="372" fill="#6B7280" font-size="12.5" text-anchor="middle">The same "CPA got worse" calls for a completely different fix depending on which metric moved.</text>
</svg>

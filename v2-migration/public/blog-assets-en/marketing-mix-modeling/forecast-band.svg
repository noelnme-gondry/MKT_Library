<svg viewBox="0 0 680 340" xmlns="http://www.w3.org/2000/svg" font-family="'Inter','Helvetica Neue',Arial,sans-serif">
  <rect x="0" y="0" width="680" height="340" fill="#ffffff"/>

  <!-- X axis -->
  <line x1="70" y1="270" x2="620" y2="270" stroke="#9CA3AF" stroke-width="1.5"/>

  <!-- Confidence band (future, widening to the right) -->
  <path d="M 360 150 L 410 136 L 470 120 L 530 104 L 600 88 L 600 168 L 530 162 L 470 160 L 410 160 L 360 160 Z"
        fill="#DBEAFE" opacity="0.75"/>

  <!-- Actual revenue (solid line) -->
  <polyline points="80,190 130,175 180,182 230,160 280,168 330,150 360,155"
            fill="none" stroke="#2563EB" stroke-width="2.5"/>

  <!-- Forecast (dashed line) -->
  <polyline points="360,155 410,148 470,140 530,132 600,128"
            fill="none" stroke="#2563EB" stroke-width="2.5" stroke-dasharray="6 5"/>

  <!-- 'Today' divider -->
  <line x1="360" y1="70" x2="360" y2="270" stroke="#CBD5E1" stroke-width="1.3" stroke-dasharray="4 4"/>
  <text x="360" y="62" fill="#94A3B8" font-size="12" text-anchor="middle">Today</text>

  <!-- Segment labels -->
  <text x="215" y="300" fill="#334155" font-size="13" font-weight="600" text-anchor="middle">Actual revenue</text>
  <text x="490" y="300" fill="#1D4ED8" font-size="13" font-weight="600" text-anchor="middle">Forecast + 95% confidence band</text>

  <!-- Caption -->
  <text x="340" y="328" fill="#6B7280" font-size="12.5" text-anchor="middle">Not a single point estimate — it honestly shows uncertainty as a range.</text>
</svg>

<svg viewBox="0 0 920 320" xmlns="http://www.w3.org/2000/svg" font-family="'Inter','Helvetica Neue',Arial,sans-serif">
  <rect x="0" y="0" width="920" height="320" fill="#ffffff"/>

  <text x="460" y="24" fill="#334155" font-size="14" font-weight="700" text-anchor="middle">Tools aren't about memorizing names.</text>
  <text x="460" y="46" fill="#334155" font-size="14" font-weight="700" text-anchor="middle">What matters is which slot each one fills.</text>

  <!-- 1 Execution -->
  <rect x="30" y="70" width="195" height="150" rx="12" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="127.5" y="102" fill="#334155" font-size="14.5" font-weight="700" text-anchor="middle">Execution</text>
  <text x="127.5" y="130" fill="#64748B" font-size="12" text-anchor="middle">Where ads go out</text>
  <text x="127.5" y="160" fill="#94A3B8" font-size="12" text-anchor="middle">Media ads managers</text>
  <text x="127.5" y="180" fill="#94A3B8" font-size="12" text-anchor="middle">(Meta, Google, etc.)</text>

  <!-- 2 Collection -->
  <rect x="250" y="70" width="195" height="150" rx="12" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="347.5" y="102" fill="#334155" font-size="14.5" font-weight="700" text-anchor="middle">Collection</text>
  <text x="347.5" y="130" fill="#64748B" font-size="12" text-anchor="middle">What happened</text>
  <text x="347.5" y="160" fill="#94A3B8" font-size="12" text-anchor="middle">GA4 &#183; MMPs</text>
  <text x="347.5" y="180" fill="#94A3B8" font-size="12" text-anchor="middle">Event &amp; conversion logs</text>

  <!-- 3 Processing -->
  <rect x="470" y="70" width="195" height="150" rx="12" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="567.5" y="102" fill="#334155" font-size="14.5" font-weight="700" text-anchor="middle">Processing</text>
  <text x="567.5" y="130" fill="#64748B" font-size="12" text-anchor="middle">Pull and organize numbers</text>
  <text x="567.5" y="160" fill="#94A3B8" font-size="12" text-anchor="middle">Spreadsheets &#183; SQL</text>
  <text x="567.5" y="180" fill="#94A3B8" font-size="12" text-anchor="middle">BI dashboards</text>

  <!-- 4 Judgment -->
  <rect x="690" y="70" width="195" height="150" rx="12" fill="#EFF6FF" stroke="#BFDBFE"/>
  <text x="787.5" y="102" fill="#1D4ED8" font-size="14.5" font-weight="700" text-anchor="middle">Judgment</text>
  <text x="787.5" y="130" fill="#3B82F6" font-size="12" text-anchor="middle">So what do we do</text>
  <text x="787.5" y="160" fill="#94A3B8" font-size="12" text-anchor="middle">Incrementality &#183; saturation</text>
  <text x="787.5" y="180" fill="#94A3B8" font-size="12" text-anchor="middle">Allocation &#183; attribution</text>

  <!-- arrows -->
  <g stroke="#CBD5E1" stroke-width="2" fill="#CBD5E1">
    <line x1="225" y1="145" x2="242" y2="145"/><polygon points="242,140 250,145 242,150"/>
    <line x1="445" y1="145" x2="462" y2="145"/><polygon points="462,140 470,145 462,150"/>
    <line x1="665" y1="145" x2="682" y2="145"/><polygon points="682,140 690,145 682,150"/>
  </g>

  <!-- caption -->
  <text x="460" y="256" fill="#6B7280" font-size="12.5" text-anchor="middle">The slot juniors skip most often is the one on the right &#8212; reports pile up, but decisions don't.</text>
  <text x="460" y="284" fill="#94A3B8" font-size="11.5" text-anchor="middle">* The tools filling each slot differ by company. What matters is that all four slots get filled.</text>
</svg>

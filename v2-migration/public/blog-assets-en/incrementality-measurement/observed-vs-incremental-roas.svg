<svg viewBox="0 0 620 380" xmlns="http://www.w3.org/2000/svg" font-family="'Inter','Helvetica Neue',Arial,sans-serif">
  <rect x="0" y="0" width="620" height="380" fill="#ffffff"/>

  <!-- X axis -->
  <line x1="90" y1="300" x2="540" y2="300" stroke="#9CA3AF" stroke-width="1.5"/>

  <!-- Observed ROAS bar -->
  <rect x="150" y="50" width="110" height="250" fill="#93C5FD"/>
  <text x="205" y="42" fill="#1D4ED8" font-size="18" font-weight="700" text-anchor="middle">800%</text>
  <text x="205" y="322" fill="#334155" font-size="14" font-weight="600" text-anchor="middle">Observed ROAS</text>
  <text x="205" y="340" fill="#94A3B8" font-size="12" text-anchor="middle">(last-click)</text>

  <!-- Incremental ROAS bar -->
  <rect x="370" y="240.6" width="110" height="59.4" fill="#2563EB"/>
  <text x="425" y="232" fill="#1D4ED8" font-size="18" font-weight="700" text-anchor="middle">190%</text>
  <text x="425" y="322" fill="#334155" font-size="14" font-weight="600" text-anchor="middle">Incremental ROAS</text>
  <text x="425" y="340" fill="#94A3B8" font-size="12" text-anchor="middle">(holdout)</text>

  <!-- Bottom caption -->
  <text x="310" y="368" fill="#6B7280" font-size="13" text-anchor="middle">Same campaign, same data, yet this different. Budget decisions should follow the right-hand number.</text>
</svg>

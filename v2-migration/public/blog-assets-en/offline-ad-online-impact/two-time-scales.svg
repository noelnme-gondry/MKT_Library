<svg viewBox="0 0 760 340" xmlns="http://www.w3.org/2000/svg" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <rect width="760" height="340" fill="#fff"/>
  <text x="380" y="34" fill="#0f172a" font-size="17" font-weight="700" text-anchor="middle">Measure size on the long scale; check direction on the short one</text>
  <text x="200" y="64" fill="#1e3a8a" font-size="14" font-weight="700" text-anchor="middle">Long scale (weekly)</text>
  <text x="200" y="82" fill="#475569" font-size="12" text-anchor="middle">actual vs pre-flight trend</text>
  <rect x="251" y="94" width="95" height="156" rx="0" fill="#f1f5f9"/>
  <polyline points="264,196 289,192 315,189 340,185" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="6 5"/>
  <polyline points="60,227 85,218 111,223 136,209 162,214 187,205 213,209 238,200 264,145 289,118 315,127 340,141" fill="none" stroke="#2563eb" stroke-width="3"/>
  <line x1="60" y1="250" x2="340" y2="250" stroke="#94a3b8" stroke-width="2"/>
  <text x="200" y="270" fill="#475569" font-size="12" text-anchor="middle">8 weeks before → during</text>
  <text x="560" y="64" fill="#b45309" font-size="14" font-weight="700" text-anchor="middle">Short scale (hourly)</text>
  <text x="560" y="82" fill="#475569" font-size="12" text-anchor="middle">15–60 minutes after a spot</text>
  <polyline points="420,220 445,214 471,220 496,214 522,214 547,214 573,208 598,214 624,214 649,220 675,220 700,220" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 5"/>
  <polyline points="420,220 445,214 471,226 496,208 522,220 547,214 573,112 598,142 624,196 649,214 675,220 700,226" fill="none" stroke="#d97706" stroke-width="3"/>
  <line x1="420" y1="250" x2="700" y2="250" stroke="#94a3b8" stroke-width="2"/>
  <line x1="560" y1="100" x2="560" y2="250" stroke="#b45309" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="556" y="108" fill="#b45309" font-size="12" font-weight="700" text-anchor="end">Spot</text>
  <text x="560" y="270" fill="#475569" font-size="12" text-anchor="middle">vs the usual level for that weekday and hour (dashed)</text>
  <text x="200" y="290" fill="#1e3a8a" font-size="12" font-weight="700" text-anchor="middle">The main number</text>
  <text x="560" y="290" fill="#b45309" font-size="12" font-weight="700" text-anchor="middle">Direction check only (weak causal evidence)</text>
  <text x="380" y="326" fill="#475569" font-size="13" text-anchor="middle">Illustrative data. If the two scales disagree, withhold the judgment</text>
</svg>

<svg viewBox="0 0 700 380" xmlns="http://www.w3.org/2000/svg" font-family="'Inter','Helvetica Neue',Arial,sans-serif">
  <rect x="0" y="0" width="700" height="380" fill="#ffffff"/>

  <text x="350" y="34" fill="#334155" font-size="14" font-weight="700" text-anchor="middle">Same Audience, Different Outcome at Scale</text>

  <!-- case 1: small budget -->
  <rect x="50" y="60" width="280" height="230" rx="12" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="190" y="90" fill="#334155" font-size="14" font-weight="700" text-anchor="middle">&#8361;200,000/day</text>

  <!-- narrow target circle (sufficient) -->
  <circle cx="190" cy="170" r="58" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.8"/>
  <circle cx="190" cy="170" r="26" fill="#2563EB" opacity="0.75"/>
  <text x="190" y="176" fill="#ffffff" font-size="10.5" font-weight="700" text-anchor="middle">Ads</text>
  <text x="190" y="248" fill="#1D4ED8" font-size="13" font-weight="700" text-anchor="middle">Narrow Target Is Fine</text>
  <text x="190" y="270" fill="#64748B" font-size="12" text-anchor="middle">Budget too small to spike frequency</text>

  <!-- case 2: large budget -->
  <rect x="370" y="60" width="280" height="230" rx="12" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="510" y="90" fill="#334155" font-size="14" font-weight="700" text-anchor="middle">&#8361;2,000,000/day</text>

  <!-- narrow target, over-served (overflow) -->
  <circle cx="510" cy="170" r="58" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.8"/>
  <circle cx="510" cy="170" r="54" fill="#DC2626" opacity="0.72"/>
  <text x="510" y="167" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">Too Many</text>
  <text x="510" y="184" fill="#ffffff" font-size="11" text-anchor="middle">Freq Spike</text>
  <text x="510" y="248" fill="#B91C1C" font-size="13" font-weight="700" text-anchor="middle">Same Target Breaks Down</text>
  <text x="510" y="270" fill="#64748B" font-size="12" text-anchor="middle">Fatigue hits unless you widen it</text>

  <!-- caption -->
  <text x="350" y="326" fill="#6B7280" font-size="12.5" text-anchor="middle">Audience size should scale with budget. Raise it alone, and you show</text>
  <text x="350" y="348" fill="#6B7280" font-size="12.5" text-anchor="middle">the same people more often &#8212; frequency spikes and efficiency breaks.</text>
</svg>

  <g text-anchor="middle"><text x="104" y="133" fill="#334155" font-size="14" font-weight="700">Install</text><text x="104" y="153" fill="#64748B" font-size="11.5">Fast and plentiful</text><text x="270" y="133" fill="#334155" font-size="14" font-weight="700">Signup</text><text x="270" y="153" fill="#64748B" font-size="11.5">Still a shallow signal</text><text x="429" y="132" fill="#1D4ED8" font-size="15" font-weight="700">Aha Event</text><text x="429" y="155" fill="#2563EB" font-size="11.5">First act of experiencing value</text><text x="606" y="133" fill="#334155" font-size="14" font-weight="700">D7 retention · revenue</text><text x="606" y="153" fill="#64748B" font-size="11.5">Slow but closest to the business</text></g>

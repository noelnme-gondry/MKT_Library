<svg viewBox="0 0 720 370" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect width="720" height="370" fill="#fff"/>
  <text x="360" y="32" fill="#334155" font-size="15" font-weight="700" text-anchor="middle">Once found, an Aha Event must be validated by driving it and comparing.</text>
  <g stroke="#94A3B8" stroke-width="2" fill="#94A3B8"><line x1="185" y1="137" x2="208" y2="137"/><polygon points="208,132 217,137 208,142"/><line x1="350" y1="137" x2="373" y2="137"/><polygon points="373,132 382,137 373,142"/><line x1="515" y1="137" x2="538" y2="137"/><polygon points="538,132 547,137 538,142"/></g>
  <g><rect x="52" y="92" width="133" height="90" rx="10" fill="#F1F5F9" stroke="#CBD5E1"/><rect x="217" y="92" width="133" height="90" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/><rect x="382" y="92" width="133" height="90" rx="10" fill="#F1F5F9" stroke="#CBD5E1"/><rect x="547" y="92" width="121" height="90" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/></g>
  <g text-anchor="middle"><text x="118" y="123" fill="#334155" font-size="14" font-weight="700">1. Find candidates</text><text x="118" y="148" fill="#64748B" font-size="11.5">Explore early actions</text><text x="118" y="164" fill="#64748B" font-size="11.5">linked to retention</text><text x="284" y="123" fill="#1D4ED8" font-size="14" font-weight="700">2. Pick the event</text><text x="284" y="148" fill="#2563EB" font-size="11.5">Check it fires early</text><text x="284" y="164" fill="#2563EB" font-size="11.5">and often enough</text><text x="449" y="123" fill="#334155" font-size="14" font-weight="700">3. Drive in onboarding</text><text x="449" y="148" fill="#64748B" font-size="11.5">Remove friction on</text><text x="449" y="164" fill="#64748B" font-size="11.5">the path to that action</text><text x="608" y="123" fill="#1D4ED8" font-size="14" font-weight="700">4. Compare retention</text><text x="608" y="148" fill="#2563EB" font-size="11.5">Check the real gap</text><text x="608" y="164" fill="#2563EB" font-size="11.5">before and after</text></g>
  <rect x="95" y="245" width="530" height="63" rx="8" fill="#FFF7ED" stroke="#FED7AA"/><text x="360" y="272" fill="#C2410C" font-size="13.5" font-weight="700" text-anchor="middle">Do not scale it as an ad optimization goal on correlation alone.</text><text x="360" y="294" fill="#9A3412" font-size="12" text-anchor="middle">Scale only events whose effect was confirmed.</text>
  <text x="360" y="345" fill="#64748B" font-size="12.5" text-anchor="middle">Find → drive → compare → validate</text>
</svg>

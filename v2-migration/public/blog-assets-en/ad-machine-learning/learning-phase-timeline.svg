<svg viewBox="0 0 780 460" xmlns="http://www.w3.org/2000/svg" font-family="'Inter','Helvetica Neue',Arial,sans-serif">
  <rect x="0" y="0" width="780" height="460" fill="#ffffff"/>

  <text x="390" y="30" fill="#334155" font-size="14.5" font-weight="700" text-anchor="middle">Performance during the learning phase isn't your real numbers yet</text>

  <!-- Axes -->
  <line x1="100" y1="300" x2="690" y2="300" stroke="#9CA3AF" stroke-width="1.5"/>
  <line x1="100" y1="60" x2="100" y2="300" stroke="#9CA3AF" stroke-width="1.5"/>
  <text x="92" y="54" fill="#64748B" font-size="12" text-anchor="end">CPA</text>
  <text x="690" y="324" fill="#64748B" font-size="12" text-anchor="end">Time &#8594;</text>

  <!-- Learning zone -->
  <rect x="100" y="60" width="230" height="240" fill="#FEF3C7" opacity="0.45"/>
  <text x="215" y="84" fill="#B45309" font-size="13.5" font-weight="700" text-anchor="middle">Learning</text>
  <text x="215" y="104" fill="#B45309" font-size="11.5" text-anchor="middle">CPA is bouncing around</text>

  <!-- Stable zone -->
  <rect x="330" y="60" width="360" height="240" fill="#ECFDF5" opacity="0.5"/>
  <text x="510" y="84" fill="#047857" font-size="13.5" font-weight="700" text-anchor="middle">Learning complete</text>
  <text x="510" y="104" fill="#047857" font-size="11.5" text-anchor="middle">Now the numbers are trustworthy</text>

  <!-- Boundary -->
  <line x1="330" y1="60" x2="330" y2="300" stroke="#D97706" stroke-width="1.8" stroke-dasharray="6 5"/>
  <text x="330" y="322" fill="#B45309" font-size="12" font-weight="700" text-anchor="middle">Hits 50 conversions</text>

  <!-- CPA curve: bouncing then stabilizing -->
  <polyline points="120,160 148,238 176,150 204,246 232,168 260,222 288,186 316,204 330,196 370,192 410,188 460,186 510,184 570,183 630,182 675,182"
            fill="none" stroke="#2563EB" stroke-width="2.6"/>

  <!-- Stable zone average line -->
  <line x1="330" y1="186" x2="685" y2="186" stroke="#059669" stroke-width="1.6" stroke-dasharray="5 4"/>

  <!-- Pitfall markers -->
  <circle cx="148" cy="238" r="7" fill="none" stroke="#DC2626" stroke-width="2"/>
  <text x="148" y="268" fill="#DC2626" font-size="11.5" font-weight="700" text-anchor="middle">"Ooh nice!"</text>
  <circle cx="204" cy="246" r="7" fill="none" stroke="#DC2626" stroke-width="2"/>
  <text x="218" y="276" fill="#DC2626" font-size="11.5" font-weight="700" text-anchor="middle">"Ooh nice!"</text>
  <circle cx="176" cy="150" r="7" fill="none" stroke="#DC2626" stroke-width="2"/>
  <text x="176" y="136" fill="#DC2626" font-size="11.5" font-weight="700" text-anchor="middle">"Oh no!"</text>

  <!-- Captions -->
  <text x="390" y="344" fill="#6B7280" font-size="12.5" text-anchor="middle">During learning, the algorithm tests exposure on different people —</text>
  <text x="390" y="364" fill="#6B7280" font-size="12.5" text-anchor="middle">that's why CPA bounces around.</text>
  <text x="390" y="384" fill="#6B7280" font-size="12.5" text-anchor="middle">React to those bounces by pausing or tweaking the ad, and learning resets —</text>
  <text x="390" y="404" fill="#6B7280" font-size="12.5" text-anchor="middle">so it never actually finishes.</text>
  <text x="390" y="424" fill="#94A3B8" font-size="11.5" text-anchor="middle">* Meta's benchmark: 50 optimization events within 7 days.</text>
  <text x="390" y="444" fill="#94A3B8" font-size="11.5" text-anchor="middle">Thresholds vary by platform and policy, and can change.</text>
</svg>

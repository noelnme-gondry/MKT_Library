<svg viewBox="0 0 680 340" xmlns="http://www.w3.org/2000/svg" font-family="'Inter','Helvetica Neue',Arial,sans-serif">
  <rect x="0" y="0" width="680" height="340" fill="#ffffff"/>

  <!-- Y axis label -->
  <text x="34" y="150" fill="#9CA3AF" font-size="12" text-anchor="middle" transform="rotate(-90 34 150)">B − A gap (pp)</text>

  <!-- Zero baseline -->
  <line x1="70" y1="210" x2="620" y2="210" stroke="#E5E7EB" stroke-width="1"/>
  <text x="60" y="214" fill="#9CA3AF" font-size="11" text-anchor="end">0</text>

  <!-- True-difference convergence line -->
  <line x1="70" y1="176" x2="620" y2="176" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="624" y="180" fill="#64748B" font-size="11.5">True difference (+0.4pp)</text>

  <!-- Gap line (swings then converges) -->
  <polyline points="90,70 130,250 170,110 210,240 250,150 290,205 330,168 370,188 410,174 450,180 490,176 530,177 570,176 610,176"
            fill="none" stroke="#2563EB" stroke-width="2.5"/>

  <!-- Day 3 marker -->
  <circle cx="170" cy="110" r="5" fill="#DC2626"/>
  <line x1="170" y1="110" x2="170" y2="66" stroke="#DC2626" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="178" y="60" fill="#DC2626" font-size="12.5" font-weight="700">Stop on day 3, and</text>
  <text x="178" y="77" fill="#DC2626" font-size="12.5" font-weight="700">you'd misread B as a landslide</text>

  <!-- X axis -->
  <line x1="70" y1="290" x2="620" y2="290" stroke="#9CA3AF" stroke-width="1.5"/>
  <text x="90" y="308" fill="#94A3B8" font-size="11" text-anchor="middle">Day 1</text>
  <text x="350" y="308" fill="#94A3B8" font-size="11" text-anchor="middle">Days elapsed</text>
  <text x="610" y="308" fill="#94A3B8" font-size="11" text-anchor="middle">Day 14</text>

  <!-- Caption -->
  <text x="345" y="330" fill="#6B7280" font-size="13" text-anchor="middle">The gap swings wildly early on. Stop too soon, and you'll mistake noise for a real result (peeking).</text>
</svg>

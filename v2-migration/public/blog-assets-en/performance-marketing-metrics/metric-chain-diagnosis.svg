<svg viewBox="0 0 720 250" xmlns="http://www.w3.org/2000/svg" font-family="'Inter','Helvetica Neue',Arial,sans-serif">
  <rect x="0" y="0" width="720" height="250" fill="#ffffff"/>

  <!-- Status pill: CPI normal -->
  <rect x="16" y="34" width="150" height="62" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.5"/>
  <text x="91" y="60" fill="#166534" font-size="16" font-weight="700" text-anchor="middle">CPI</text>
  <text x="91" y="82" fill="#16A34A" font-size="13" font-weight="600" text-anchor="middle">✓ Normal</text>

  <!-- CPA normal -->
  <rect x="180" y="34" width="150" height="62" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.5"/>
  <text x="255" y="60" fill="#166534" font-size="16" font-weight="700" text-anchor="middle">CPA</text>
  <text x="255" y="82" fill="#16A34A" font-size="13" font-weight="600" text-anchor="middle">✓ Normal</text>

  <!-- ROAS red flag -->
  <rect x="344" y="34" width="150" height="62" rx="10" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="419" y="60" fill="#991B1B" font-size="16" font-weight="700" text-anchor="middle">ROAS</text>
  <text x="419" y="82" fill="#DC2626" font-size="13" font-weight="600" text-anchor="middle">✕ Red flag</text>

  <!-- LTV:CAC on hold -->
  <rect x="508" y="34" width="150" height="62" rx="10" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
  <text x="583" y="60" fill="#4B5563" font-size="16" font-weight="700" text-anchor="middle">LTV : CAC</text>
  <text x="583" y="82" fill="#6B7280" font-size="13" font-weight="600" text-anchor="middle">? On hold</text>

  <!-- Arrows between pills -->
  <g stroke="#CBD5E1" stroke-width="2" fill="#CBD5E1">
    <line x1="166" y1="65" x2="176" y2="65"/><polygon points="176,61 184,65 176,69"/>
    <line x1="330" y1="65" x2="340" y2="65"/><polygon points="340,61 348,65 340,69"/>
    <line x1="494" y1="65" x2="504" y2="65"/><polygon points="504,61 512,65 504,69"/>
  </g>

  <!-- Diagnosis callout -->
  <rect x="16" y="122" width="688" height="106" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="34" y="150" fill="#0F172A" font-size="14" font-weight="700">How to read this</text>
  <text x="34" y="174" fill="#334155" font-size="13.5">Conversions are being made cheaply (CPA normal), but revenue isn't following (ROAS red flag).</text>
  <text x="34" y="196" fill="#1D4ED8" font-size="13.5" font-weight="600">→ The problem isn't upstream in the ad — it's "post-conversion revenue." Check order value and targeting before running more creative.</text>
  <text x="34" y="217" fill="#94A3B8" font-size="12">LTV:CAC still has too little data — holding judgment is the honest call until more weeks accumulate.</text>
</svg>

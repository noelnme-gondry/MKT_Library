<svg viewBox="0 0 720 340" xmlns="http://www.w3.org/2000/svg" font-family="'Inter','Helvetica Neue',Arial,sans-serif">
  <rect x="0" y="0" width="720" height="340" fill="#ffffff"/>

  <!-- legend -->
  <rect x="140" y="26" width="14" height="14" rx="2" fill="#3B82F6"/>
  <text x="160" y="38" fill="#475569" font-size="12.5">Channel A · CPA ₩8,000</text>
  <rect x="350" y="26" width="14" height="14" rx="2" fill="#EF4444"/>
  <text x="370" y="38" fill="#475569" font-size="12.5">Channel B · CPA ₩12,000</text>

  <!-- Bar 1 last month -->
  <text x="132" y="132" fill="#334155" font-size="13.5" font-weight="600" text-anchor="end">Last month</text>
  <rect x="150" y="104" width="266" height="46" fill="#3B82F6"/>
  <rect x="416" y="104" width="114" height="46" fill="#EF4444"/>
  <text x="283" y="132" fill="#ffffff" font-size="13" font-weight="600" text-anchor="middle">A 70%</text>
  <text x="473" y="132" fill="#ffffff" font-size="13" font-weight="600" text-anchor="middle">B 30%</text>
  <text x="548" y="132" fill="#334155" font-size="14" font-weight="700" text-anchor="start">Avg ₩9,200</text>

  <!-- Bar 2 this month -->
  <text x="132" y="212" fill="#334155" font-size="13.5" font-weight="600" text-anchor="end">This month</text>
  <rect x="150" y="184" width="190" height="46" fill="#3B82F6"/>
  <rect x="340" y="184" width="190" height="46" fill="#EF4444"/>
  <text x="245" y="212" fill="#ffffff" font-size="13" font-weight="600" text-anchor="middle">A 50%</text>
  <text x="435" y="212" fill="#ffffff" font-size="13" font-weight="600" text-anchor="middle">B 50%</text>
  <text x="548" y="212" fill="#DC2626" font-size="14" font-weight="700" text-anchor="start">Avg ₩10,000</text>

  <!-- caption -->
  <text x="360" y="286" fill="#6B7280" font-size="12.5" text-anchor="middle">Each channel's CPA is unchanged — only pricier B's share grew, and</text>
  <text x="360" y="306" fill="#6B7280" font-size="12.5" text-anchor="middle">that alone pushed the blended average up by ₩800.</text>
  <text x="360" y="326" fill="#94A3B8" font-size="11.5" text-anchor="middle">* Share is based on number of conversions.</text>
</svg>

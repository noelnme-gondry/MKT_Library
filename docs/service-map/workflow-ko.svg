<svg xmlns="http://www.w3.org/2000/svg" width="1750" height="1110" viewBox="0 0 1750 1110" role="img" aria-labelledby="title desc"><title id="title">Growth Opt Playbook 서비스 흐름도</title><desc id="desc">브라우저의 데이터가 분석 도구와 결과로 이어지고, 사용자가 판단한 뒤 외부 플랫폼에서 실행하고 주간 리뷰로 돌아오는 흐름. 광고 자동 집행과 CSV 서버 전송은 제공하지 않음.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#7f94b4"/></marker></defs><style>text{font-family:Arial,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#f0f4fc}.title{font-size:22px;font-weight:700}.body{font-size:17px;fill:#aebed6}.small{font-size:16px}.tag{font-size:14px;font-weight:700;fill:#8aafff}.edge{fill:none;stroke:#7f94b4;stroke-width:2;marker-end:url(#arrow)}.label{font-size:14px;fill:#b6c8e4}</style><rect width="1750" height="1110" fill="#111627"/><text x="50" y="60" class="title">Growth Opt Playbook</text><text x="50" y="101" class="title">데이터를 분석하고, 결정하고, 다음 주에 검토하는 흐름</text><text x="1240" y="61" class="body">현재 제공 범위 · 2026.09.11</text><rect x="50" y="160" width="310" height="305" rx="16" fill="#182137" stroke="#344360"/><text x="72" y="196" class="title small">시작점과 입력</text><text x="72" y="228" class="body small">질문으로 도구 찾기</text><text x="72" y="254" class="body small">CSV로 가능한 분석 찾기</text><text x="72" y="280" class="body small">개별 도구 · 샘플 체험</text><text x="72" y="306" class="body small"> </text><text x="72" y="332" class="body small">CSV / 수동 입력</text><text x="72" y="358" class="body small">컬럼 매핑 · 품질 확인</text><text x="72" y="445" class="tag">원본은 브라우저에서 처리</text><rect x="420" y="160" width="670" height="550" rx="20" fill="#142342" stroke="#4278e5" stroke-dasharray="6 5"/><text x="444" y="198" class="title">목적에 맞는 분석 도구</text><text x="444" y="228" class="body">도치가 진입을 돕고, 데이터·설계 조건에 맞춰 분석</text><rect x="444" y="253" width="292" height="121" rx="16" fill="#101c32" stroke="#294979"/><text x="466" y="289" class="title small">성과와 예산</text><text x="466" y="321" class="body small">주간 성과 · 변동 분해</text><text x="466" y="347" class="body small">포화도 · 예산 배분</text><rect x="760" y="253" width="292" height="121" rx="16" fill="#101c32" stroke="#294979"/><text x="782" y="289" class="title small">실험과 증분</text><text x="782" y="321" class="body small">A/B 실험 · 홀드아웃</text><text x="782" y="347" class="body small">브랜드 캠페인 증분</text><rect x="444" y="392" width="292" height="121" rx="16" fill="#101c32" stroke="#294979"/><text x="466" y="428" class="title small">채널과 예측</text><text x="466" y="460" class="body small">추세 · 유입 · 잠식</text><text x="466" y="486" class="body small">MMM · 예측 · 공선성</text><rect x="760" y="392" width="292" height="121" rx="16" fill="#101c32" stroke="#294979"/><text x="782" y="428" class="title small">고객 행동</text><text x="782" y="460" class="body small">핵심 가치 · 생존 / 이탈</text><text x="782" y="486" class="body small">구성 변화 분석</text><rect x="444" y="531" width="292" height="121" rx="16" fill="#101c32" stroke="#294979"/><text x="466" y="567" class="title small">검색과 스토어</text><text x="466" y="599" class="body small">ASA 키워드</text><text x="466" y="625" class="body small">ASO 스토어 전환</text><rect x="760" y="531" width="292" height="121" rx="16" fill="#101c32" stroke="#294979"/><text x="782" y="567" class="title small">소재와 콘텐츠</text><text x="782" y="599" class="body small">소재 성과 · 피로도</text><text x="782" y="625" class="body small">콘텐츠 요소 분석</text><text x="444" y="692" class="tag">조건 부족은 “추정 불가”로 표시 · 결과는 자동 실행 지시가 아님</text><rect x="1150" y="160" width="550" height="210" rx="16" fill="#182137" stroke="#344360"/><text x="1172" y="196" class="title">분석 결과와 근거</text><text x="1172" y="228" class="body">핵심 지표 · 비교 차트 · 변화 설명</text><text x="1172" y="254" class="body">입력 품질 · 불확실성 · 해석 한계</text><text x="1172" y="280" class="body">상세 분석 · 다음에 확인할 항목</text><text x="1172" y="350" class="tag">관측된 차이를 인과효과로 단정하지 않음</text><rect x="1150" y="445" width="550" height="170" rx="16" fill="#30281f" stroke="#c28b38"/><text x="1172" y="481" class="title">마케터의 판단</text><text x="1172" y="513" class="body">결과를 검토하고 실행 여부·범위를 직접 결정</text><text x="1172" y="539" class="body">행동 · 기준 지표 · 목표 · 검토일을 기록</text><text x="1172" y="595" class="tag">사용자가 결정 · 시스템은 광고를 자동 변경하지 않음</text><rect x="1150" y="690" width="550" height="100" rx="16" fill="#163137" stroke="#338b91"/><text x="1172" y="726" class="title">광고 플랫폼에서 직접 실행</text><text x="1172" y="758" class="body">예산·캠페인·소재 변경은 서비스 밖에서 수행</text><rect x="1150" y="850" width="550" height="150" rx="16" fill="#182137" stroke="#344360"/><text x="1172" y="886" class="title">주간 리뷰와 다음 판단</text><text x="1172" y="918" class="body">새 CSV · 비교 가능한 기간·단위 확인</text><text x="1172" y="944" class="body">결정 기록과 관측 결과 비교 · 검토일 캘린더</text><text x="1172" y="980" class="tag">수동 재방문 · 자동 수집 / 자동 알림 없음</text><rect x="420" y="850" width="670" height="150" rx="16" fill="#182137" stroke="#344360"/><text x="442" y="886" class="title">프로젝트와 산출물</text><text x="442" y="918" class="body">분석 설정 저장 · 다음 CSV에 재사용 · 로컬 백업 / 가져오기</text><text x="442" y="944" class="body">결정 기록과 검토일 · 보고서 Word / Excel · 이용권 복원</text><text x="442" y="980" class="tag">설정·데이터 보관과 구매 권한 복원은 별개</text><rect x="50" y="550" width="310" height="145" rx="16" fill="#182137" stroke="#344360"/><text x="72" y="586" class="title small">읽고 기준 세우기</text><text x="72" y="618" class="body small">블로그 · 실무 가이드 · SOP</text><text x="72" y="644" class="body small">필요한 도구로 직접 이동</text><rect x="50" y="770" width="310" height="230" rx="16" fill="#182137" stroke="#344360"/><text x="72" y="806" class="title small">무료와 이용권</text><text x="72" y="838" class="body small">무료: 분석 · 결정 기록</text><text x="72" y="864" class="body small">프로젝트 1개 · 백업</text><text x="72" y="890" class="body small">이용권: 보고서 다운로드</text><text x="72" y="916" class="body small">여러 프로젝트 · 브랜딩</text><text x="72" y="980" class="tag">1개월 5,900원 · 자동갱신 없음</text><path d="M360 310H420" class="edge"/><path d="M1090 310H1150" class="edge"/><path d="M1425 370V445" class="edge"/><text x="1442" y="411" class="label">근거 검토</text><path d="M1425 615V690" class="edge"/><text x="1442" y="660" class="label">직접 실행</text><path d="M1425 790V850" class="edge"/><path d="M360 620H420" class="edge"/><path d="M755 710V850" class="edge"/><text x="772" y="790" class="label">보관 · 내보내기</text><path d="M1090 924H1150" class="edge"/><path d="M1425 1000V1055H25V310H50" class="edge"/><text x="595" y="1044" class="label">실행 후 새 데이터를 준비해 같은 기준으로 다시 확인</text><text x="50" y="1090" class="body">점선 영역 = 서비스 내부 분석 / 청록 영역 = 외부 실행 / 금색 영역 = 사용자 판단</text></svg>
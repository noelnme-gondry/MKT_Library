<svg xmlns="http://www.w3.org/2000/svg" width="1750" height="1110" viewBox="0 0 1750 1110" role="img" aria-labelledby="title desc"><title id="title">Growth Opt Playbook service workflow</title><desc id="desc">Local data flows into analysis tools, then findings, human decisions, external execution and a recurring review. No automatic ad execution or CSV upload.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#7f94b4"/></marker></defs><style>text{font-family:Arial,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#f0f4fc}.title{font-size:22px;font-weight:700}.body{font-size:17px;fill:#aebed6}.small{font-size:16px}.tag{font-size:14px;font-weight:700;fill:#8aafff}.edge{fill:none;stroke:#7f94b4;stroke-width:2;marker-end:url(#arrow)}.label{font-size:14px;fill:#b6c8e4}</style><rect width="1750" height="1110" fill="#111627"/><text x="50" y="60" class="title">Growth Opt Playbook</text><text x="50" y="101" class="title">From analysis to a decision — and the next review</text><text x="1240" y="61" class="body">Current capabilities · 2026.09.11</text><rect x="50" y="160" width="310" height="305" rx="16" fill="#182137" stroke="#344360"/><text x="72" y="196" class="title small">Entry points &amp; input</text><text x="72" y="228" class="body small">Find a tool by your question</text><text x="72" y="254" class="body small">Find analyses for your CSV</text><text x="72" y="280" class="body small">Open a tool or try a sample</text><text x="72" y="306" class="body small"> </text><text x="72" y="332" class="body small">CSV / manual inputs</text><text x="72" y="358" class="body small">Map columns · check quality</text><text x="72" y="445" class="tag">Source data stays in the browser</text><rect x="420" y="160" width="670" height="550" rx="20" fill="#142342" stroke="#4278e5" stroke-dasharray="6 5"/><text x="444" y="198" class="title">Analysis tools for each question</text><text x="444" y="228" class="body">Dochi guides entry; data and study design determine eligibility</text><rect x="444" y="253" width="292" height="121" rx="16" fill="#101c32" stroke="#294979"/><text x="466" y="289" class="title small">Performance &amp; budget</text><text x="466" y="321" class="body small">Weekly performance · change</text><text x="466" y="347" class="body small">Saturation · budget allocation</text><rect x="760" y="253" width="292" height="121" rx="16" fill="#101c32" stroke="#294979"/><text x="782" y="289" class="title small">Experiments &amp; incrementality</text><text x="782" y="321" class="body small">A/B tests · holdout studies</text><text x="782" y="347" class="body small">Brand campaign incrementality</text><rect x="444" y="392" width="292" height="121" rx="16" fill="#101c32" stroke="#294979"/><text x="466" y="428" class="title small">Channels &amp; forecasts</text><text x="466" y="460" class="body small">Trends · inflow · cannibalization</text><text x="466" y="486" class="body small">MMM · forecasts · collinearity</text><rect x="760" y="392" width="292" height="121" rx="16" fill="#101c32" stroke="#294979"/><text x="782" y="428" class="title small">Customer behavior</text><text x="782" y="460" class="body small">Aha moments · survival / churn</text><text x="782" y="486" class="body small">Composition change</text><rect x="444" y="531" width="292" height="121" rx="16" fill="#101c32" stroke="#294979"/><text x="466" y="567" class="title small">Search &amp; store</text><text x="466" y="599" class="body small">ASA keywords</text><text x="466" y="625" class="body small">ASO store conversion</text><rect x="760" y="531" width="292" height="121" rx="16" fill="#101c32" stroke="#294979"/><text x="782" y="567" class="title small">Creative &amp; content</text><text x="782" y="599" class="body small">Creative performance · fatigue</text><text x="782" y="625" class="body small">Content element analysis</text><text x="444" y="692" class="tag">Insufficient evidence stays unknown; results do not execute actions</text><rect x="1150" y="160" width="550" height="210" rx="16" fill="#182137" stroke="#344360"/><text x="1172" y="196" class="title">Findings &amp; evidence</text><text x="1172" y="228" class="body">Key metrics · comparison charts · observed changes</text><text x="1172" y="254" class="body">Input quality · uncertainty · interpretation limits</text><text x="1172" y="280" class="body">Detailed analyses · what to check next</text><text x="1172" y="350" class="tag">Observed differences do not establish causation</text><rect x="1150" y="445" width="550" height="170" rx="16" fill="#30281f" stroke="#c28b38"/><text x="1172" y="481" class="title">Marketer decision</text><text x="1172" y="513" class="body">Review evidence and choose whether and how to act</text><text x="1172" y="539" class="body">Record action, metric, target and review date</text><text x="1172" y="595" class="tag">Human decision · no automatic ad changes</text><rect x="1150" y="690" width="550" height="100" rx="16" fill="#163137" stroke="#338b91"/><text x="1172" y="726" class="title">Execute directly in your ad platform</text><text x="1172" y="758" class="body">Budget, campaign and creative edits happen outside this service</text><rect x="1150" y="850" width="550" height="150" rx="16" fill="#182137" stroke="#344360"/><text x="1172" y="886" class="title">Weekly review &amp; next decision</text><text x="1172" y="918" class="body">New CSV · comparable periods and units</text><text x="1172" y="944" class="body">Compare decisions with outcomes · calendar export</text><text x="1172" y="980" class="tag">Return manually · no automatic collection or alerts</text><rect x="420" y="850" width="670" height="150" rx="16" fill="#182137" stroke="#344360"/><text x="442" y="886" class="title">Projects &amp; deliverables</text><text x="442" y="918" class="body">Save analysis settings · reuse with a new CSV · local backup / import</text><text x="442" y="944" class="body">Decision records and review dates · Word / Excel reports · pass recovery</text><text x="442" y="980" class="tag">Project backup and purchased access recovery are separate</text><rect x="50" y="550" width="310" height="145" rx="16" fill="#182137" stroke="#344360"/><text x="72" y="586" class="title small">Read &amp; establish criteria</text><text x="72" y="618" class="body small">Blog · practical guides · SOP</text><text x="72" y="644" class="body small">Go directly to a relevant tool</text><rect x="50" y="770" width="310" height="230" rx="16" fill="#182137" stroke="#344360"/><text x="72" y="806" class="title small">Free &amp; report pass</text><text x="72" y="838" class="body small">Free: analysis · decision notes</text><text x="72" y="864" class="body small">One project · backups</text><text x="72" y="890" class="body small">Pass: report downloads</text><text x="72" y="916" class="body small">Multiple projects · branding</text><text x="72" y="980" class="tag">KRW 5,900 / month · no auto-renewal</text><path d="M360 310H420" class="edge"/><path d="M1090 310H1150" class="edge"/><path d="M1425 370V445" class="edge"/><text x="1442" y="411" class="label">Review evidence</text><path d="M1425 615V690" class="edge"/><text x="1442" y="660" class="label">Manual action</text><path d="M1425 790V850" class="edge"/><path d="M360 620H420" class="edge"/><path d="M755 710V850" class="edge"/><text x="772" y="790" class="label">Save · export</text><path d="M1090 924H1150" class="edge"/><path d="M1425 1000V1055H25V310H50" class="edge"/><text x="595" y="1044" class="label">After execution, prepare new data and review on comparable terms</text><text x="50" y="1090" class="body">Dashed area: analysis tools / Teal: external execution / Gold: human judgment</text></svg>
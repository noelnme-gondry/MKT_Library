name: Quality gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full_browser_suite:
        description: Run every browser viewport combination
        type: boolean
        default: true

concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# 저장소 읽기만 한다 — 토큰 권한을 최소로 둔다(CodeQL actions/missing-workflow-permissions).
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: fixture
          POSTGRES_DB: payment_tests
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: v2-migration
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: v2-migration/package-lock.json
      - run: npm ci
      - name: Check production dependency advisories
        run: npm audit --omit=dev --audit-level=moderate
      - run: npm run test:all
        env:
          PAYMENTS_TEST_DATABASE_URL: postgresql://postgres:fixture@localhost:5432/payment_tests
      - run: npm run lint
      - run: npm run build

  # PR은 전체 데스크톱 기능 + 핵심 모바일 경로 + EN/라이트 검사로 중복 화면 조합을 줄인다.
  # 전체 조합은 workflow_dispatch에서 실행한다. 머지 뒤 main에서는 validate만 다시 확인한다.
  browser-shard:
    if: github.event_name != 'push'
    name: browser-quality shard ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    defaults:
      run:
        working-directory: v2-migration
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: v2-migration/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # 브라우저 테스트는 빌드본으로 돈다(dev 서버의 요청마다 컴파일을 없앤다).
      - run: npm run build
      # account-mappings는 아래 전체 데스크톱 범위에 포함되므로 따로 중복 실행하지 않는다.
      - run: npm run test:e2e -- --shard=${{ matrix.shard }}/4
        env:
          E2E_SERVER: production
          E2E_SCOPE: ${{ github.event_name == 'workflow_dispatch' && inputs.full_browser_suite && 'full' || 'representative' }}
      - name: Preserve browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-evidence-${{ matrix.shard }}
          path: |
            v2-migration/test-results/
            v2-migration/playwright-report/
          retention-days: 7

  browser-quality:
    if: always() && github.event_name != 'push'
    needs: browser-shard
    runs-on: ubuntu-latest
    steps:
      - name: All browser shards passed
        run: test "${{ needs.browser-shard.result }}" = "success"

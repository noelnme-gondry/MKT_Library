name: Quality gate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: fixture
          POSTGRES_DB: payment_tests
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: v2-migration
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: v2-migration/package-lock.json
      - run: npm ci
      - run: npm run test:all
        env:
          PAYMENTS_TEST_DATABASE_URL: postgresql://postgres:fixture@localhost:5432/payment_tests
      - run: npm run lint
      - run: npm run build

  browser-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2-migration
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: v2-migration/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

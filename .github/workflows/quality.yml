name: Quality gate

on:
  pull_request:
  push:
    branches: [main]

# 저장소 읽기만 한다 — 토큰 권한을 최소로 둔다(CodeQL actions/missing-workflow-permissions).
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: fixture
          POSTGRES_DB: payment_tests
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: v2-migration
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: v2-migration/package-lock.json
      - run: npm ci
      - name: Check production dependency advisories
        run: npm audit --omit=dev --audit-level=moderate
      - run: npm run test:all
        env:
          PAYMENTS_TEST_DATABASE_URL: postgresql://postgres:fixture@localhost:5432/payment_tests
      - run: npm run lint
      - run: npm run build

  # 브라우저 테스트(약 2,000건 × 4개 화면 조건)는 한 작업에서 58분이 걸렸다. 같은 범위를 4개로 나눠
  # 동시에 돌린다(공개 저장소라 러너 시간은 무료다). 필수 검사 이름 browser-quality는 아래 집계 작업이 유지한다.
  browser-shard:
    name: browser-quality shard ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    defaults:
      run:
        working-directory: v2-migration
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: v2-migration/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # 브라우저 테스트는 빌드본으로 돈다(dev 서버의 요청마다 컴파일을 없앤다).
      - run: npm run build
      - name: Verify account mapping before the full browser suite
        if: matrix.shard == 1
        run: npx playwright test e2e/account-mappings.spec.js --project=desktop-1440
        env:
          E2E_SERVER: production
      - run: npm run test:e2e -- --shard=${{ matrix.shard }}/4
        env:
          E2E_SERVER: production
      - name: Preserve browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-evidence-${{ matrix.shard }}
          path: |
            v2-migration/test-results/
            v2-migration/playwright-report/
          retention-days: 7

  browser-quality:
    if: always()
    needs: browser-shard
    runs-on: ubuntu-latest
    steps:
      - name: All browser shards passed
        run: test "${{ needs.browser-shard.result }}" = "success"

name: Quality gate

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  # 새 커밋이 같은 PR 또는 main에 도착하면 오래된 검증은 결과로 쓰이지 않는다.
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: fixture
          POSTGRES_DB: payment_tests
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: v2-migration
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: v2-migration/package-lock.json
      - run: npm ci
      - name: Check production dependency advisories
        run: npm audit --omit=dev --audit-level=moderate
      - run: npm run test:all
        env:
          PAYMENTS_TEST_DATABASE_URL: postgresql://postgres:fixture@localhost:5432/payment_tests
      - run: npm run lint
      - run: npm run build

  browser-quality:
    # 전체 E2E는 PR에서 한 번만 수행한다. main에서는 validate가 병합본을 다시 확인한다.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2-migration
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: v2-migration/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # 브라우저 테스트는 빌드본으로 돈다(dev 서버의 요청마다 컴파일을 없앤다).
      - run: npm run build
      - name: Verify account mapping before the full browser suite
        run: npx playwright test e2e/account-mappings.spec.js --project=desktop-1440
        env:
          E2E_SERVER: production
      - run: npm run test:e2e
        env:
          E2E_SERVER: production
      - name: Preserve browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-evidence
          path: |
            v2-migration/test-results/
            v2-migration/playwright-report/
          retention-days: 7
